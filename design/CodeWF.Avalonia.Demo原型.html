<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark" data-palette="indigo" data-density="cozy">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CodeWF.Avalonia.Demo — 原型</title>
<style>
/* ═══════════ 色板与颜色令牌 ═══════════
 * 全部颜色（含 :root[data-theme=light|dark] 回退与 8 套配色）由
 * assets/palette-tokens.css 提供（scripts/prototype/generate-palette-tokens.cjs 生成，禁止手写）。
 * 本块只保留与配色无关的静态变量（字号 / 间距 / 密度）。 */
:root{
  /* 外观字号令牌（对应 Markdown 排版主题接管字号前的基础值） */
  --fs-crumb:11px;--fs-h1:22px;--fs-dsc:13px;--fs-tag:11px;--fs-code:12.5px;--fs-body:14px;
  /* 间距节奏：4 / 8 / 12 / 16 */
  --sp1:4px;--sp2:8px;--sp3:12px;--sp4:16px;
  --density:var(--sp2);
  /* 圆角三档与海拔阴影：小控件 6 / 卡片面板 10 / 窗口浮层 14 */
  --r1:6px;--r2:10px;--r3:14px;
  --e1:0 1px 2px rgba(0,0,0,.05),0 1px 3px rgba(0,0,0,.07);
  --e2:0 4px 16px rgba(0,0,0,.10),0 1px 4px rgba(0,0,0,.07);
  --e3:0 24px 70px rgba(0,0,0,.42),0 2px 10px rgba(0,0,0,.28);
}

/* 密度：舒适 / 紧凑（属性面板密度切换） */
[data-density=compact]{--density:var(--sp1)}
[data-density=compact] .dt{height:auto}
[data-density=compact] .tree .lf{height:22px}

/* ═══════════ 桌面背景 + 窗口卡片（不铺满，看得出是桌面软件） ═══════════ */
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:
    radial-gradient(1200px 600px at 20% 0%,#16162a 0%,transparent 60%),
    radial-gradient(1000px 700px at 85% 100%,#101726 0%,transparent 55%),
    linear-gradient(135deg,#0a0a12 0%,#0d101c 100%);
  display:flex;align-items:center;justify-content:center;
  padding:14px;font:14px/1.65 "Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;color:var(--tx);
  overflow:hidden;user-select:none;
}
.win{
  width:min(1480px,100%);height:100%;min-height:640px;
  background:var(--bg);border-radius:var(--r3);overflow:hidden;
  border:1px solid rgba(255,255,255,.14);
  box-shadow:var(--e3);
  display:grid;grid-template-rows:34px 32px auto 1fr 28px;
}
button,input,select,textarea{font:inherit;color:inherit}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:var(--bd);border-radius:5px;border:2px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-thumb:hover{background:var(--tx3)}

/* ═══ 通用：线性图标（stroke 走 currentColor，对齐 IconPark / TDesign 风格） ═══ */
.svgic{display:block;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none;transition:transform .16s ease}
.svgic.s14{width:14px;height:14px}
.svgic.s16{width:16px;height:16px}
.svgic.s18{width:18px;height:18px}
.svgic.s20{width:20px;height:20px}
.svgic.s22{width:22px;height:22px}

/* ═══ 1. 标题栏 34px（CodeWFWindow） ═══ */
.cap{display:flex;align-items:center;height:34px;padding-left:10px;gap:8px;position:relative;
  background:var(--bg2); /* §15：标题栏为中性表面（studio.css .cap 再覆为 --bg），主色不做大面积底 */
  border-bottom:1px solid var(--bd)}
.cap .logo{width:20px;height:20px;border-radius:5px;display:block;flex:none;
  box-shadow:0 1px 5px rgba(0,0,0,.3),0 0 0 1px rgba(255,255,255,.22)}
.cap .lg{font-weight:700;color:#fff;letter-spacing:.4px;font-size:13px;text-shadow:0 1px 2px rgba(0,0,0,.35)}
.cap .vbadge{font-size:10px;padding:0 7px;line-height:16px;border-radius:999px;color:#fff;
  background:rgba(255,255,255,.20);border:1px solid rgba(255,255,255,.34)}
.cap .sp{flex:1}
.cap select{height:22px;font-size:11px;border:1px solid var(--bd);border-radius:4px;background:var(--bg);color:var(--tx)}
.cap .wb{width:40px;height:34px;display:flex;align-items:center;justify-content:center;
  border:none;background:transparent;cursor:pointer;color:var(--tx2);transition:background .12s,color .12s}
.cap .wb svg{width:12px;height:12px;stroke:currentColor;stroke-width:1.3;fill:none;stroke-linecap:round;stroke-linejoin:round}
.cap .wb:hover{background:var(--hov);color:var(--tx)}
.cap .wb:focus-visible{outline:2px solid var(--pri);outline-offset:-2px}
.cap .wb.cls:hover{background:var(--err);color:var(--on-primary)}

/* ═══ 2. Ribbon 页签行 32px ═══ */
.rtabs{display:flex;align-items:center;height:32px;padding:0 10px;gap:2px;background:var(--bg);border-bottom:1px solid var(--bd)}
.qk{display:flex;align-items:center;gap:2px;margin-right:10px;padding-right:12px;border-right:1px solid var(--bd2)}
.qk button{width:28px;height:26px;display:flex;align-items:center;justify-content:center;border:none;background:transparent;
  border-radius:4px;cursor:pointer;color:var(--tx2);transition:background .12s,color .12s}
.qk button:hover{background:var(--hov);color:var(--pri)}
.qk button:focus-visible{outline:2px solid var(--pri);outline-offset:-2px}
.rt2{display:flex;align-items:center;height:100%;gap:2px;overflow-x:auto;overflow-y:hidden;flex-wrap:nowrap}
.rt2 .t2{display:inline-flex;align-items:center;gap:6px;flex:none;padding:0 14px;height:100%;cursor:pointer;
  color:var(--tx2);font-size:12.5px;user-select:none;letter-spacing:.6px;position:relative;white-space:nowrap;
  border-radius:4px 4px 0 0;transition:background .12s,color .12s}
.rt2 .t2 .svgic{display:inline-block;vertical-align:-2px}
.rt2 .t2:hover{color:var(--pri);background:var(--hov)}
.rt2 .t2:focus-visible{outline:2px solid var(--pri);outline-offset:-4px}
.rt2 .t2.on{color:var(--pri);font-weight:600}
.rt2 .t2.on::after{content:"";position:absolute;left:14px;right:14px;bottom:0;height:2px;background:var(--pri);border-radius:2px 2px 0 0}
.qk2{margin-left:auto;display:flex;align-items:center;gap:2px;padding-left:10px}
.qk2 button{height:26px;display:inline-flex;align-items:center;gap:6px;border:1px solid transparent;background:transparent;
  border-radius:4px;cursor:pointer;color:var(--tx2);font-size:11px;padding:0 9px;white-space:nowrap;
  transition:background .12s,color .12s,border-color .12s}
.qk2 button:hover{background:var(--hov);color:var(--pri);border-color:var(--bd)}
.qk2 button .kbd{color:var(--tx3);font-size:10px;letter-spacing:.2px}
.qk2 button:focus-visible{outline:2px solid var(--pri);outline-offset:-2px}

/* ═══ 3. Ribbon 命令区：46px 紧凑单行命令条（小图标 + 完整 API 名），0 收起 ═══ */
.rbn{background:var(--bg);border-bottom:1px solid var(--bd);padding:0 var(--sp3);
  height:46px;display:flex;align-items:stretch;overflow-x:auto;overflow-y:hidden;
  transition:height .16s ease,padding .16s ease,opacity .12s ease}
body.rmn .rbn{padding-top:0;padding-bottom:0;height:0;opacity:0;border-bottom:none;overflow:hidden}
.grp{display:flex;flex-direction:row;align-items:center;gap:2px;padding:0 var(--sp3);border-right:1px solid var(--bd2);flex:none}
.grp:last-child{border-right:none}
.grp .cmds{display:flex;gap:2px;flex:1;align-items:center;flex-wrap:nowrap}
.grp .gname{display:none}
.cbtn{display:flex;flex-direction:row;align-items:center;justify-content:flex-start;gap:7px;
  width:auto;height:32px;padding:0 9px;border:none;background:transparent;cursor:pointer;
  border-radius:var(--r1);color:var(--tx);transition:background .13s ease}
.cbtn:hover{background:var(--hov)}
.cbtn:hover .svgic{transform:none}
.cbtn:active{background:var(--pri-lt)}
.cbtn:focus-visible{outline:2px solid var(--pri);outline-offset:-2px}
.cbtn[aria-pressed=true]{background:var(--sel);color:var(--pri)}
.cbtn.on{background:var(--sel);color:var(--pri)}
.cbtn .ic{height:16px;display:flex;align-items:center;justify-content:center;color:var(--tx2);transition:color .13s ease}
.cbtn .lb{font-size:12px;line-height:1.3;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:200px}
.cbtn:hover .ic,.cbtn[aria-pressed=true] .ic,.cbtn.on .ic{color:var(--pri)}
.cbtn:disabled,.cbtn[disabled]{opacity:.45;cursor:not-allowed;background:transparent}

/* ═══ 4. 主内容 = Dock 工作区 ═══ */
.main{flex:1;min-height:0;display:flex;flex-direction:column;gap:var(--sp2);padding:var(--sp2) 10px;background:var(--workbg);overflow:hidden}
.dockrow{flex:1;min-height:0;display:flex;gap:var(--sp2)}
.panel{background:var(--bg);border:1px solid var(--bd2);border-radius:var(--r2);display:flex;flex-direction:column;
  overflow:hidden;min-height:0;box-shadow:none}
.phd{display:flex;align-items:center;height:34px;flex:none;padding:0 12px;background:transparent;
  border-bottom:1px solid var(--bd2);font-size:11px;font-weight:600;color:var(--tx3);gap:7px;letter-spacing:.6px}
.phd .hdic{color:var(--tx3);display:flex;align-items:center}
.phd .cnt{margin-left:auto;font-weight:600;color:var(--tx3);font-size:10px;background:var(--bg3);
  border-radius:999px;padding:0 7px;line-height:16px}
.phd .tb{display:flex;gap:2px;margin-left:6px}
.phd .tb button{min-width:24px;height:20px;display:inline-flex;align-items:center;justify-content:center;
  border:none;background:transparent;cursor:pointer;border-radius:3px;
  color:var(--tx2);font-size:11px;white-space:nowrap;padding:0 5px;transition:background .12s,color .12s}
.phd .tb button:hover{background:var(--pri-lt);color:var(--pri)}
.phd .tb button:focus-visible{outline:2px solid var(--pri);outline-offset:-2px}
/* 日志面板右上角关闭（Dock Tool 语义，可经 Ribbon「视图」重新打开） */
.phd .phd-x{margin-left:auto;width:22px;height:22px;display:flex;align-items:center;justify-content:center;border:none;background:transparent;border-radius:5px;color:var(--tx3);cursor:pointer;padding:0}
.phd .phd-x:hover{background:var(--hov);color:var(--tx)}
.phd .phd-x:focus-visible{outline:2px solid var(--pri);outline-offset:-2px}
.phd .phd-x svg{width:12px;height:12px;stroke:currentColor;stroke-width:1.6;fill:none;stroke-linecap:round}
/* 属性面板折叠按钮：位于属性面板左边框外侧最下方，由属性区自管显隐 */
.props-collapse{position:absolute;bottom:10px;right:calc(var(--document-properties-width,260px) + 10px);transform:translateX(50%);width:22px;height:22px;display:flex;align-items:center;justify-content:center;
  border:1px solid var(--bd2);border-radius:999px;background:var(--bg);color:var(--tx3);cursor:pointer;z-index:6;padding:0;transition:color .15s,border-color .15s}
.props-collapse:hover{color:var(--pri);border-color:var(--pri)}
.props-collapse:focus-visible{outline:2px solid var(--pri);outline-offset:1px}
.props-collapse svg{width:12px;height:12px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round;transition:transform .18s}
body.hideR .props-collapse{right:0}
body.hideR .props-collapse svg{transform:rotate(180deg)}
/* 日志面板右键菜单（镜像原生 LogView 上下文菜单） */
.ctx-menu{position:fixed;z-index:120;min-width:150px;padding:5px;background:var(--bg);border:1px solid var(--bd2);border-radius:var(--r1);box-shadow:var(--e2)}
.ctx-menu button{display:block;width:100%;padding:7px 12px;border:none;background:transparent;border-radius:5px;text-align:left;font-size:12.5px;color:var(--tx);cursor:pointer}
.ctx-menu button:hover{background:var(--hov);color:var(--pri)}
.pbd{flex:1;min-height:0;overflow:auto}
.p-nav{width:224px;flex:none}
body.hideL .p-nav{display:none}
.p-props{width:266px;flex:none}
body.hideR .p-props{display:none}
.p-log{height:150px;flex:none}
body.hideLog .p-log{display:none}

/* 左：导航树（含就地重命名 / 过滤 / 空态） */
.tree{padding:5px}
.tree .fnd{display:flex;gap:4px;padding:2px 4px 6px}
.tree .fnd input{flex:1;height:24px;font-size:11.5px;padding:0 7px;border:1px solid var(--bd);border-radius:5px;background:var(--bg);color:var(--tx)}
.tree .fnd input:focus{outline:none;border-color:var(--pri)}
.tree .nd{user-select:none}
.tree .nd .hd{display:flex;align-items:center;gap:5px;height:27px;padding:0 6px;border-radius:5px;cursor:pointer;color:var(--tx)}
.tree .nd .hd:hover{background:var(--hov)}
.tree .nd .hd .arw{width:12px;font-size:9px;color:var(--tx3);transition:transform .12s}
.tree .nd.open>.hd .arw{transform:rotate(90deg)}
.tree .nd .hd .gi{font-size:12px}
.tree .nd .kids{display:none;margin-left:15px;border-left:1px solid var(--bd2);padding-left:5px}
.tree .nd.open>.kids{display:block}
.tree .lf{display:flex;align-items:center;gap:6px;height:26px;padding:0 6px 0 10px;border-radius:5px;
  cursor:pointer;color:var(--tx2);font-size:12px}
.tree .lf:hover{background:var(--hov);color:var(--tx)}
.tree .lf.on{background:var(--sel);color:var(--pri);font-weight:600}
.tree .lf .ic{font-size:11px}
.tree .lf .sp2{flex:1}
.tree .lf .hbtn{visibility:hidden;border:none;background:transparent;color:var(--tx3);cursor:pointer;font-size:11px}
.tree .lf:hover .hbtn{visibility:visible}
.tree .lf .hbtn:hover{color:var(--pri)}
.tree .lf input.rnm{width:100%;height:20px;font-size:12px;padding:0 4px;border:1px solid var(--pri);border-radius:3px;background:var(--bg);color:var(--tx)}
.tree .empty{padding:14px 10px;color:var(--tx3);font-size:11px;text-align:center}

/* 中：文档面板（圆角顶部页签 + 空态） */
.dts{display:flex;align-items:flex-end;height:34px;flex:none;padding:4px 10px 0;gap:2px;background:var(--bg2);
  border-bottom:1px solid var(--bd);overflow-x:auto}
.dts .dkb{display:flex;gap:2px;margin-right:6px;align-self:center}
.dts .dkb button{border:none;background:transparent;border-radius:var(--r1);padding:3px 7px;
  cursor:pointer;font-size:11px;color:var(--tx3)}
.dts .dkb button:hover{background:var(--hov);color:var(--pri)}
.dts .dkb button:focus-visible{outline:2px solid var(--pri);outline-offset:1px}
.dt{display:flex;align-items:center;gap:8px;padding:0 9px 0 12px;height:30px;cursor:pointer;font-size:12.5px;color:var(--tx2);
  background:transparent;border:1px solid transparent;border-bottom:none;
  border-radius:var(--r1) var(--r1) 0 0;user-select:none;white-space:nowrap}
.dt:hover{color:var(--tx)}
.dt.on{background:var(--bg);border-color:var(--bd2);color:var(--tx);font-weight:600;box-shadow:inset 0 2px 0 var(--pri)}
.dt .x{width:14px;height:14px;display:flex;align-items:center;justify-content:center;border-radius:3px;font-size:10px;color:var(--tx3)}
.dt .x:hover{background:var(--err);color:var(--on-primary)}
.dbody{flex:1;min-height:0;overflow:auto;padding:var(--sp3) var(--sp4) 26px}
.doc .crumb{font-size:12px;color:var(--tx3);margin-bottom:6px;display:flex;align-items:center;gap:6px}
.doc .crumb svg{color:var(--tx3)}
.doc h1{font-size:19px;margin-bottom:4px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.doc .alias{font-size:11.5px;color:var(--tx3);font-family:Consolas,monospace;margin:-2px 0 6px;letter-spacing:.2px}
.doc .dsc{color:var(--tx2);font-size:var(--fs-dsc);margin-bottom:var(--sp3);line-height:1.7}
.ftg{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.ftg span{font-size:var(--fs-tag);padding:1px 9px;border-radius:10px;background:var(--pri-lt);color:var(--pri);font-weight:600}
.smt{display:inline-flex;border:1px solid var(--bd);border-radius:6px;overflow:hidden;margin-bottom:14px}
.smt button{border:none;background:var(--bg2);padding:4px 18px;cursor:pointer;font-size:11px;color:var(--tx2)}
.smt button.on{background:var(--pri);color:var(--on-primary);font-weight:600}
.smcode{background:var(--bg3);border:1px solid var(--bd2);border-radius:6px;padding:12px 14px;
  font-family:Consolas,monospace;font-size:var(--fs-code);line-height:1.65;white-space:pre;overflow:auto;
  max-height:300px;margin-bottom:14px;color:var(--tx)}
.demo{border:1px solid var(--bd2);border-radius:8px;padding:var(--sp4);background:var(--bg);margin-bottom:var(--sp3)}
.demo h4{font-size:12px;color:var(--tx3);font-weight:600;margin-bottom:10px;letter-spacing:.5px}
.row{display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.hint{font-size:11px;color:var(--tx3);margin-top:8px;line-height:1.6}
.btn{border:1px solid var(--bd);background:var(--bg);border-radius:5px;padding:5px 16px;cursor:pointer;font-size:12px}
.btn:hover{border-color:var(--pri);color:var(--pri)}
.btn:focus-visible{outline:2px solid var(--pri);outline-offset:1px}
.btn.pri{border-color:var(--pri);color:var(--pri);background:var(--pri-lt)}
.btn.danger{border-color:var(--err);color:var(--err)}
.btn.danger:hover{background:var(--err);color:var(--on-primary);border-color:var(--err)}
.btn:disabled{opacity:.45;cursor:not-allowed}

/* Markdown */
.mdr{max-width:780px;font-size:var(--fs-body);line-height:1.85}
.mdr h1,.mdr h2,.mdr h3{color:var(--pri);margin:12px 0 8px}
.mdr p{margin:8px 0}
.mdr code{background:var(--bg3);padding:1px 6px;border-radius:3px;font-family:Consolas,monospace;font-size:12px}
.mdr pre{background:var(--bg3);border:1px solid var(--bd2);border-radius:6px;padding:10px 14px;overflow:auto;
  font-family:Consolas,monospace;font-size:12px;margin:10px 0;line-height:1.6}
.mdr blockquote{border-left:3px solid var(--pri);padding:4px 14px;margin:10px 0;background:var(--pri-lt);border-radius:0 4px 4px 0}
.mdr table{border-collapse:collapse;margin:10px 0;font-size:12px}
.mdr th,.mdr td{border:1px solid var(--bd);padding:5px 14px}
.mdr th{background:var(--bg2)}
.mdr ul{padding-left:22px}
.mdr input[type=checkbox]{accent-color:var(--pri)}

/* DataGrid */
.dg{border-collapse:collapse;width:100%;font-size:12.5px}
.dg th,.dg td{padding:8px 14px;text-align:left}
.dg th{background:transparent;font-weight:600;color:var(--tx2);border-bottom:1px solid var(--bd);cursor:pointer;user-select:none;white-space:nowrap}
.dg th:hover{background:var(--hov)}
.dg th .arr{color:var(--pri);margin-left:3px}
.dg tbody tr{border-bottom:1px solid var(--bd2)}
.dg tbody tr:hover{background:var(--hov)}
.dg tbody tr.on{background:var(--sel)}

/* 右：属性面板 */
.pgp{padding:2px 6px 12px}
.pgp .cat{font-size:10px;font-weight:700;color:var(--pri);padding:9px 4px 3px;letter-spacing:1px;
  border-bottom:1px solid var(--bd2);margin-bottom:3px;text-transform:uppercase}
.pgp .rw{display:grid;grid-template-columns:100px 1fr;align-items:center;min-height:28px;padding:1px 4px 1px 7px;border-radius:4px;gap:6px;position:relative}
.pgp .rw:hover{background:var(--hov)}
.pgp .rw.mod::before{content:"";position:absolute;left:0;top:4px;bottom:4px;width:2px;border-radius:2px;background:var(--pri)}
.pgp .rw.mod label{color:var(--tx);font-weight:600}
.pgp label{font-size:11px;color:var(--tx2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pgp .ctl{display:flex;justify-content:flex-end}
.pgp .ctl input[type=text],.pgp .ctl select{width:100%;height:24px;font-size:11px;padding:0 6px;text-align:left;
  border:1px solid var(--bd);border-radius:4px;background:var(--bg);color:var(--tx);outline:none}
.pgp .ctl input:focus,.pgp .ctl select:focus{border-color:var(--pri)}
.pgp .ctl input[type=range]{width:100%;accent-color:var(--pri)}
.pgp .switch{width:32px;height:17px;border-radius:9px;background:var(--bd);position:relative;cursor:pointer;transition:background .12s}
.pgp .switch.on{background:var(--pri)}
.pgp .switch::after{content:"";position:absolute;width:13px;height:13px;border-radius:50%;background:#fff;top:2px;left:2px;transition:left .12s}
.pgp .switch.on::after{left:17px}
.pgp-empty{padding:16px 10px;color:var(--tx3);font-size:11px;line-height:1.7}

/* 底部日志面板 */
.p-log .pbd{padding:4px 8px;font-family:Consolas,monospace;font-size:11px;line-height:1.8;background:var(--bg)}
.ll1{color:var(--ok)}.ll2{color:var(--warn)}.ll3{color:var(--err)}
.p-log .ltm{color:var(--tx3);margin-right:10px}

/* 状态组件（色带用深色，正文对比度 ≥ 4.5:1；卡片正文走 --tx2 而非白字） */
.sbadge{display:inline-flex;align-items:center;gap:5px;padding:2px 10px;border-radius:4px;font-size:11px;color:var(--badge-text);margin-right:8px}
.sbadge::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--badge-text)}
.scard{width:190px;border:1px solid var(--bd);border-radius:8px;overflow:hidden;margin-right:12px;margin-bottom:10px;display:inline-block;vertical-align:top}
.scard .h{padding:8px 12px;font-size:12px;font-weight:600;color:var(--badge-text);display:flex;justify-content:space-between;align-items:center}
.scard .b{padding:10px 12px;font-size:11px;color:var(--tx2);line-height:1.7;min-height:52px}
.k-debug{background:var(--badge-debug)}.k-info{background:var(--badge-info)}.k-warn{background:var(--badge-warn)}.k-error{background:var(--badge-error)}.k-fatal{background:var(--badge-fatal)}
.busy .barwrap{max-width:420px;margin:0 auto 12px}

/* Transfer */
.trf{display:flex;gap:10px;align-items:center}
.trf .col{width:230px;border:1px solid var(--bd);border-radius:6px;overflow:hidden;background:var(--bg)}
.trf .col .hd{padding:5px 10px;background:var(--bg2);font-size:11px;color:var(--tx2);display:flex;justify-content:space-between}
.trf .col .ls{height:190px;overflow:auto}
.trf .it{padding:4px 10px;font-size:12px;cursor:pointer;display:flex;justify-content:space-between}
.trf .it:hover{background:var(--hov)}
.trf .it.on{background:var(--sel);color:var(--pri)}
.trf .mid{display:flex;flex-direction:column;gap:6px}
.trf .mid button{width:30px;height:26px;border:1px solid var(--bd);background:var(--bg);border-radius:4px;cursor:pointer;color:var(--pri)}
.trf .mid button:hover{background:var(--pri-lt)}

/* Guide */
.guide-mask{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:90;display:none}
.guide-mask.on{display:block;animation:fadein .18s ease}
.guide-spot{position:fixed;border:2px solid var(--pri);border-radius:8px;box-shadow:0 0 0 9999px rgba(0,0,0,.55);z-index:91;display:none;pointer-events:none;transition:all .25s ease}
.guide-tip{position:fixed;z-index:92;background:var(--bg);border:1px solid var(--pri);border-radius:8px;
  padding:12px 16px;max-width:300px;display:none;box-shadow:0 8px 30px rgba(0,0,0,.3)}
.guide-tip.on{animation:pop .2s cubic-bezier(.2,.9,.3,1.3)}
.guide-tip .t{font-weight:700;color:var(--pri);margin-bottom:4px;font-size:13px}
.guide-tip .d{font-size:11px;color:var(--tx2);line-height:1.6;margin-bottom:8px}
.guide-tip .nav{display:flex;justify-content:space-between;align-items:center;gap:8px}
.guide-tip .nav button{border:1px solid var(--bd);background:var(--bg);border-radius:4px;padding:3px 12px;cursor:pointer;font-size:11px}
.guide-tip .nav button:hover{border-color:var(--pri);color:var(--pri)}
.guide-tip .nav .stepno{font-size:10px;color:var(--tx3)}

/* ═══ 动效（设计感）：淡化 / 弹出 / 滑入 / 进度 / 页签切换 ═══ */
@keyframes fadein{from{opacity:0}to{opacity:1}}
@keyframes pop{0%{opacity:0;transform:translateY(6px) scale(.96)}100%{opacity:1;transform:none}}
@keyframes slidein{from{opacity:0;transform:translateX(10px)}to{opacity:1;transform:none}}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes bars{from{width:0}}
@keyframes toast{0%{opacity:0;transform:translateY(14px) scale(.96)}100%{opacity:1;transform:none}}
#seg-demo-slot>*,#seg-flow-write>*{animation:rise .18s ease}
.lf,.nd .hd,.dt,.rk{transition:background .12s ease,color .12s ease,transform .12s ease}
.lf:hover{transform:translateX(1px)}
.nc .ncard{animation:toast .2s cubic-bezier(.2,.9,.3,1.2)}
.dlgm.on .dlg{animation:pop .18s cubic-bezier(.2,.9,.3,1.25)}
.svgic{transition:transform .16s ease,color .12s ease}
.rk:hover .rkic{transform:scale(1.14) rotate(-3deg)}
.rk.done .rkic{transform:scale(1.05)}
.rk.done::after{content:"";position:absolute;inset:0;border-radius:6px;box-shadow:0 0 0 1px var(--ok) inset;pointer-events:none}
.rk{position:relative}
.rkic{display:inline-flex;width:26px;height:26px;align-items:center;justify-content:center;transition:transform .18s ease}
.rkbar{height:4px;border-radius:3px;background:var(--bg3);overflow:hidden;margin-top:6px}
.rkbar i{display:block;height:100%;background:var(--pri);width:0;transition:width .35s ease}
.rk.done .rkbar i{background:var(--ok)}
.tbar .tm{font-variant-numeric:tabular-nums;padding:0 6px;border-radius:999px;background:var(--bg3)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* WindowedStackPanel */
.wsp{height:280px;overflow:auto;border:1px solid var(--bd);border-radius:6px;background:var(--bg)}
.wsp .blk{padding:8px 12px;border-bottom:1px solid var(--bd2);font-size:11px;color:var(--tx2);display:flex;justify-content:space-between}

/* ColumnDisplay 拖拽 */
.cde .it{display:flex;align-items:center;gap:8px;padding:6px 10px;border:1px solid var(--bd);border-radius:5px;
  margin-bottom:5px;background:var(--bg);cursor:grab;font-size:12px}
.cde .it.over{border-color:var(--pri)}

/* Dock 工作区模拟（Dock 演示页内） */
.dockws{display:flex;height:calc(100vh - 420px);min-height:340px;border:1px solid var(--bd);border-radius:8px;overflow:hidden;background:var(--workbg)}
.dockws .tool{width:210px;border-right:1px solid var(--bd);background:var(--bg);display:flex;flex-direction:column}
.dockws.hideT .tool{display:none}
.dockws .tool .th{display:flex;align-items:center;justify-content:space-between;padding:5px 10px;background:var(--bg2);
  font-size:11px;font-weight:600;color:var(--tx2);border-bottom:1px solid var(--bd)}
.dockws .tool .tc{padding:10px;overflow:auto;font-size:11px;color:var(--tx2);line-height:1.9}
.dockws .main{flex:1;display:flex;flex-direction:column;min-width:0}
.dockws .dtabs{display:flex;align-items:flex-end;background:var(--bg2);padding:5px 8px 0;gap:4px;border-bottom:1px solid var(--bd)}
.dockws .dtabs .t{padding:5px 15px;background:var(--bg3);border:1px solid var(--bd2);border-bottom:none;
  border-radius:6px 6px 0 0;font-size:11px;cursor:pointer;color:var(--tx2)}
.dockws .dtabs .t.on{background:var(--bg);color:var(--pri);font-weight:600}
.dockws .dbody{flex:1;overflow:auto;padding:16px 20px;background:var(--bg)}
.dockws .dtool{display:flex;gap:6px;padding:5px 8px;background:var(--bg2);border-bottom:1px solid var(--bd)}
.dockws .dtool button{border:1px solid var(--bd);background:var(--bg);border-radius:4px;padding:2px 10px;
  cursor:pointer;font-size:10px;color:var(--tx2)}
.dockws .dtool button:hover{border-color:var(--pri);color:var(--pri)}
.dockws .dtool button.on{border-color:var(--pri);color:var(--pri);background:var(--pri-lt)}

/* ═══ 场景页：工作流轨道 + 子标签 ═══ */
.flow{position:relative;display:flex;align-items:center;gap:0;flex-wrap:wrap;margin-bottom:14px;
  padding:10px 12px;border:1px solid var(--bd);border-radius:10px;
  background:linear-gradient(180deg,var(--bg2),var(--bg))}
.flow::after{content:"";position:absolute;left:18px;right:18px;top:50%;height:2px;border-radius:2px;
  background:linear-gradient(90deg,var(--bd2),var(--bd),var(--bd2));z-index:0}
.flow .st{position:relative;z-index:1;display:flex;align-items:center;gap:7px;margin-right:14px;
  padding:4px 12px 4px 5px;border-radius:999px;border:1px solid var(--bd);background:var(--bg);
  font-size:11.5px;color:var(--tx2);cursor:pointer;transition:all .16s ease}
.flow .st:hover{border-color:var(--pri);color:var(--pri);transform:translateY(-1px)}
.flow .st .n{width:16px;height:16px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  background:var(--bg3);color:var(--tx3);font-size:10px;font-weight:700;flex:none}
.flow .st .si{display:none}
.flow .st.cur{border-color:var(--pri);background:var(--pri-lt);color:var(--pri);font-weight:700;
  box-shadow:0 0 0 3px var(--pri-lt)}
.flow .st.cur .n{background:var(--pri);color:var(--on-primary)}
.flow .st.done{border-color:var(--ok);color:var(--ok)}
.flow .st.done .n{background:var(--ok);color:var(--on-primary)}
.flow .st.cur .si,.flow .st.done .si{display:inline-flex}
.subtabs{display:flex;gap:2px;border-bottom:1px solid var(--bd);margin-bottom:12px;flex-wrap:wrap}
.subtabs button{border:none;background:transparent;padding:6px 12px;cursor:pointer;font-size:12px;color:var(--tx2);
  border-bottom:2px solid transparent;margin-bottom:-1px}
.subtabs button:hover{color:var(--pri)}
.subtabs button.on{color:var(--pri);font-weight:600;border-bottom-color:var(--pri)}
.filelist{border:1px solid var(--bd);border-radius:6px;overflow:hidden}
.filelist .fl{display:flex;align-items:center;gap:8px;padding:6px 10px;font-size:12px;cursor:pointer;border-bottom:1px solid var(--bd2)}
.filelist .fl:last-child{border-bottom:none}
.filelist .fl:hover{background:var(--hov)}
.filelist .fl.on{background:var(--sel);color:var(--pri)}
.filelist .fl .sz{margin-left:auto;color:var(--tx3);font-size:10.5px}
.barwrap{height:8px;border:1px solid var(--bd);border-radius:5px;background:var(--bg3);overflow:hidden}
.barwrap i{display:block;height:100%;width:0;background:var(--pri);transition:width .2s}

/* ═══ 空态 / 骨架屏 / 忙碌 / 错误卡片 / 通知中心 ═══ */
.empty{padding:26px 16px;text-align:center;color:var(--tx3)}
.empty .ei{font-size:26px;line-height:1.2;opacity:.75}
.empty .et{margin:8px 0 2px;font-size:12.5px;color:var(--tx2);font-weight:600}
.empty .ed{font-size:11px;line-height:1.7;margin-bottom:12px}
.skel{padding:10px 4px}
.skel i{display:block;height:10px;border-radius:5px;margin-bottom:9px;
  background:linear-gradient(90deg,var(--bg3) 25%,var(--hov) 37%,var(--bg3) 63%);background-size:400% 100%;
  animation:sh 1.3s ease infinite}
.skel i:nth-child(1){width:62%}.skel i:nth-child(2){width:92%}.skel i:nth-child(3){width:78%}
.skel i:nth-child(4){width:86%}.skel i:nth-child(5){width:54%}.skel i:nth-child(6){width:70%}
@keyframes sh{0%{background-position:100% 50%}100%{background-position:0 50%}}
.busy{padding:20px 14px;text-align:center}
.busy .bt{font-size:12px;color:var(--tx2);margin-bottom:10px}
.errc{border:1px solid var(--err);border-left-width:3px;border-radius:8px;padding:12px 14px;background:var(--bg);margin-bottom:12px}
.errc .eh{color:var(--err);font-weight:700;font-size:12.5px;margin-bottom:4px}
.errc .eb{font-size:11.5px;color:var(--tx2);line-height:1.7;margin-bottom:10px}
.nc{position:fixed;right:18px;bottom:44px;z-index:80;display:flex;flex-direction:column;gap:8px;max-width:330px}
.nc .ncard{border:1px solid var(--bd);border-left-width:3px;border-radius:8px;background:var(--bg);
  box-shadow:0 8px 26px rgba(0,0,0,.28);padding:9px 12px;display:flex;gap:8px;align-items:flex-start;
  animation:nin .16s ease}
.nc .ncard.s{border-left-color:var(--ok)}
.nc .ncard.w{border-left-color:var(--warn)}
.nc .ncard.e{border-left-color:var(--err)}
.nc .ncard .nt{font-weight:700;font-size:12px;margin-bottom:2px}
.nc .ncard .nb{font-size:11px;color:var(--tx2);line-height:1.6}
.nc .ncard .nx{margin-left:auto;border:none;background:transparent;cursor:pointer;color:var(--tx3);font-size:12px}
.nc .ncard .nx:hover{color:var(--err)}
@keyframes nin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ═══ 命令面板 Ctrl+K ═══ */
.cpm{position:fixed;inset:0;z-index:95;display:none;justify-content:center;align-items:flex-start;
  background:rgba(0,0,0,.45);padding-top:9vh}
.cpm.on{display:flex}
.cpm .box{width:min(620px,92vw);background:var(--bg);border:1px solid var(--bd);border-radius:var(--r3);
  box-shadow:0 16px 48px rgba(0,0,0,.32);overflow:hidden}
.cpm .box input{width:100%;height:42px;border:none;border-bottom:1px solid var(--bd);background:var(--bg);
  color:var(--tx);font-size:14px;padding:0 14px;outline:none}
.cpm .ls{max-height:52vh;overflow:auto}
.cpm .it{padding:8px 14px;font-size:12.5px;cursor:pointer;display:flex;gap:10px;align-items:center}
.cpm .it .g{margin-left:auto;font-size:10px;color:var(--tx3)}
.cpm .it.on,.cpm .it:hover{background:var(--pri-lt)}
.cpm .it .k{margin-left:auto;font-size:10.5px;color:var(--tx3);border:1px solid var(--bd);border-radius:3px;padding:0 5px}
.cpm .ft{padding:6px 14px;border-top:1px solid var(--bd);font-size:10.5px;color:var(--tx3);display:flex;gap:12px}

/* ═══ 二次确认对话框 ═══ */
.dlgm{position:fixed;inset:0;z-index:96;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.45)}
.dlgm.on{display:flex}
.dlg{width:min(400px,92vw);background:var(--bg);border:1px solid var(--bd);border-radius:var(--r3);
  box-shadow:0 16px 48px rgba(0,0,0,.32);padding:18px 20px}
.dlg .dt2{font-weight:700;font-size:14px;margin-bottom:6px}
.dlg .dd{font-size:12px;color:var(--tx2);line-height:1.7;margin-bottom:16px}
.dlg .db{display:flex;justify-content:flex-end;gap:8px}

/* 任务栏 26px */
.tbar{height:28px;flex:none;display:flex;align-items:center;gap:9px;padding:0 12px;background:var(--bg2);
  border-top:1px solid var(--bd);font-size:11px;color:var(--tx2);overflow:hidden}
.tbar .badge{display:inline-flex;align-items:center;gap:5px;padding:1px 9px;border-radius:4px;font-size:10px;color:var(--on-primary);background:var(--pri)}
.tbar .badge::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--on-primary)}
.tbar .sp{flex:1}
.tbar .latest{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:34%}
.tbar .sep{color:var(--bd)}
.tbar .tm{font-variant-numeric:tabular-nums;padding:0 7px;border-radius:999px;background:var(--bg3);color:var(--tx3)}
.tbar button{border:none;background:transparent;cursor:pointer;color:var(--tx2);font-size:11px;padding:2px 4px;border-radius:3px;transition:background .12s,color .12s}
.tbar button:hover{color:var(--pri);background:var(--hov)}
.tbar button:focus-visible{outline:2px solid var(--pri);outline-offset:1px}

/* 引导调试条（默认隐藏，预留排障用） */
#DBG{position:fixed;top:0;left:0;z-index:999;background:#000;color:#0f0;font:11px monospace;
  padding:2px 6px;max-width:100%;white-space:pre-wrap;display:none}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms !important;animation-iteration-count:1 !important;transition-duration:.001ms !important}
}

<style>
/* Shared visual language for the two CodeWF capability studios. */
/* 颜色令牌（含 :root[data-theme=light|dark] 回退与 8 套配色，--bg/--bg2/--tx/--pri/--brand/--glow/--secondary 等）
 * 全部由 assets/palette-tokens.css 提供（generate-palette-tokens.cjs 生成，禁止手写）；本文件只留非配色静态量。 */
:root {
  --fs-body:14px; --fs-h1:22px; --fs-dsc:13px; --fs-tag:11px; --fs-code:12.5px;
  color-scheme:light;
}
body {
  /* §15 强调色唯一律：桌面底衬只留极低浓度主色晕染（≤10%），不做大面积主色块。 */
  padding:18px; background:radial-gradient(ellipse at 10% 0%,color-mix(in srgb,var(--brand) 9%,transparent),transparent 55%),radial-gradient(ellipse at 95% 95%,color-mix(in srgb,var(--secondary) 5%,transparent),transparent 55%),#080810;
  font-family:"Segoe UI Variable","Segoe UI","Microsoft YaHei",sans-serif;
}
.win { width:min(1680px,100%); min-height:0; border-radius:var(--r3,14px); border-color:color-mix(in srgb,var(--glow) 10%,var(--bd)); grid-template-columns:minmax(0,1fr); grid-template-rows:52px 42px auto 1fr 30px; box-shadow:var(--e3,0 24px 70px rgba(0,0,0,.42)),0 2px 10px rgba(0,0,0,.28); }
.win > * { min-width:0; }
.cap { height:52px; padding-left:17px; gap:11px; background:var(--bg); border-color:var(--bd2); }
.cap .logo { width:28px; height:28px; border-radius:8px; box-shadow:none; }
.cap .lg { color:var(--tx); text-shadow:none; font-size:14px; letter-spacing:.2px; }
.cap .vbadge { color:var(--tx3); background:var(--bg3); border:1px solid var(--bd2); font:10px Consolas,monospace; padding:4px 8px; }
.cap select { height:29px; font-size:11px; padding:0 7px; border-radius:6px; }
.cap .wb { height:50px; width:34px; }
.cap .notification-entry { position:relative; width:30px; height:30px; overflow:visible; }
.cap :is(#darkBtn,#langBtn,.notification-entry) svg { width:16px; height:16px; }
.notification-count { position:absolute; right:-4px; top:-3px; min-width:16px; height:16px; padding:0 3px; box-sizing:border-box; border-radius:8px; display:flex; align-items:center; justify-content:center; font:10px "Segoe UI",sans-serif; color:var(--card-error); background:var(--card-error-bg); }
.notification-count[hidden] { display:none; }

/* ═══ 外观菜单（与 Vex 原型同构）：明暗模式三选 + 界面配色网格（8 圆点色卡） ═══ */
.appearance-menu { position:relative; }
.appearance-menu summary { list-style:none; display:flex; align-items:center; gap:6px; height:50px; padding:0 10px; cursor:pointer; color:var(--tx2); font-size:11px; }
.appearance-menu summary::-webkit-details-marker { display:none; }
.appearance-menu summary:hover { background:var(--hov); color:var(--tx); }
.appearance-choices { position:absolute; right:0; top:52px; z-index:150; width:min(458px,calc(100vw - 60px)); padding:14px 16px 16px; background:var(--bg2); border:1px solid var(--bd); border-radius:var(--r2,10px); box-shadow:0 16px 44px rgba(0,0,0,.32); overflow:visible; } /* 自适应内容，禁水平/竖直滚动条；宽度保证 16px 圆点阵与"推荐"角标留 ~12px 间距 */
.appearance-choices .studio-modes { display:block; border:0; background:transparent; margin:0 0 14px; padding:0; min-width:0; }
.appearance-choices legend, .appearance-choices > strong { display:block; font-size:12px; font-weight:600; color:var(--tx); }
.appearance-choices legend { margin-bottom:10px; padding:0; }
.theme-mode-options { display:flex; flex-wrap:wrap; gap:6px; }
.theme-mode-options label { display:flex; align-items:center; gap:5px; min-height:30px; padding:3px 8px; border-radius:5px; font-size:12px; color:var(--tx2); cursor:pointer; white-space:nowrap; }
.theme-mode-options label:hover { background:var(--hov); color:var(--tx); }
.theme-mode-options label:has(input:checked) { color:var(--pri); background:var(--pri-lt); }
.theme-mode-options input { accent-color:var(--pri); width:14px; height:14px; margin:0; cursor:pointer; }
.studio-palettes { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:8px; margin-top:9px; }
.studio-palettes button { position:relative; display:flex; flex-direction:column; align-items:stretch; justify-content:flex-start; gap:7px; padding:8px; border:1px solid var(--bd); border-radius:6px; background:var(--bg); color:var(--tx); font-size:11px; text-align:left; cursor:pointer; }
.studio-palettes button:hover { background:var(--hov); border-color:var(--pri); }
.studio-palettes button[aria-pressed="true"] { border-color:var(--pri); box-shadow:0 0 0 1px var(--pri); }

function dlog(msg, lv) {
 var b = $("logP"); if (!b) return;

 b.appendChild(e); b.scrollTop = b.scrollHeight;

 var st = $("stLogLv"); if (st) st.textContent = LOG_LEVEL;
}

function setStatus(msg) {

}

    REG('segmented',{zh:apiMeta(entries.segmented),props:[],
      xaml:'<Border Classes="segmented-track">\n  <codewf:SegmentedPanel Spacing="2" FillItems="False" CornerRadius="999">\n    <Button Content="Demo" codewf:SegmentedPanel.IsActive="True" />\n    <Button Content="XAML" />\n    <Button Content="C#" />\n  </codewf:SegmentedPanel>\n</Border>',
      cs:'SegmentedPanel.SetIsActive(demoButton, true);\npanel.Spacing = 2;\npanel.FillItems = false;\npanel.CornerRadius = new CornerRadius(999);',
      render:function(el){

          ['Demo','Xaml','CSharp'].map(function(key,index){ return '<button type="button" aria-selected="'+(index===0)+'">'+esc(seg[key])+'</button>'; }).join('')+'</div></div>';
        var track=el.querySelector('.catalog-seg-track'),thumb=el.querySelector('.catalog-seg-thumb');
        var buttons=Array.prototype.slice.call(track.querySelectorAll('button'));
        function place(){
          var active=buttons.filter(function(button){ return button.getAttribute('aria-selected')==='true'; })[0];
          if(!active||!active.offsetWidth){ thumb.style.opacity='0'; return; }

        // 属性区改的是轨道排布（间距、等宽、圆角），改完段宽就变了：由它回调重量，指示块才不会盖错段。

  Object.keys(entries).forEach(function(id) { if (!PROTO[id] || entries[id].page.indexOf("HelperDemoPage") === 0) REG(id,generic(entries[id])); });
  REG('about',{zh:apiMeta(entries.about),props:[],render:function(el){

    el.querySelectorAll('[data-open="flow-write"]').forEach(function(button){button.onclick=function(){openDoc('md-viewer');};});

  renderDoc=function(id){

    $('dBody').dataset.page=id;
    $('dBody').innerHTML=head+'<div id="seg-'+id+'"></div>'+(id==='welcome'?'':'<div class="catalog-source" hidden><div class="smt"><button data-source="xaml">XAML</button><button data-source="cs">C#</button></div><pre></pre></div>');
    renderInto(id,$('seg-'+id));
    if(pg.after)guard(function(){pg.after();},'after:'+id);
    var source=$('dBody').querySelector('.catalog-source');

      if (!hasSource) source.remove();
      else {
      function showCode(language){source.querySelector('pre').textContent=pg[language]||entry.code||entry.api;}
      source.querySelector('[data-source="xaml"]').hidden = !pg.xaml;
      source.querySelector('[data-source="cs"]').hidden = !(pg.cs || entry.code);
      showCode(pg.cs || entry.code ? 'cs' : 'xaml');
      $('catalog-source-toggle').onclick=function(){source.hidden=!source.hidden;};
      source.querySelectorAll('button').forEach(function(button){button.onclick=function(){showCode(button.dataset.source);};});
      }
    }
    renderPGrid(id);
    if($('stWhere'))$('stWhere').textContent=docCrumb(id);
    if(!matchMedia('(prefers-reduced-motion: reduce)').matches)$('seg-'+id).animate([{opacity:.4,transform:'translateY(5px)'},{opacity:1,transform:'none'}],{duration:220,easing:'ease-out'});
  };
  PROTO.welcome.zh.t=pt('welcome');
  var widths = {}, workspace = document.querySelector('.document-workspace');
  var splitter = document.querySelector('.document-splitter');
  function resizeProperties(width) {
    var frame = document.querySelector('.p-doc') || workspace;
    var bounded = Math.max(180, Math.min(width, frame.clientWidth - 165));
    widths[ACTIVE_DOC] = bounded;
    document.body.style.setProperty('--document-properties-width', bounded + 'px');
    splitter.setAttribute('aria-valuenow', String(Math.round(bounded)));
  }
  splitter.onpointerdown = function(event) {
    var origin = event.clientX, initial = document.querySelector('.p-props').getBoundingClientRect().width;
    splitter.setPointerCapture(event.pointerId);
    splitter.onpointermove = function(move) { resizeProperties(initial + origin - move.clientX); };
    splitter.onpointerup = splitter.onpointercancel = function() { splitter.onpointermove = null; };
  };
  splitter.onkeydown = function(event) {
    if(event.key !== 'ArrowLeft' && event.key !== 'ArrowRight') return;
    event.preventDefault();
    resizeProperties(document.querySelector('.p-props').getBoundingClientRect().width + (event.key === 'ArrowLeft' ? 16 : -16));
  };
  var renderWithProperties = renderDoc;
  renderDoc = function(id) {
    document.body.style.setProperty('--document-properties-width', (widths[id] || 260) + 'px');
    return renderWithProperties(id);
  };
  curTab='home';
  // 浏览器中模拟桌面窗体按钮，不影响浏览器自身窗口。
  var frame=document.querySelector('.win');
  function windowLabels(){
    var labels=LANG==='en-US'?{minimize:'Minimize',maximize:'Maximize / restore',close:'Close'}:{minimize:'最小化',maximize:'最大化 / 还原',close:'关闭'};
    document.querySelectorAll('[data-window-action]').forEach(function(button){button.title=labels[button.dataset.windowAction];button.setAttribute('aria-label',button.title);});
  }
  function windowAction(action){
    if(action==='maximize'){document.body.classList.toggle('prototype-maximized');return;}
    frame.style.display='none';

    restore.onclick=function(){frame.style.display='';restore.remove();};
    document.body.appendChild(restore);restore.focus();
  }
  document.querySelectorAll('[data-window-action]').forEach(function(button){button.onclick=function(){windowAction(button.dataset.windowAction);};});
  document.querySelector('.cap').ondblclick=function(event){if(!event.target.closest('button,select'))windowAction('maximize');};
  var localizeWindow=setLang;
  setLang=function(language){localizeWindow(language);windowLabels();};
  windowLabels();
  renderRTabs();renderTree();renderDocTabs();

<script>
/* Focused examples of the public controls; labels are shared with the native demo. */
"use strict";
(function () {
  function text(key) { return window.CodeWFCatalogText[LANG][key] || key; }
  function register(id, options) {
    var entry = window.CodeWFDemoCatalog.flatMap(function(g){return g.items;}).find(function(e){return e.prototypeId===id;});
    options.zh = {t:entry.titleZh,d:entry.package,f:[]};
    options.en = {t:entry.titleEn,d:entry.package,f:[]};
    options.props = options.props || [];
    REG(id, options);
  }
  ['if','switch'].forEach(function(id){
    PROTO[id].xaml = window.CodeWFCatalogDescriptions[LANG][id === 'if' ? 'If' : 'Switch'].Xaml;
  });
  function samples() { return window.CodeWFMarkdownSamples[LANG]; }
  function applyTypography(id) {
    var page = document.querySelector('#seg-'+id+' .catalog-markdown-basic');
    if(!page)return;
    var props=PROTO[id].props, theme=props.find(function(p){return p.id==='typography-theme';}), size=props.find(function(p){return p.id==='typography-size';});
    var tokens=window.CodeWFMarkdownTypography;
    var metrics=Object.assign({},tokens.Common,tokens[theme.value],size.value==='Small'?tokens.CompactTypographyResources:{});
    page.style.fontSize=metrics.CodeWFMarkdownParagraphFontSize+'px';
    page.style.lineHeight=metrics.CodeWFMarkdownParagraphLineHeight+'px';
    page.style.gap=metrics.CodeWFMarkdownBlockSpacing+'px';
    page.querySelectorAll('h1,h2,h3,h4,h5,h6').forEach(function(heading){heading.style.fontSize=metrics['CodeWFMarkdownHeading'+heading.tagName.slice(1)+'FontSize']+'px';});
    page.querySelectorAll('pre').forEach(function(code){code.style.fontSize=metrics.CodeWFMarkdownCodeBlockFontSize+'px';code.style.lineHeight=metrics.CodeWFMarkdownCodeBlockLineHeight+'px';});
  }
  function typographyProperties(id, themes) {
    return [
      {id:'typography-theme',get label(){return samples().themeLabel;},type:'combo',options:themes,value:'Basic',apply:function(){applyTypography(id);}},
      {id:'typography-size',get label(){return samples().sizeLabel;},type:'combo',options:['Normal','Small'],value:'Normal',apply:function(){applyTypography(id);}}
    ];
  }
  // Browser rendering covers the elements in the shared examples; the native page runs Markdig.
  function renderSample(source) {
    var lines = source.replace(/\r\n/g, '\n').split('\n'), output = [], fence = false, code = [], list = false, table = false;
    function inline(value) { return esc(value).replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>').replace(/\*([^*]+)\*/g, '<em>$1</em>').replace(/\[([^\]]+)\]\((https?:\/\/[^)]+)\)/g, '<a href="$2">$1</a>'); }
    lines.forEach(function(line, index) {
      if (line.startsWith('```')) { if (fence) { output.push('<pre>'+esc(code.join('\n'))+'</pre>'); code=[]; } fence=!fence; return; }
      if (fence) { code.push(line); return; }
      if (!line.startsWith('- ') && list) { output.push('</ul>'); list=false; }
      if (!line.startsWith('|') && table) { output.push('</tbody></table>'); table=false; }
      var heading = line.match(/^(#{1,6}) (.+)/);
      if (heading) { var level=heading[1].length; output.push('<h'+level+'>'+inline(heading[2])+'</h'+level+'>'); }
      else if (line.startsWith('- ')) {
        if (!list) { output.push('<ul>'); list=true; }
        var task=line.match(/^- \[([ xX])\] (.*)/);
        output.push('<li'+(task?' class="markdown-task"':'')+'>'+(task?'<label><input type="checkbox" data-task-line="'+index+'" '+(task[1].trim()?'checked':'')+'> '+inline(task[2])+'</label>':inline(line.slice(2)))+'</li>');
      } else if (line.startsWith('> ')) output.push('<blockquote>'+inline(line.slice(2))+'</blockquote>');
      else if (line.startsWith('|') && !line.includes('---')) {
        var header=!table;
        if(header){output.push('<table><thead>');table=true;}
        output.push('<tr>'+line.split('|').slice(1,-1).map(function(cell){var tag=header?'th':'td';return '<'+tag+'>'+inline(cell.trim())+'</'+tag+'>';}).join('')+'</tr>');
        if(header)output.push('</thead><tbody>');
      }
      else if (line.trim() && !line.startsWith('|')) output.push('<p>'+inline(line)+'</p>');
    });
    if(list)output.push('</ul>');
    if(table)output.push('</tbody></table>');
    return output.join('');
  }
  window.CodeWFRenderMarkdownSample = renderSample;
  register('md-viewer', {props:typographyProperties('md-viewer',MD_THEMES),xaml:'<codewf:MarkdownViewer Markdown="{Binding AppliedMarkdown}"\n  TypographyTheme="{Binding Theme}" TypographySize="{Binding Size}" />', render:function(el) {
    var source=samples().viewer;
    el.classList.add('catalog-markdown-page');
    el.innerHTML='<details class="catalog-markdown-input"><summary>'+esc(text('Input'))+'</summary><textarea class="catalog-input"></textarea><div class="row">'+['apply','append','reset'].map(function(action){return '<button class="btn" data-markdown-action="'+action+'">'+esc(samples()[action])+'</button>';}).join('')+'</div></details><div class="catalog-markdown-basic"></div>';
    var input=el.querySelector('textarea'), viewer=el.querySelector('.catalog-markdown-basic'); input.value=source;
    function paint(){
      viewer.innerHTML=renderSample(source);
      applyTypography('md-viewer');
      viewer.querySelectorAll('[data-task-line]').forEach(function(task){task.onchange=function(){var lines=source.replace(/\r\n/g,'\n').split('\n');lines[task.dataset.taskLine]=lines[task.dataset.taskLine].replace(/\[[ xX]\]/,task.checked?'[x]':'[ ]');source=lines.join('\n');input.value=source;markDirty('md-viewer');};});
    }
    el.querySelectorAll('[data-markdown-action]').forEach(function(button){button.onclick=function(){var action=button.dataset.markdownAction;source=action==='reset'?samples().viewer:action==='append'?source+'\n\n'+text('LiveParagraph'):input.value;input.value=source;paint();};});
    paint();
  }});
  register('md-lite', {props:typographyProperties('md-lite',['Basic','Simple','GeekBlack','WeChatFormat']),xaml:'<codewf:MarkdownViewer Markdown="{Binding SampleMarkdown}" />', render:function(el) {el.innerHTML='<div class="catalog-markdown-basic">'+renderSample(samples().lite)+'</div>';applyTypography('md-lite');}});
  var originalEditorRender = PROTO['md-editor'].render;
  PROTO['md-editor'].render = function(el) {
    el.innerHTML = originalEditorRender(el);
    var input = el.querySelector('#edTa');
    if (input) { input.value = samples().editor; input.style.fontSize = '15px'; input.style.height = '300px'; }
  };
  register('status-card',{xaml:'<codewf:StatusCard Width="180" Height="80" Kind="Info" TopText="INFO"\n  BottomText="{codewf:I18n Demo.Catalog.StatusSampleInfo}" />',render:function(el){
    var levels=['Debug','Info','Warn','Error','Fatal'];
    el.innerHTML='<div class="demo"><h4>StatusCard</h4><div class="row catalog-status-row">'+levels.map(function(level){return '<div class="catalog-status card" data-level="'+level+'"><strong>'+level.toUpperCase()+'</strong><span>'+esc(text('StatusSample'+level))+'</span></div>';}).join('')+'</div></div><div class="demo"><h4>Kind / IconWidth</h4><select>'+levels.map(function(l){return '<option'+(l==='Info'?' selected':'')+'>'+l+'</option>';}).join('')+'</select><div class="catalog-status card catalog-driven" data-level="Info"><strong>DRIVEN</strong><span>'+esc(text('StatusDriven'))+'</span></div></div>';
    el.querySelector('select').onchange=function(e){el.querySelector('.catalog-driven').dataset.level=e.target.value;};
  }});
  register('treegrid', {cs:'var source = new FlatTreeDataGridSource<Row>(rows);\ntreeDataGrid.EnableDefaults(source);',render:function(el){
    var rows=[10,2,1,20,3,11], direction=0, selected=new Set();
    el.innerHTML='<div class="demo"><p>'+esc(text('TreeHints'))+'</p><table class="catalog-grid" tabindex="0"><thead><tr><th>Name ↕</th><th>Value</th><th>Description</th></tr></thead><tbody></tbody></table><p class="catalog-selection"></p></div>';
    function paint(){
      el.querySelector('tbody').innerHTML=rows.map(function(n){return '<tr data-row="'+n+'" class="'+(selected.has(n)?'selected':'')+'"><td>item'+n+'</td><td>'+n+'</td><td><span title="'+esc(text('TreeLongText'))+'">'+esc(text('TreeLongText'))+'</span></td></tr>';}).join('');
      el.querySelectorAll('[data-row]').forEach(function(row){row.onclick=function(e){var n=Number(row.dataset.row);if(!e.ctrlKey)selected.clear();if(selected.has(n))selected.delete(n);else selected.add(n);paint();};});
      el.querySelector('.catalog-selection').textContent=text('TreeSelection').replace('{0}',selected.size).replace('{1}',rows.length);
    }
    el.querySelector('th').onclick=function(){direction=(direction+1)%3;rows=direction?[10,2,1,20,3,11].sort(function(a,b){return direction===1?a-b:b-a;}):[10,2,1,20,3,11];paint();};
    el.querySelector('table').onkeydown=function(e){if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='a'){e.preventDefault();rows.forEach(function(n){selected.add(n);});paint();}};
    paint();
  }});
  register('expansion',{xaml:'<codewf:ContentExpansionAnimator IsExpanded="{Binding IsExpanded}"\n  Orientation="Horizontal" Duration="{Binding Duration}" Animate="{Binding Animate}"\n  ExpandedSize="{Binding ExpandedSize}" />',render:function(el){
    el.innerHTML='<div class="demo"><p>'+esc(text('ExpansionHint'))+'</p><div class="row"><button class="btn pri" data-toggle>'+esc(text('ExpansionToggle'))+'</button><label><input type="checkbox" checked data-animate> '+esc(text('ExpansionAnimate'))+'</label></div><p>Duration (ms) <input type="range" min="0" max="1000" value="300" data-duration></p><p>ExpandedSize <input type="range" min="100" max="300" value="200" data-size></p></div><div class="demo"><h4>'+esc(text('ExpansionHorizontal'))+'</h4><div class="catalog-expand horizontal"><div>'+esc(text('ExpansionContent'))+'</div></div></div><div class="demo"><h4>'+esc(text('ExpansionVertical'))+'</h4><div class="catalog-expand vertical"><div>'+esc(text('ExpansionContent'))+'</div></div></div>';
    var expanded=true;
