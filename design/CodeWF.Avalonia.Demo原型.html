<!DOCTYPE html>
<html lang="zh-CN" data-theme="light" data-palette="default">
<head>
<meta charset="utf-8">
<title>CodeWF.Avalonia.Demo — 原型</title>
<style>
/* ═══════════ 色板（6 色板 × 浅深，对应 ACSemiTheme ThemeDictionaries） ═══════════ */
:root{
  --pri:#0064fa;--pri-h:#0057d4;--pri-lt:rgba(0,100,250,.09);
  --bg:#fff;--bg2:#f5f6f8;--bg3:#eef0f3;--tx:#1c1f23;--tx2:#646a73;--tx3:#8f959e;
  --bd:#d9dce1;--bd2:#e6e8ec;--hov:#eef0f3;--sel:#e3edff;--workbg:#eceef1;
  --ok:#26a346;--warn:#e8a103;--err:#e34d4d;
}
[data-palette=aqua]{--pri:#0091a8;--pri-h:#007a8e;--pri-lt:rgba(0,145,168,.10);--sel:#dff5f8}
[data-palette=desert]{--pri:#c26a1d;--pri-h:#a85a15;--pri-lt:rgba(194,106,29,.10);--sel:#faf0e2}
[data-palette=dusk]{--pri:#7a5cc4;--pri-h:#654aa8;--pri-lt:rgba(122,92,196,.10);--sel:#efe9fb}
[data-palette=night]{--pri:#2b6cb0;--pri-h:#245a96;--pri-lt:rgba(43,108,176,.10);--sel:#e2edf9}
[data-palette=contrast]{--pri:#000;--pri-h:#000;--pri-lt:rgba(0,0,0,.08);--sel:#eee}
[data-theme=dark]{
  --bg:#1b1b1f;--bg2:#232327;--bg3:#2a2a30;--tx:#e6e6e8;--tx2:#9ea3ab;--tx3:#6b7078;
  --bd:#3a3a40;--bd2:#2b2b30;--hov:#2a2a30;--sel:#1d2c44;--workbg:#131316;
}
[data-theme=dark][data-palette=default]{--pri:#4d9aff;--pri-h:#6cadff;--pri-lt:rgba(77,154,255,.14);--sel:#1d2c44}
[data-theme=dark][data-palette=aqua]{--pri:#2ec3dd;--pri-h:#4fd0e8;--sel:#123c44}
[data-theme=dark][data-palette=desert]{--pri:#e8a355;--pri-h:#efb56f;--sel:#443318}
[data-theme=dark][data-palette=dusk]{--pri:#a98ae0;--pri-h:#bca0e8;--sel:#322a4a}
[data-theme=dark][data-palette=night]{--pri:#5b93cf;--pri-h:#74a8db;--sel:#1a2a3e}
[data-theme=dark][data-palette=contrast]{--pri:#fff;--pri-h:#fff;--pri-lt:rgba(255,255,255,.12);--sel:#333}

/* ═══════════ 桌面背景 + 窗口卡片（不铺满，看得出是桌面软件） ═══════════ */
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:
    radial-gradient(1200px 600px at 20% 0%,#1d2b53 0%,transparent 60%),
    radial-gradient(1000px 700px at 85% 100%,#0f3460 0%,transparent 55%),
    linear-gradient(135deg,#0b1322 0%,#101b30 100%);
  display:flex;align-items:center;justify-content:center;
  padding:22px;font:13px/1.6 "Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;color:var(--tx);
  overflow:hidden;user-select:none;
}
.win{
  width:min(1480px,100%);height:100%;min-height:640px;
  background:var(--bg);border-radius:10px;overflow:hidden;
  border:1px solid rgba(255,255,255,.14);
  box-shadow:0 24px 70px rgba(0,0,0,.55),0 4px 14px rgba(0,0,0,.35);
  display:grid;grid-template-rows:36px 30px auto 1fr auto;
}
button,input,select,textarea{font:inherit;color:inherit}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:var(--bd);border-radius:5px;border:2px solid transparent;background-clip:padding-box}

/* ═══ 1. 标题栏（CodeWFWindow） ═══ */
.cap{display:flex;align-items:center;height:36px;padding-left:12px;gap:8px;
  background:linear-gradient(90deg,var(--pri) 0%,var(--pri-h) 30%,rgba(0,0,0,0) 62%),var(--bg2);
  border-bottom:1px solid var(--bd)}
.cap .lg{font-weight:700;color:#fff;letter-spacing:.5px;text-shadow:0 1px 2px rgba(0,0,0,.3)}
.cap .ver{font-size:11px;color:#fff;opacity:.8}
.cap .sp{flex:1}
.cap select{height:23px;font-size:11px;border:1px solid var(--bd);border-radius:4px;background:var(--bg);color:var(--tx)}
.cap .wb{width:44px;height:36px;display:flex;align-items:center;justify-content:center;
  border:none;background:transparent;cursor:pointer;color:var(--tx2);font-size:12px}
.cap .wb:hover{background:var(--hov);color:var(--tx)}
.cap .wb.cls:hover{background:var(--err);color:#fff}

/* ═══ 2. Ribbon 页签行 ═══ */
.rtabs{display:flex;align-items:center;height:30px;padding:0 10px;gap:2px;background:var(--bg);border-bottom:1px solid var(--bd)}
.qk{display:flex;align-items:center;gap:2px;margin-right:10px;padding-right:12px;border-right:1px solid var(--bd2)}
.qk button{width:27px;height:25px;border:none;background:transparent;border-radius:4px;cursor:pointer;color:var(--tx2);font-size:13px}
.qk button:hover{background:var(--hov);color:var(--pri)}
.rt2{display:flex;align-items:center;height:100%;gap:3px}
.rt2 .t2{padding:0 16px;height:100%;line-height:30px;cursor:pointer;color:var(--tx2);font-size:12.5px;
  user-select:none;letter-spacing:1px;position:relative}
.rt2 .t2:hover{color:var(--pri)}
.rt2 .t2.on{color:var(--pri);font-weight:600}
.rt2 .t2.on::after{content:"";position:absolute;left:14px;right:14px;bottom:0;height:2px;background:var(--pri);border-radius:2px 2px 0 0}
.pin{margin-left:auto;width:27px;height:25px;border:none;background:transparent;border-radius:4px;cursor:pointer;
  color:var(--tx2);font-size:13px}
.pin:hover{background:var(--hov);color:var(--pri)}
body.rmn .pin{color:var(--pri);background:var(--pri-lt)}

/* ═══ 3. Ribbon 命令区（可折叠） ═══ */
.rbn{background:var(--bg);border-bottom:1px solid var(--bd);padding:7px 16px 4px;
  display:flex;align-items:stretch;overflow:hidden;
  transition:padding .15s ease,opacity .12s ease}
body.rmn .rbn{padding-top:0;padding-bottom:0;min-height:0;height:0;opacity:0;border-bottom:none}
.grp{display:flex;flex-direction:column;padding:0 14px;border-right:1px solid var(--bd2)}
.grp:last-child{border-right:none}
.grp .cmds{display:flex;gap:3px;flex:1;align-items:flex-start;flex-wrap:wrap;align-content:flex-start}
.grp .gname{text-align:center;font-size:10px;color:var(--tx3);padding-top:4px;letter-spacing:2px}
.cbtn{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:60px;padding:7px 6px 4px;
  border:none;background:transparent;cursor:pointer;border-radius:6px;color:var(--tx)}
.cbtn:hover{background:var(--hov)}
.cbtn:active{background:var(--pri-lt)}
.cbtn .ic{font-size:21px;line-height:1.1}
.cbtn .lb{font-size:11px;text-align:center;white-space:nowrap}

/* ═══ 4. 主内容 = Dock 工作区 ═══ */
.main{flex:1;min-height:0;display:flex;flex-direction:column;gap:8px;padding:8px 10px;background:var(--workbg);overflow:hidden}
.dockrow{flex:1;min-height:0;display:flex;gap:8px}
.panel{background:var(--bg);border:1px solid var(--bd);border-radius:8px;display:flex;flex-direction:column;
  overflow:hidden;min-height:0;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.phd{display:flex;align-items:center;height:30px;flex:none;padding:0 10px;background:var(--bg2);
  border-bottom:1px solid var(--bd);font-size:11px;font-weight:700;color:var(--tx2);gap:6px;letter-spacing:.5px}
.phd .tb{margin-left:auto;display:flex;gap:2px}
.phd .tb button{width:22px;height:20px;border:none;background:transparent;cursor:pointer;border-radius:3px;
  color:var(--tx2);font-size:11px}
.phd .tb button:hover{background:var(--pri-lt);color:var(--pri)}
.pbd{flex:1;min-height:0;overflow:auto}
.p-nav{width:224px;flex:none}
body.hideL .p-nav{display:none}
.p-props{width:262px;flex:none}
body.hideR .p-props{display:none}
.p-log{height:150px;flex:none}
body.hideLog .p-log{display:none}

/* 左：导航树 */
.tree{padding:5px}
.tree .nd{user-select:none}
.tree .nd .hd{display:flex;align-items:center;gap:5px;height:27px;padding:0 6px;border-radius:5px;cursor:pointer;color:var(--tx)}
.tree .nd .hd:hover{background:var(--hov)}
.tree .nd .hd .arw{width:12px;font-size:9px;color:var(--tx3);transition:transform .12s}
.tree .nd.open>.hd .arw{transform:rotate(90deg)}
.tree .nd .hd .gi{font-size:12px}
.tree .nd .kids{display:none;margin-left:15px;border-left:1px solid var(--bd2);padding-left:5px}
.tree .nd.open>.kids{display:block}
.tree .lf{display:flex;align-items:center;gap:6px;height:26px;padding:0 6px 0 10px;border-radius:5px;
  cursor:pointer;color:var(--tx2);font-size:12px}
.tree .lf:hover{background:var(--hov);color:var(--tx)}
.tree .lf.on{background:var(--sel);color:var(--pri);font-weight:600}
.tree .lf .ic{font-size:11px}

/* 中：文档面板 */
.dts{display:flex;align-items:flex-end;height:32px;flex:none;padding:5px 8px 0;gap:4px;background:var(--bg2);
  border-bottom:1px solid var(--bd);overflow-x:auto}
.dts .dkb{display:flex;gap:3px;margin-right:8px;align-self:center}
.dts .dkb button{border:1px solid var(--bd);background:var(--bg);border-radius:4px;padding:2px 8px;
  cursor:pointer;font-size:10px;color:var(--tx2)}
.dts .dkb button:hover{border-color:var(--pri);color:var(--pri)}
.dt{display:flex;align-items:center;gap:8px;padding:5px 8px 5px 16px;cursor:pointer;font-size:12px;color:var(--tx2);
  background:var(--bg3);border:1px solid var(--bd2);border-bottom:none;
  clip-path:polygon(10px 0,100% 0,calc(100% - 10px) 100%,0 100%);user-select:none;white-space:nowrap}
.dt.on{background:var(--bg);color:var(--tx);font-weight:600;border-bottom:2px solid var(--pri)}
.dt .x{width:14px;height:14px;display:flex;align-items:center;justify-content:center;border-radius:3px;font-size:10px;color:var(--tx3)}
.dt .x:hover{background:var(--err);color:#fff}
.dbody{flex:1;min-height:0;overflow:auto;padding:14px 18px 26px}
.doc .crumb{font-size:11px;color:var(--tx3);margin-bottom:4px}
.doc h1{font-size:19px;margin-bottom:4px}
.doc .dsc{color:var(--tx2);font-size:12px;margin-bottom:12px;line-height:1.7}
.ftg{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.ftg span{font-size:10px;padding:1px 9px;border-radius:10px;background:var(--pri-lt);color:var(--pri);font-weight:600}
.smt{display:inline-flex;border:1px solid var(--bd);border-radius:6px;overflow:hidden;margin-bottom:14px}
.smt button{border:none;background:var(--bg2);padding:4px 18px;cursor:pointer;font-size:11px;color:var(--tx2)}
.smt button.on{background:var(--pri);color:#fff;font-weight:600}
.smcode{background:var(--bg3);border:1px solid var(--bd2);border-radius:6px;padding:12px 14px;
  font-family:Consolas,monospace;font-size:11.5px;line-height:1.65;white-space:pre;overflow:auto;
  max-height:300px;margin-bottom:14px;color:var(--tx)}
.demo{border:1px solid var(--bd2);border-radius:8px;padding:16px;background:var(--bg);margin-bottom:12px}
.demo h4{font-size:12px;color:var(--tx3);font-weight:600;margin-bottom:10px;letter-spacing:.5px}
.row{display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.hint{font-size:11px;color:var(--tx3);margin-top:8px;line-height:1.6}
.btn{border:1px solid var(--bd);background:var(--bg);border-radius:5px;padding:5px 16px;cursor:pointer;font-size:12px}
.btn:hover{border-color:var(--pri);color:var(--pri)}
.btn.pri{border-color:var(--pri);color:var(--pri);background:var(--pri-lt)}

/* Markdown */
.mdr{max-width:780px;font-size:13px;line-height:1.85}
.mdr h1,.mdr h2,.mdr h3{color:var(--pri);margin:12px 0 8px}
.mdr p{margin:8px 0}
.mdr code{background:var(--bg3);padding:1px 6px;border-radius:3px;font-family:Consolas,monospace;font-size:12px}
.mdr pre{background:var(--bg3);border:1px solid var(--bd2);border-radius:6px;padding:10px 14px;overflow:auto;
  font-family:Consolas,monospace;font-size:12px;margin:10px 0;line-height:1.6}
.mdr blockquote{border-left:3px solid var(--pri);padding:4px 14px;margin:10px 0;background:var(--pri-lt);border-radius:0 4px 4px 0}
.mdr table{border-collapse:collapse;margin:10px 0;font-size:12px}
.mdr th,.mdr td{border:1px solid var(--bd);padding:5px 14px}
.mdr th{background:var(--bg2)}
.mdr ul{padding-left:22px}
.mdr input[type=checkbox]{accent-color:var(--pri)}

/* DataGrid */
.dg{border-collapse:collapse;width:100%;font-size:12px}
.dg th,.dg td{padding:7px 16px;text-align:left}
.dg th{background:var(--bg2);font-weight:600;cursor:pointer;user-select:none;white-space:nowrap}
.dg th:hover{background:var(--hov)}
.dg th .arr{color:var(--pri);margin-left:3px}
.dg tbody tr{border-bottom:1px solid var(--bd2)}
.dg tbody tr:hover{background:var(--hov)}

/* 右：属性面板 */
.pgp{padding:2px 6px 12px}
.pgp .cat{font-size:10px;font-weight:700;color:var(--pri);padding:9px 4px 3px;letter-spacing:1px;
  border-bottom:1px solid var(--bd2);margin-bottom:3px}
.pgp .rw{display:grid;grid-template-columns:100px 1fr;align-items:center;min-height:28px;padding:1px 4px;border-radius:4px;gap:6px}
.pgp .rw:hover{background:var(--hov)}
.pgp label{font-size:11px;color:var(--tx2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pgp .ctl input[type=text],.pgp .ctl select{width:100%;height:24px;font-size:11px;padding:0 6px;
  border:1px solid var(--bd);border-radius:4px;background:var(--bg);color:var(--tx);outline:none}
.pgp .ctl input:focus,.pgp .ctl select:focus{border-color:var(--pri)}
.pgp .ctl input[type=range]{width:100%;accent-color:var(--pri)}
.pgp .switch{width:32px;height:17px;border-radius:9px;background:var(--bd);position:relative;cursor:pointer;transition:background .12s}
.pgp .switch.on{background:var(--pri)}
.pgp .switch::after{content:"";position:absolute;width:13px;height:13px;border-radius:50%;background:#fff;top:2px;left:2px;transition:left .12s}
.pgp .switch.on::after{left:17px}
.pgp-empty{padding:16px 10px;color:var(--tx3);font-size:11px;line-height:1.7}

/* 底部日志面板 */
.p-log .pbd{padding:4px 8px;font-family:Consolas,monospace;font-size:11px;line-height:1.8;background:var(--bg)}
.ll1{color:var(--ok)}.ll2{color:var(--warn)}.ll3{color:var(--err)}
.p-log .ltm{color:var(--tx3);margin-right:10px}

/* 状态组件 */
.sbadge{display:inline-flex;align-items:center;gap:5px;padding:2px 10px;border-radius:4px;font-size:11px;color:#fff;margin-right:8px}
.sbadge::before{content:"";width:6px;height:6px;border-radius:50%;background:#fff}
.scard{width:190px;border:1px solid var(--bd);border-radius:8px;overflow:hidden;margin-right:12px;margin-bottom:10px;display:inline-block;vertical-align:top}
.scard .h{padding:8px 12px;font-size:12px;font-weight:600;color:#fff;display:flex;justify-content:space-between;align-items:center}
.scard .b{padding:10px 12px;font-size:11px;color:var(--tx2);line-height:1.7;min-height:52px}
.k-debug{background:var(--tx3)}.k-info{background:var(--pri)}.k-warn{background:var(--warn)}.k-error{background:var(--err)}.k-fatal{background:#c2185b}
[data-theme=dark] .k-debug{background:#4a4a52}

/* Transfer */
.trf{display:flex;gap:10px;align-items:center}
.trf .col{width:230px;border:1px solid var(--bd);border-radius:6px;overflow:hidden;background:var(--bg)}
.trf .col .hd{padding:5px 10px;background:var(--bg2);font-size:11px;color:var(--tx2);display:flex;justify-content:space-between}
.trf .col .ls{height:190px;overflow:auto}
.trf .it{padding:4px 10px;font-size:12px;cursor:pointer;display:flex;justify-content:space-between}
.trf .it:hover{background:var(--hov)}
.trf .it.on{background:var(--sel);color:var(--pri)}
.trf .mid{display:flex;flex-direction:column;gap:6px}
.trf .mid button{width:30px;height:26px;border:1px solid var(--bd);background:var(--bg);border-radius:4px;cursor:pointer;color:var(--pri)}
.trf .mid button:hover{background:var(--pri-lt)}

/* Guide */
.guide-mask{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:90;display:none}
.guide-mask.on{display:block}
.guide-spot{position:fixed;border:2px solid var(--pri);border-radius:8px;box-shadow:0 0 0 9999px rgba(0,0,0,.55);z-index:91;display:none;pointer-events:none;transition:all .25s ease}
.guide-tip{position:fixed;z-index:92;background:var(--bg);border:1px solid var(--pri);border-radius:8px;
  padding:12px 16px;max-width:300px;display:none;box-shadow:0 8px 30px rgba(0,0,0,.3)}
.guide-tip .t{font-weight:700;color:var(--pri);margin-bottom:4px;font-size:13px}
.guide-tip .d{font-size:11px;color:var(--tx2);line-height:1.6;margin-bottom:8px}
.guide-tip .nav{display:flex;justify-content:space-between;align-items:center;gap:8px}
.guide-tip .nav button{border:1px solid var(--bd);background:var(--bg);border-radius:4px;padding:3px 12px;cursor:pointer;font-size:11px}
.guide-tip .nav button:hover{border-color:var(--pri);color:var(--pri)}
.guide-tip .nav .stepno{font-size:10px;color:var(--tx3)}

/* WindowedStackPanel */
.wsp{height:280px;overflow:auto;border:1px solid var(--bd);border-radius:6px;background:var(--bg)}
.wsp .blk{padding:8px 12px;border-bottom:1px solid var(--bd2);font-size:11px;color:var(--tx2);display:flex;justify-content:space-between}

/* ColumnDisplay 拖拽 */
.cde .it{display:flex;align-items:center;gap:8px;padding:6px 10px;border:1px solid var(--bd);border-radius:5px;
  margin-bottom:5px;background:var(--bg);cursor:grab;font-size:12px}
.cde .it.over{border-color:var(--pri)}
.cde .it .hnd{color:var(--tx3);cursor:grab;letter-spacing:-1px}
.cde .it input{accent-color:var(--pri)}

/* Dock 工作区模拟（Dock 演示页内） */
.dockws{display:flex;height:calc(100vh - 420px);min-height:340px;border:1px solid var(--bd);border-radius:8px;overflow:hidden;background:var(--workbg)}
.dockws .tool{width:210px;border-right:1px solid var(--bd);background:var(--bg);display:flex;flex-direction:column}
.dockws.hideT .tool{display:none}
.dockws .tool .th{display:flex;align-items:center;justify-content:space-between;padding:5px 10px;background:var(--bg2);
  font-size:11px;font-weight:600;color:var(--tx2);border-bottom:1px solid var(--bd)}
.dockws .tool .tc{padding:10px;overflow:auto;font-size:11px;color:var(--tx2);line-height:1.9}
.dockws .main{flex:1;display:flex;flex-direction:column;min-width:0}
.dockws .dtabs{display:flex;align-items:flex-end;background:var(--bg2);padding:5px 8px 0;gap:4px;border-bottom:1px solid var(--bd)}
.dockws .dtabs .t{padding:5px 15px;background:var(--bg3);border:1px solid var(--bd2);border-bottom:none;
  border-radius:6px 6px 0 0;font-size:11px;cursor:pointer;color:var(--tx2)}
.dockws .dtabs .t.on{background:var(--bg);color:var(--pri);font-weight:600}
.dockws .dbody{flex:1;overflow:auto;padding:16px 20px;background:var(--bg)}
.dockws .dtool{display:flex;gap:6px;padding:5px 8px;background:var(--bg2);border-bottom:1px solid var(--bd)}
.dockws .dtool button{border:1px solid var(--bd);background:var(--bg);border-radius:4px;padding:2px 10px;
  cursor:pointer;font-size:10px;color:var(--tx2)}
.dockws .dtool button:hover{border-color:var(--pri);color:var(--pri)}
.dockws .dtool button.on{border-color:var(--pri);color:var(--pri);background:var(--pri-lt)}

/* 任务栏 */
.tbar{height:30px;flex:none;display:flex;align-items:center;gap:10px;padding:0 12px;background:var(--bg2);
  border-top:1px solid var(--bd);font-size:11px;color:var(--tx2);overflow:hidden}
.tbar .badge{display:inline-flex;align-items:center;gap:5px;padding:1px 9px;border-radius:4px;font-size:10px;color:#fff;background:var(--pri)}
.tbar .badge::before{content:"";width:5px;height:5px;border-radius:50%;background:#fff}
.tbar .sp{flex:1}
.tbar .latest{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:46%}
.tbar button{border:none;background:transparent;cursor:pointer;color:var(--tx2);font-size:11px}
.tbar button:hover{color:var(--pri)}

/* Guide 调试条 */
#DBG{position:fixed;top:0;left:0;z-index:999;background:#000;color:#0f0;font:11px monospace;
  padding:2px 6px;max-width:100%;white-space:pre-wrap}
</style>
</head>
<body>

<div class="win">

  <!-- ═══ 1. 标题栏 ═══ -->
  <div class="cap">

 datagrid:"📊",propgrid:"🧾",codewfwindow:"🪟",searchlist:"🔎",transfer:"🔀",status:"🏷️",guide:"🧭",appguide:"🧭",

 document.querySelectorAll(".rt2 .t2").forEach(function(n){
  n.addEventListener("click",function(){switchTab(n.dataset.t)});
  n.addEventListener("dblclick",function(){toggleRibbon()})});
 renderRBody()}
function switchTab(id){curTab=id;renderRTabs();renderRBody();
 var g=CATALOG.find(function(x){return x.id===id});
 if(g&&g.items.length)openDoc(g.items[0].id)}
function renderRBody(){var g=CATALOG.find(function(x){return x.id===curTab});if(!g){$("rBody").innerHTML="";return}
 $("rBody").innerHTML='<div class="grp"><div class="cmds">'+g.items.map(function(it){
  return '<button class="cbtn" data-p="'+it.id+'"><span class="ic">'+(TAB_ICON[it.id]||"◆")+'</span><span class="lb">'+pt(it.id)+"</span></button>"}).join("")+
  '</div><div class="gname">'+tabName(curTab)+"</div></div>";
 document.querySelectorAll(".rbn .cbtn").forEach(function(b){
  b.addEventListener("click",function(){openDoc(b.dataset.p)})})}

function toggleRibbon(){document.body.classList.toggle("rmn");log2both((document.body.classList.contains("rmn")?"折叠":"展开")+"命令区")}
$("pinBtn").addEventListener("click",toggleRibbon);
$("rTabsBar").addEventListener("dblclick",function(e){if(e.target.classList.contains("t2"))toggleRibbon()});

function renderTree(){$("lTree").innerHTML=CATALOG.map(function(g){
 var open=g.id===curTab;
 return '<div class="nd'+(open?" open":"")+'"><div class="hd" data-g="'+g.id+'"><span class="arw">▶</span><span class="gi">'+g.icon+'</span><span>'+tabName(g.id)+"</span></div>"+
  '<div class="kids">'+g.items.map(function(it){
   return '<div class="lf'+(ACTIVE_DOC===it.id?" on":"")+'" data-p="'+it.id+'"><span class="ic">'+(TAB_ICON[it.id]||"◆")+'</span><span>'+pt(it.id)+"</span></div>"}).join("")+"</div></div>"}).join("");
 document.querySelectorAll(".tree .nd .hd").forEach(function(h){
  h.addEventListener("click",function(){h.parentElement.classList.toggle("open");switchTab(h.getAttribute("data-g"))})});
 document.querySelectorAll(".tree .lf").forEach(function(l){
  l.addEventListener("click",function(){openDoc(l.getAttribute("data-p"))})})}

function openDoc(id){if(!OPEN_DOCS.includes(id))OPEN_DOCS.push(id);
 ACTIVE_DOC=id;renderDocTabs();renderDoc(id);renderTree();log2both("打开文档："+pt(id))}
function closeDoc(id){OPEN_DOCS=OPEN_DOCS.filter(function(x){return x!==id});
 if(ACTIVE_DOC===id)ACTIVE_DOC=OPEN_DOCS[OPEN_DOCS.length-1]||null;
 renderDocTabs();if(ACTIVE_DOC)renderDoc(ACTIVE_DOC);renderTree()}
function renderDocTabs(){$("dT").innerHTML=OPEN_DOCS.map(function(id){
 return '<div class="dt'+(ACTIVE_DOC===id?" on":"")+'" data-p="'+id+'"><span>'+pt(id)+'</span><span class="x" data-x="'+id+'">✕</span></div>'}).join("");
 document.querySelectorAll(".dt").forEach(function(n){
  n.addEventListener("click",function(e){
   if(e.target.classList.contains("x"))closeDoc(n.getAttribute("data-p"));else openDoc(n.getAttribute("data-p"))})})}

var curSeg={};
function renderDoc(id){var pg=PG[id];if(!pg)return;
 var meta=pg.zh;curSeg[id]="demo";
 $("dBody").innerHTML='<div class="bd"><div class="crumb">'+docCrumb(id)+'</div><h1>'+meta.t+'</h1>'+
  '<div class="dsc">'+meta.d+'</div>'+
  '<div class="ftg">'+meta.f.map(function(f){return "<span>"+f+"</span>"}).join("")+"</div>"+
  '<div class="smt" id="smt-'+id+'">'+
  '<button class="on" data-s="demo" data-p="'+id+'">演示</button>'+
  '<button data-s="xaml" data-p="'+id+'">XAML</button>'+
  '<button data-s="cs" data-p="'+id+'">C#</button></div>'+
  '<div id="seg-'+id+'"></div></div>';
 $("seg-"+id).innerHTML=pg.render?pg.render(document.createElement("div"))||"":"";
 if(pg.props)renderPGrid(id,pg.props);else renderPGrid(id,null);
 bindSeg(id);var d=$("dBody");d.scrollTop=0}
function bindSeg(id){document.querySelectorAll("#smt-"+id+" button").forEach(function(b){
 b.addEventListener("click",function(){curSeg[id]=b.dataset.s;
  document.querySelectorAll("#smt-"+id+" button").forEach(function(x){x.classList.toggle("on",x.dataset.s===b.dataset.s)});
  var pg=PG[id],target=$("seg-"+id);
  if(b.dataset.s==="demo"){target.innerHTML=pg.render?pg.render(document.createElement("div"))||"":""}
  else{target.innerHTML='<div class="smcode">'+(b.dataset.s==="xaml"?esc(pg.xaml):esc(pg.cs))+"</div>"}})})}
function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;")}
function docCrumb(id){for(var i=0;i<CATALOG.length;i++){var g=CATALOG[i];
 if(g.items.some(function(x){return x.id===id}))return tabName(g.id)+" / "+pt(id)}return pt(id)}

function renderPGrid(id,props){if(!props){props=PG.__SELF__||[]}
 var html='<div class="cat">外观 · 语言（全局）</div>';
 props.forEach(function(p){
  if(p.type==="combo"){
   html+='<div class="rw"><label>'+p.label+'</label><div class="ctl"><select data-id="'+p.id+'">'+
    p.options.map(function(o){return "<option "+(o===p.value?"selected":"")+">"+o+"</option>"}).join("")+"</select></div></div>"}
  else if(p.type==="bool"){
   html+='<div class="rw"><label>'+p.label+'</label><div class="ctl"><div class="switch'+(p.value?" on":"")+'" data-id="'+p.id+'" onclick="pgSw(this,\''+id+'|'+p.id+'\')"></div></div></div>'}
  else if(p.type==="range"){
   html+='<div class="rw"><label>'+p.label+'</label><div class="ctl"><input type="range" min="'+p.min+'" max="'+p.max+'" value="'+p.value+'" data-id="'+p.id+'"></div></div>'}
 });
 $("pGrid").innerHTML=html||'<div class="pgp-empty">当前文档无属性</div>';
 document.querySelectorAll("#pGrid select").forEach(function(s){
  s.addEventListener("change",function(){var p=defFind(props,s.dataset.id);if(p&&p.apply)p.apply(s.value)})});
 document.querySelectorAll("#pGrid input[type=range]").forEach(function(r){
  r.addEventListener("input",function(){var p=defFind(props,r.dataset.id);if(p&&p.apply)p.apply(+r.value)})});
}
function pgSw(el,key){el.classList.toggle("on");var v=el.classList.contains("on");
 var parts=key.split("|");var pid=parts[1];
 var p=(PG[ACTIVE_DOC]&&PG[ACTIVE_DOC].props||[]).find(function(x){return x.id===pid});
 if(p&&p.apply)p.apply(v)}
function defFind(props,pid){for(var i=0;i<props.length;i++){if(props[i].id===pid)return props[i]}return null}

/* ═══ Guide ═══ */
var gSteps=[],gIdx=0;
function guideGo(steps){gSteps=steps;gIdx=0;showStep();$("gMask").classList.add("on")}
function showStep(){var s=gSteps[gIdx];if(!s){gCloseGuide();return}
 var el=document.querySelector(s.sel);if(!el){gNextStep();return}
 var r=el.getBoundingClientRect();var sp=$("gSpot");
 sp.style.display="block";sp.style.left=(r.left-6)+"px";sp.style.top=(r.top-6)+"px";
 sp.style.width=(r.width+12)+"px";sp.style.height=(r.height+12)+"px";
 var tip=$("gTip");tip.style.display="block";
 var tx=Math.max(10,Math.min(r.left,innerWidth-320));
 var ty=r.bottom+12;if(ty+150>innerHeight)ty=Math.max(10,r.top-150);
 tip.style.left=tx+"px";tip.style.top=ty+"px";
 $("gT").textContent=s.t;$("gD").textContent=s.d;
 $("gN").textContent=(gIdx+1)+" / "+gSteps.length;
 log2both("引导："+s.t)}
function gNextStep(){gIdx++;if(gIdx>=gSteps.length)gCloseGuide();else showStep()}
function gCloseGuide(){$("gMask").classList.remove("on");$("gSpot").style.display="none";$("gTip").style.display="none"}
$("gNext").addEventListener("click",gNextStep);
$("gPrev").addEventListener("click",function(){gIdx=Math.max(0,gIdx-1);showStep()});
$("gClose").addEventListener("click",gCloseGuide);
$("gMask").addEventListener("click",gCloseGuide);

 document.documentElement.dataset.palette=e.target.value;renderPalDots();
 log2both("色板："+e.target.selectedOptions[0].text)});

function setLang(l){LANG=l;document.documentElement.lang=l;
 document.querySelectorAll("[data-i18n]").forEach(function(n){
  var k=n.dataset.i18n;if(I18N[LANG]&&I18N[LANG][k])n.textContent=I18N[LANG][k]});
 renderRTabs();renderRBody();renderTree();renderPalDots();

 log2both(LANG==="zh-CN"?"界面语言：简体中文":"Language: English")}

function renderPalDots(){var pals=["default","aqua","desert","dusk","night","contrast"];
 var colors={default:"#0064fa",aqua:"#0091a8",desert:"#c26a1d",dusk:"#7a5cc4",night:"#2b6cb0",contrast:"#888"};
 $("palDots").innerHTML=pals.map(function(p){
  return '<i style="background:'+colors[p]+'" data-p="'+p+'" title="'+p+'"></i>'}).join("");
 document.querySelectorAll(".pal i").forEach(function(i){

   document.getElementById("palSel").value=i.getAttribute("data-p");renderPalDots()})})}
