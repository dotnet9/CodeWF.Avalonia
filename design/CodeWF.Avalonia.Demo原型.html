<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark" data-palette="dotnet" data-density="cozy">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CodeWF.Avalonia.Demo — 原型</title>
<style>
/* ═══════════ 色板（6 色板 × 浅深，对应 ACSemiTheme ThemeDictionaries） ═══════════ */
:root{
  --pri:#0064fa;--pri-h:#0057d4;--pri-lt:rgba(0,100,250,.09);
  --bg:#fff;--bg2:#f5f6f8;--bg3:#eef0f3;--tx:#1c1f23;--tx2:#5c626b;--tx3:#757c85;
  --bd:#d9dce1;--bd2:#e6e8ec;--hov:#eef0f3;--sel:#e3edff;--workbg:#e4e7ec;
  --ok:#1f8a3b;--warn:#e8a103;--warn-tx:#3a2a00;--err:#c62828;
  /* 外观字号令牌（对应 Markdown 排版主题接管字号前的基础值） */
  --fs-crumb:11px;--fs-h1:19px;--fs-dsc:12.5px;--fs-tag:10.5px;--fs-code:11.5px;--fs-body:13px;
  /* 间距节奏：4 / 8 / 12 / 16 */
  --sp1:4px;--sp2:8px;--sp3:12px;--sp4:16px;
  --density:var(--sp2);
}
[data-palette=aqua]{--pri:#0091a8;--pri-h:#007a8e;--pri-lt:rgba(0,145,168,.10);--sel:#dff5f8}
[data-palette=desert]{--pri:#c26a1d;--pri-h:#a85a15;--pri-lt:rgba(194,106,29,.10);--sel:#faf0e2}
[data-palette=dusk]{--pri:#7a5cc4;--pri-h:#654aa8;--pri-lt:rgba(122,92,196,.10);--sel:#efe9fb}
[data-palette=night]{--pri:#2b6cb0;--pri-h:#245a96;--pri-lt:rgba(43,108,176,.10);--sel:#e2edf9}
[data-palette=contrast]{--pri:#000;--pri-h:#000;--pri-lt:rgba(0,0,0,.08);--sel:#eee}
[data-theme=dark]{
  --bg:#1b1b1f;--bg2:#232327;--bg3:#2a2a30;--tx:#e6e6e8;--tx2:#b3b8c0;--tx3:#8d939c;
  --bd:#3a3a40;--bd2:#2b2b30;--hov:#2a2a30;--sel:#1d2c44;--workbg:#111114;
}
[data-theme=dark][data-palette=default]{--pri:#4d9aff;--pri-h:#6cadff;--pri-lt:rgba(77,154,255,.14);--sel:#1d2c44}
[data-theme=dark][data-palette=aqua]{--pri:#2ec3dd;--pri-h:#4fd0e8;--sel:#123c44}
[data-theme=dark][data-palette=desert]{--pri:#e8a355;--pri-h:#efb56f;--sel:#443318}
[data-theme=dark][data-palette=dusk]{--pri:#a98ae0;--pri-h:#bca0e8;--sel:#322a4a}
[data-theme=dark][data-palette=night]{--pri:#5b93cf;--pri-h:#74a8db;--sel:#1a2a3e}
[data-theme=dark][data-palette=contrast]{--pri:#fff;--pri-h:#fff;--pri-lt:rgba(255,255,255,.12);--sel:#333}
/* 高对比白底：主色白不可用于文字，正文色调成纯黑 */
[data-palette=contrast] .cap .lg,[data-palette=contrast] .cap .ver{color:#fff}
[data-palette=contrast] .bd h1{color:var(--tx)}

/* 密度：舒适 / 紧凑（属性面板密度切换） */
[data-density=compact]{--density:var(--sp1)}
[data-density=compact] .dt{height:auto}
[data-density=compact] .tree .lf{height:22px}

/* ═══════════ 桌面背景 + 窗口卡片（不铺满，看得出是桌面软件） ═══════════ */
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:
    radial-gradient(1200px 600px at 20% 0%,#1d2b53 0%,transparent 60%),
    radial-gradient(1000px 700px at 85% 100%,#0f3460 0%,transparent 55%),
    linear-gradient(135deg,#0b1322 0%,#101b30 100%);
  display:flex;align-items:center;justify-content:center;
  padding:14px;font:13px/1.6 "Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;color:var(--tx);
  overflow:hidden;user-select:none;
}
.win{
  width:min(1480px,100%);height:100%;min-height:640px;
  background:var(--bg);border-radius:10px;overflow:hidden;
  border:1px solid rgba(255,255,255,.14);
  box-shadow:0 24px 70px rgba(0,0,0,.55),0 4px 14px rgba(0,0,0,.35);
  display:grid;grid-template-rows:34px 32px auto 1fr 28px;
}
button,input,select,textarea{font:inherit;color:inherit}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:var(--bd);border-radius:5px;border:2px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-thumb:hover{background:var(--tx3)}

/* ═══ 通用：线性图标（stroke 走 currentColor，对齐 IconPark / TDesign 风格） ═══ */
.svgic{display:block;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none;transition:transform .16s ease}
.svgic.s14{width:14px;height:14px}
.svgic.s16{width:16px;height:16px}
.svgic.s18{width:18px;height:18px}
.svgic.s20{width:20px;height:20px}
.svgic.s22{width:22px;height:22px}

/* ═══ 1. 标题栏 34px（CodeWFWindow） ═══ */
.cap{display:flex;align-items:center;height:34px;padding-left:10px;gap:8px;position:relative;
  background:linear-gradient(90deg,var(--pri) 0%,var(--pri-h) 26%,rgba(0,0,0,0) 58%),var(--bg2);
  border-bottom:1px solid var(--bd)}
.cap .logo{width:20px;height:20px;border-radius:5px;display:block;flex:none;
  box-shadow:0 1px 5px rgba(0,0,0,.3),0 0 0 1px rgba(255,255,255,.22)}
.cap .lg{font-weight:700;color:#fff;letter-spacing:.4px;font-size:13px;text-shadow:0 1px 2px rgba(0,0,0,.35)}
.cap .vbadge{font-size:10px;padding:0 7px;line-height:16px;border-radius:999px;color:#fff;
  background:rgba(255,255,255,.20);border:1px solid rgba(255,255,255,.34)}
.cap .sp{flex:1}
.cap select{height:22px;font-size:11px;border:1px solid var(--bd);border-radius:4px;background:var(--bg);color:var(--tx)}
.cap .wb{width:40px;height:34px;display:flex;align-items:center;justify-content:center;
  border:none;background:transparent;cursor:pointer;color:var(--tx2);transition:background .12s,color .12s}
.cap .wb svg{width:12px;height:12px;stroke:currentColor;stroke-width:1.3;fill:none;stroke-linecap:round;stroke-linejoin:round}
.cap .wb:hover{background:var(--hov);color:var(--tx)}
.cap .wb:focus-visible{outline:2px solid var(--pri);outline-offset:-2px}
.cap .wb.cls:hover{background:var(--err);color:#fff}
.cap .pal{display:inline-flex;gap:5px;align-items:center;margin:0 2px}
.cap .pal i{width:12px;height:12px;border-radius:50%;cursor:pointer;border:1px solid rgba(128,128,128,.55);display:block;transition:transform .12s,box-shadow .12s}
.cap .pal i:hover{transform:scale(1.25)}
.cap .pal i.on{box-shadow:0 0 0 2px var(--bg),0 0 0 3.5px var(--pri)}

/* ═══ 2. Ribbon 页签行 32px ═══ */
.rtabs{display:flex;align-items:center;height:32px;padding:0 10px;gap:2px;background:var(--bg);border-bottom:1px solid var(--bd)}
.qk{display:flex;align-items:center;gap:2px;margin-right:10px;padding-right:12px;border-right:1px solid var(--bd2)}
.qk button{width:28px;height:26px;display:flex;align-items:center;justify-content:center;border:none;background:transparent;
  border-radius:4px;cursor:pointer;color:var(--tx2);transition:background .12s,color .12s}
.qk button:hover{background:var(--hov);color:var(--pri)}
.qk button:focus-visible{outline:2px solid var(--pri);outline-offset:-2px}
.rt2{display:flex;align-items:center;height:100%;gap:2px;overflow-x:auto;overflow-y:hidden;flex-wrap:nowrap}
.rt2 .t2{display:inline-flex;align-items:center;gap:6px;flex:none;padding:0 14px;height:100%;cursor:pointer;
  color:var(--tx2);font-size:12.5px;user-select:none;letter-spacing:.6px;position:relative;white-space:nowrap;
  border-radius:4px 4px 0 0;transition:background .12s,color .12s}
.rt2 .t2 .svgic{display:inline-block;vertical-align:-2px}
.rt2 .t2:hover{color:var(--pri);background:var(--hov)}
.rt2 .t2:focus-visible{outline:2px solid var(--pri);outline-offset:-4px}
.rt2 .t2.on{color:var(--pri);font-weight:600}
.rt2 .t2.on::after{content:"";position:absolute;left:14px;right:14px;bottom:0;height:2px;background:var(--pri);border-radius:2px 2px 0 0}
.qk2{margin-left:auto;display:flex;align-items:center;gap:2px;padding-left:10px}
.qk2 button{height:26px;display:inline-flex;align-items:center;gap:6px;border:1px solid transparent;background:transparent;
  border-radius:4px;cursor:pointer;color:var(--tx2);font-size:11px;padding:0 9px;white-space:nowrap;
  transition:background .12s,color .12s,border-color .12s}
.qk2 button:hover{background:var(--hov);color:var(--pri);border-color:var(--bd)}
.qk2 button .kbd{color:var(--tx3);font-size:10px;letter-spacing:.2px}
.qk2 button:focus-visible{outline:2px solid var(--pri);outline-offset:-2px}

/* ═══ 3. Ribbon 命令区：104px 展开 / 0 收起（高度够放下「图标 + 文字 + 分组名」） ═══ */
.rbn{background:var(--bg);border-bottom:1px solid var(--bd);padding:var(--sp2) var(--sp4) 0;
  height:104px;display:flex;align-items:stretch;overflow-x:auto;overflow-y:hidden;
  transition:height .16s ease,padding .16s ease,opacity .12s ease}
body.rmn .rbn{padding-top:0;padding-bottom:0;height:0;opacity:0;border-bottom:none;overflow:hidden}
.grp{display:flex;flex-direction:column;gap:2px;padding:0 var(--sp3) 6px;border-right:1px solid var(--bd2);flex:none}
.grp:last-child{border-right:none}
.grp .cmds{display:flex;gap:2px;flex:1;align-items:flex-start;flex-wrap:wrap;align-content:flex-start}
.grp .gname{text-align:center;font-size:10.5px;color:var(--tx2);font-weight:700;letter-spacing:1.5px;padding:4px 0 2px}
.cbtn{display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:6px;
  width:74px;height:68px;padding:8px 4px 4px;border:none;background:transparent;cursor:pointer;
  border-radius:7px;color:var(--tx);transition:background .13s ease,transform .13s ease}
.cbtn:hover{background:var(--hov)}
.cbtn:hover .svgic{transform:translateY(-1px) scale(1.06)}
.cbtn:active{background:var(--pri-lt);transform:scale(.97)}
.cbtn:focus-visible{outline:2px solid var(--pri);outline-offset:-2px}
.cbtn[aria-pressed=true]{background:var(--sel);color:var(--pri)}
.cbtn.on{background:var(--sel);color:var(--pri)}
.cbtn .ic{height:22px;display:flex;align-items:center;justify-content:center;color:var(--pri)}
.cbtn .lb{font-size:11px;line-height:1.3;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:68px}
.cbtn:disabled,.cbtn[disabled]{opacity:.45;cursor:not-allowed;background:transparent}

/* ═══ 4. 主内容 = Dock 工作区 ═══ */
.main{flex:1;min-height:0;display:flex;flex-direction:column;gap:var(--sp2);padding:var(--sp2) 10px;background:var(--workbg);overflow:hidden}
.dockrow{flex:1;min-height:0;display:flex;gap:var(--sp2)}
.panel{background:var(--bg);border:1px solid var(--bd);border-radius:8px;display:flex;flex-direction:column;
  overflow:hidden;min-height:0;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.phd{display:flex;align-items:center;height:30px;flex:none;padding:0 10px;background:var(--bg2);
  border-bottom:1px solid var(--bd);font-size:11px;font-weight:700;color:var(--tx2);gap:7px;letter-spacing:.5px}
.phd .hdic{color:var(--pri);display:flex;align-items:center}
.phd .cnt{margin-left:auto;font-weight:600;color:var(--tx3);font-size:10px;background:var(--bg3);
  border-radius:999px;padding:0 7px;line-height:16px}
.phd .tb{display:flex;gap:2px;margin-left:6px}
.phd .tb button{min-width:24px;height:20px;display:inline-flex;align-items:center;justify-content:center;
  border:none;background:transparent;cursor:pointer;border-radius:3px;
  color:var(--tx2);font-size:11px;white-space:nowrap;padding:0 5px;transition:background .12s,color .12s}
.phd .tb button:hover{background:var(--pri-lt);color:var(--pri)}
.phd .tb button:focus-visible{outline:2px solid var(--pri);outline-offset:-2px}
.pbd{flex:1;min-height:0;overflow:auto}
.p-nav{width:224px;flex:none}
body.hideL .p-nav{display:none}
.p-props{width:266px;flex:none}
body.hideR .p-props{display:none}
.p-log{height:150px;flex:none}
body.hideLog .p-log{display:none}

/* 左：导航树（含就地重命名 / 过滤 / 空态） */
.tree{padding:5px}
.tree .fnd{display:flex;gap:4px;padding:2px 4px 6px}
.tree .fnd input{flex:1;height:24px;font-size:11.5px;padding:0 7px;border:1px solid var(--bd);border-radius:5px;background:var(--bg);color:var(--tx)}
.tree .fnd input:focus{outline:none;border-color:var(--pri)}
.tree .nd{user-select:none}
.tree .nd .hd{display:flex;align-items:center;gap:5px;height:27px;padding:0 6px;border-radius:5px;cursor:pointer;color:var(--tx)}
.tree .nd .hd:hover{background:var(--hov)}
.tree .nd .hd .arw{width:12px;font-size:9px;color:var(--tx3);transition:transform .12s}
.tree .nd.open>.hd .arw{transform:rotate(90deg)}
.tree .nd .hd .gi{font-size:12px}
.tree .nd .kids{display:none;margin-left:15px;border-left:1px solid var(--bd2);padding-left:5px}
.tree .nd.open>.kids{display:block}
.tree .lf{display:flex;align-items:center;gap:6px;height:26px;padding:0 6px 0 10px;border-radius:5px;
  cursor:pointer;color:var(--tx2);font-size:12px}
.tree .lf:hover{background:var(--hov);color:var(--tx)}
.tree .lf.on{background:var(--sel);color:var(--pri);font-weight:600}
.tree .lf .ic{font-size:11px}
.tree .lf .sp2{flex:1}
.tree .lf .hbtn{visibility:hidden;border:none;background:transparent;color:var(--tx3);cursor:pointer;font-size:11px}
.tree .lf:hover .hbtn{visibility:visible}
.tree .lf .hbtn:hover{color:var(--pri)}
.tree .lf input.rnm{width:100%;height:20px;font-size:12px;padding:0 4px;border:1px solid var(--pri);border-radius:3px;background:var(--bg);color:var(--tx)}
.tree .empty{padding:14px 10px;color:var(--tx3);font-size:11px;text-align:center}

/* 中：文档面板（梯形页签 + 空态） */
.dts{display:flex;align-items:flex-end;height:32px;flex:none;padding:5px 8px 0;gap:4px;background:var(--bg2);
  border-bottom:1px solid var(--bd);overflow-x:auto}
.dts .dkb{display:flex;gap:3px;margin-right:8px;align-self:center}
.dts .dkb button{border:1px solid var(--bd);background:var(--bg);border-radius:4px;padding:2px 8px;
  cursor:pointer;font-size:10px;color:var(--tx2)}
.dts .dkb button:hover{border-color:var(--pri);color:var(--pri)}
.dts .dkb button:focus-visible{outline:2px solid var(--pri);outline-offset:1px}
.dt{display:flex;align-items:center;gap:8px;padding:5px 8px 5px 16px;cursor:pointer;font-size:12px;color:var(--tx2);
  background:var(--bg3);border:1px solid var(--bd2);border-bottom:none;
  clip-path:polygon(10px 0,100% 0,calc(100% - 10px) 100%,0 100%);user-select:none;white-space:nowrap}
.dt:hover{color:var(--tx)}
.dt.on{background:var(--bg);color:var(--tx);font-weight:600;border-bottom:2px solid var(--pri)}
.dt .x{width:14px;height:14px;display:flex;align-items:center;justify-content:center;border-radius:3px;font-size:10px;color:var(--tx3)}
.dt .x:hover{background:var(--err);color:#fff}
.dbody{flex:1;min-height:0;overflow:auto;padding:var(--sp3) var(--sp4) 26px}
.doc .crumb{font-size:12px;color:var(--tx3);margin-bottom:6px;display:flex;align-items:center;gap:6px}
.doc .crumb svg{color:var(--tx3)}
.doc h1{font-size:19px;margin-bottom:4px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.doc .alias{font-size:11.5px;color:var(--tx3);font-family:Consolas,monospace;margin:-2px 0 6px;letter-spacing:.2px}
.doc .dsc{color:var(--tx2);font-size:var(--fs-dsc);margin-bottom:var(--sp3);line-height:1.7}
.ftg{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.ftg span{font-size:var(--fs-tag);padding:1px 9px;border-radius:10px;background:var(--pri-lt);color:var(--pri);font-weight:600}
.smt{display:inline-flex;border:1px solid var(--bd);border-radius:6px;overflow:hidden;margin-bottom:14px}
.smt button{border:none;background:var(--bg2);padding:4px 18px;cursor:pointer;font-size:11px;color:var(--tx2)}
.smt button.on{background:var(--pri);color:#fff;font-weight:600}
.smcode{background:var(--bg3);border:1px solid var(--bd2);border-radius:6px;padding:12px 14px;
  font-family:Consolas,monospace;font-size:var(--fs-code);line-height:1.65;white-space:pre;overflow:auto;
  max-height:300px;margin-bottom:14px;color:var(--tx)}
.demo{border:1px solid var(--bd2);border-radius:8px;padding:var(--sp4);background:var(--bg);margin-bottom:var(--sp3)}
.demo h4{font-size:12px;color:var(--tx3);font-weight:600;margin-bottom:10px;letter-spacing:.5px}
.row{display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.hint{font-size:11px;color:var(--tx3);margin-top:8px;line-height:1.6}
.btn{border:1px solid var(--bd);background:var(--bg);border-radius:5px;padding:5px 16px;cursor:pointer;font-size:12px}
.btn:hover{border-color:var(--pri);color:var(--pri)}
.btn:focus-visible{outline:2px solid var(--pri);outline-offset:1px}
.btn.pri{border-color:var(--pri);color:var(--pri);background:var(--pri-lt)}
.btn.danger{border-color:var(--err);color:var(--err)}
.btn.danger:hover{background:var(--err);color:#fff;border-color:var(--err)}
.btn:disabled{opacity:.45;cursor:not-allowed}

/* Markdown */
.mdr{max-width:780px;font-size:var(--fs-body);line-height:1.85}
.mdr h1,.mdr h2,.mdr h3{color:var(--pri);margin:12px 0 8px}
.mdr p{margin:8px 0}
.mdr code{background:var(--bg3);padding:1px 6px;border-radius:3px;font-family:Consolas,monospace;font-size:12px}
.mdr pre{background:var(--bg3);border:1px solid var(--bd2);border-radius:6px;padding:10px 14px;overflow:auto;
  font-family:Consolas,monospace;font-size:12px;margin:10px 0;line-height:1.6}
.mdr blockquote{border-left:3px solid var(--pri);padding:4px 14px;margin:10px 0;background:var(--pri-lt);border-radius:0 4px 4px 0}
.mdr table{border-collapse:collapse;margin:10px 0;font-size:12px}
.mdr th,.mdr td{border:1px solid var(--bd);padding:5px 14px}
.mdr th{background:var(--bg2)}
.mdr ul{padding-left:22px}
.mdr input[type=checkbox]{accent-color:var(--pri)}

/* DataGrid */
.dg{border-collapse:collapse;width:100%;font-size:12px}
.dg th,.dg td{padding:7px 16px;text-align:left}
.dg th{background:var(--bg2);font-weight:600;cursor:pointer;user-select:none;white-space:nowrap}
.dg th:hover{background:var(--hov)}
.dg th .arr{color:var(--pri);margin-left:3px}
.dg tbody tr{border-bottom:1px solid var(--bd2)}
.dg tbody tr:hover{background:var(--hov)}
.dg tbody tr.on{background:var(--sel)}

/* 右：属性面板 */
.pgp{padding:2px 6px 12px}
.pgp .cat{font-size:10px;font-weight:700;color:var(--pri);padding:9px 4px 3px;letter-spacing:1px;
  border-bottom:1px solid var(--bd2);margin-bottom:3px;text-transform:uppercase}
.pgp .rw{display:grid;grid-template-columns:100px 1fr;align-items:center;min-height:28px;padding:1px 4px 1px 7px;border-radius:4px;gap:6px;position:relative}
.pgp .rw:hover{background:var(--hov)}
.pgp .rw.mod::before{content:"";position:absolute;left:0;top:4px;bottom:4px;width:2px;border-radius:2px;background:var(--pri)}
.pgp .rw.mod label{color:var(--tx);font-weight:600}
.pgp label{font-size:11px;color:var(--tx2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pgp .ctl{display:flex;justify-content:flex-end}
.pgp .ctl input[type=text],.pgp .ctl select{width:100%;height:24px;font-size:11px;padding:0 6px;text-align:left;
  border:1px solid var(--bd);border-radius:4px;background:var(--bg);color:var(--tx);outline:none}
.pgp .ctl input:focus,.pgp .ctl select:focus{border-color:var(--pri)}
.pgp .ctl input[type=range]{width:100%;accent-color:var(--pri)}
.pgp .switch{width:32px;height:17px;border-radius:9px;background:var(--bd);position:relative;cursor:pointer;transition:background .12s}
.pgp .switch.on{background:var(--pri)}
.pgp .switch::after{content:"";position:absolute;width:13px;height:13px;border-radius:50%;background:#fff;top:2px;left:2px;transition:left .12s}
.pgp .switch.on::after{left:17px}
.pgp-empty{padding:16px 10px;color:var(--tx3);font-size:11px;line-height:1.7}

/* 底部日志面板 */

.catalog-status[data-level="Debug"]{--status-color:#54a9ff}.catalog-status[data-level="Info"]{--status-color:var(--ok)}.catalog-status[data-level="Warn"]{--status-color:var(--warn)}.catalog-status[data-level="Error"],.catalog-status[data-level="Fatal"]{--status-color:var(--err)}.catalog-status{border-color:var(--status-color);background:color-mix(in srgb,var(--status-color) 12%,var(--bg2))}.catalog-status strong{background:var(--status-color)}.catalog-status.card strong{background:transparent;color:var(--status-color)}

.catalog-grid{width:100%;border-collapse:collapse;table-layout:fixed}.catalog-grid td,.catalog-grid th{padding:9px;border-bottom:1px solid var(--line);text-align:left}.catalog-grid th{cursor:pointer}.catalog-grid td span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.catalog-grid tr.selected{background:color-mix(in srgb,var(--pri) 16%,transparent)}
.catalog-expand{overflow:hidden;transition:width .3s ease,height .3s ease,opacity .3s ease;background:var(--bg2);border-radius:10px}.catalog-expand>div{padding:18px;min-width:100px}.catalog-expand.horizontal{height:140px}.catalog-expand.vertical{width:100%}
.catalog-live{padding:10px;min-height:280px;border:1px solid var(--line);border-radius:8px}.catalog-block{padding:12px;border:1px solid transparent;border-radius:6px;cursor:text}.catalog-block:hover,.catalog-block:focus-within{border-color:var(--pri)}.catalog-block textarea{width:100%;min-height:70px;color:var(--tx);background:var(--bg2);border:0;padding:8px;box-sizing:border-box;resize:vertical;font:13px/1.7 Consolas,monospace}

.catalog-status-row{flex-wrap:wrap}.catalog-status.card{box-sizing:border-box;width:180px;min-height:80px;flex:0 0 180px;gap:0;padding:8px 8px 8px 48px;text-align:left}.catalog-status.card strong{padding:0;font-size:12px}.catalog-status.card span{padding:8px 0 0;font-size:16px}.catalog-status.catalog-driven{width:100%;margin-top:12px}

/* 与原生外壳共用 Ribbon 尺寸，命令保留完整 API 名。 */
body{font-family:"Segoe UI","Microsoft YaHei UI",sans-serif}
.rbn{height:104px;padding:4px 12px 2px;display:flex;gap:12px;align-items:flex-start}
.grp{flex:none;padding-right:12px;margin-right:0}.grp .cmds{display:grid;grid-auto-flow:column;grid-template-rows:80px;gap:0 4px}
.cbtn{min-width:95px;max-width:none;padding:3px 8px;height:80px}.cbtn .lb{max-width:none;white-space:nowrap;overflow-wrap:normal}
.ribbon-small .cmds{grid-template-rows:repeat(2,40px)}.ribbon-small .cbtn{height:40px;flex-direction:row;justify-content:flex-start}.cbtn .ic{display:flex;align-items:center;justify-content:center;width:32px;height:32px;flex:none}.cbtn .ic svg{width:32px;height:32px}
.qk button{width:30px;height:30px;color:var(--tx2)}.qk button svg{width:18px;height:18px}.qk button:hover{color:var(--pri)}.qk button:active{background:var(--pri-lt)}
.grp .gname{height:18px;padding-top:2px;font-size:10px;letter-spacing:0}
.p-nav{width:16%;min-width:164px}.p-props{width:17%;min-width:220px}.p-log{height:14%;min-height:60px}
.tree .lf{font-size:11.5px;height:30px}.tree .nd .hd{height:31px;font-size:11px}
.dbody:not([data-page="welcome"]){padding:0}.catalog-header{padding:10px 16px;gap:12px}.catalog-header h1{line-height:1.35}.catalog-header .catalog-description{margin-top:3px;line-height:1.5}
.dbody:not([data-page="welcome"])>[id^="seg-"]{padding:14px 16px}.demo{border-radius:10px}
[data-density="compact"] .cbtn{min-width:80px;padding:3px 4px}
.catalog-markdown-basic{display:flex;flex-direction:column;gap:8px;font-size:16px;line-height:26px;color:var(--tx)}
.catalog-markdown-basic h1{font-size:32px;line-height:1.2;margin:18px 0 10px;font-weight:700}
.catalog-markdown-basic h2{font-size:24px;line-height:1.2;margin:18px 0 10px;padding-bottom:6px;border-bottom:2px solid var(--bd);font-weight:700}
.catalog-markdown-basic h3{font-size:20px;margin:18px 0 10px}.catalog-markdown-basic p{margin:4px 0 10px}
.catalog-markdown-basic ul{display:flex;flex-direction:column;gap:6px;padding-left:24px;margin:2px 0 8px}.catalog-markdown-basic li{margin:2px 0}.catalog-markdown-basic .markdown-task{list-style:none;margin-left:-16px}.catalog-markdown-basic input{vertical-align:middle;width:16px;height:16px;margin-right:8px;accent-color:var(--pri)}
.catalog-markdown-basic code{font:13px Consolas,monospace}.catalog-markdown-basic pre{padding:12px;background:var(--bg2);border:1px solid var(--bd);border-radius:8px;margin:8px 0 12px;white-space:pre-wrap;font:13px/20px Consolas,monospace}
.catalog-markdown-basic table{border-collapse:collapse;margin:10px 0 16px;width:100%}.catalog-markdown-basic td,.catalog-markdown-basic th{border:1px solid var(--bd);padding:8px 10px;text-align:left}
.catalog-markdown-basic blockquote{border-left:4px solid var(--pri);border-radius:6px;padding:8px 12px;margin:6px 0 12px;background:var(--bg2)}
.catalog-markdown-input summary{padding:14px 16px;border-bottom:1px solid var(--bd2);cursor:pointer;font-size:13px;font-weight:600}.catalog-markdown-input textarea{height:96px;margin-top:8px}
.dbody:not([data-page="welcome"])>.catalog-markdown-page{padding:10px 12px}.catalog-live{font-size:15px;line-height:26px}

.dbody[data-page="welcome"]{padding:16px 20px}

.qk2 button svg{width:18px;height:18px}.rw textarea{width:100%;min-height:64px;resize:vertical;box-sizing:border-box;background:var(--bg2);color:var(--tx);border:1px solid var(--line);border-radius:4px}.rw:has(textarea){height:auto;min-height:74px}

var LOG_LEVEL = "Info";
function dlog(msg, lv) {
 var b = $("logP"); if (!b) return;
 var d = new Date(), tm = ("0" + d.getHours()).slice(-2) + ":" + ("0" + d.getMinutes()).slice(-2) + ":" + ("0" + d.getSeconds()).slice(-2);
 var cls = lv === "info" ? "ll1" : lv === "warn" ? "ll2" : lv === "error" ? "ll3" : "";
 var e = document.createElement("div"); e.className = cls;
 e.innerHTML = '<span class="ltm">' + tm + "</span>" + msg;
 b.appendChild(e); b.scrollTop = b.scrollHeight;
 if (lv === "info" || lv === "warn" || lv === "error") LOG_LEVEL = lv === "info" ? "Info" : lv === "warn" ? "Warn" : "Error";
 var st = $("stLogLv"); if (st) st.textContent = LOG_LEVEL;
}
function p_append(b, e) { b.appendChild(e); b.scrollTop = b.scrollHeight; }
function setStatus(msg) {
 var el = $("stTx"); if (el) el.textContent = msg;
 var f = $("stFlush");
 if (f) { var d = new Date(); f.textContent = ("0" + d.getHours()).slice(-2) + ":" + ("0" + d.getMinutes()).slice(-2) + ":" + ("0" + d.getSeconds()).slice(-2); }
}
function log2both(msg, lv) {
 dlog(msg, lv);
 var s = $("lgStream");
 if (s) {
  var e = document.createElement("div");
  e.className = lv === "warn" ? "w" : lv === "error" ? "e" : lv === "debug" ? "d" : "";
  e.innerHTML = "<span style='color:var(--tx3);margin-right:10px'>" + new Date().toLocaleTimeString() + "</span>" + msg;
  p_append(s, e);
 }
 setStatus(msg);
}
function notify(kind, title, body) {
 var box = $("nc"); if (!box) return;
 var k = kind === "ok" ? "s" : kind === "warn" ? "w" : kind === "err" ? "e" : "i";
 var card = document.createElement("div");
 card.className = "ncard " + k;
 card.innerHTML = '<span>●</span><div style="flex:1"><div class="nt">' + esc(title) + '</div><div class="nb">' + esc(body || "") + "</div></div>" +
  '<button class="nx" title="' + esc(tt("g.close")) + '">✕</button>';
 card.querySelector(".nx").onclick = function () { if (card.parentNode === box) box.removeChild(card); };
 box.appendChild(card);
 while (box.children.length > 4) box.removeChild(box.children[0]);
 setTimeout(function () { if (card.parentNode === box) box.removeChild(card); }, 6000);
}
var _dlgYes = null;
function confirmDlg(title, body, onYes, danger) {

 $("dlgYes").className = "btn " + (danger === false ? "pri" : "danger");

}

/* ═══ 属性面板 ═══ */
function propKey(pageId, p) { return (p.global ? "" : (pageId || "")) + "|" + p.id; }
function rowHtml(pageId, p) {
 var mod = MODIFIED[propKey(pageId, p)] ? " mod" : "";

 if (p.type === "combo") {
  ctl = '<select data-id="' + p.id + '"' + (p.readonly ? " disabled" : "") + ">" +
   p.options.map(function (o) { return "<option" + (o === p.value ? " selected" : "") + ">" + esc(o) + "</option>"; }).join("") + "</select>";
 } else if (p.type === "bool") {
  ctl = '<div class="switch' + (p.value ? " on" : "") + '" data-id="' + p.id + '" role="switch" tabindex="0" title="' + esc(p.label) + '"></div>';
 } else if (p.type === "text" || p.type === "multiline") {
  ctl = p.type === "multiline"
   ? '<textarea data-id="' + p.id + '">' + esc(String(p.value)) + '</textarea>'
   : '<input type="text" data-id="' + p.id + '" value="' + esc(String(p.value)) + '">';
 } else {
  ctl = '<input type="range" data-id="' + p.id + '" min="' + p.min + '" max="' + p.max + '" step="' + (p.step || 1) +
   '" value="' + p.value + '"' + (p.readonly ? " disabled" : "") + ">";
 }
 return '<div class="rw' + mod + '"><label title="' + esc(p.label) + '">' + esc(p.label) + '</label><div class="ctl">' + ctl + "</div></div>";
}
function renderPGrid(id) {
 var pageProps = (id && PROTO[id] && PROTO[id].props) || [];
 var html = '<div class="cat">外观 · 语言（全局）</div>' + SELF_PROPS.map(function (p) { return rowHtml(id, p); }).join("");
 html += '<div class="cat">' + esc(id ? pt(id) : "当前文档") + "</div>";
 html += pageProps.length ? pageProps.map(function (p) { return rowHtml(id, p); }).join("")
  : '<div class="pgp-empty">当前文档无属性</div>';
 html += '<div class="cat">状态</div>' +
  '<div class="rw"><label>打开文档数</label><div class="ctl"><span style="font-size:11px">' + OPEN_DOCS.length + "</span></div></div>" +
  '<div class="rw"><label>日志级别</label><div class="ctl"><span style="font-size:11px">' + esc(LOG_LEVEL) + "</span></div></div>";
 $("pGrid").innerHTML = html;
 var cnt = $("pgCnt"); if (cnt) cnt.textContent = "(" + (SELF_PROPS.length + pageProps.length) + " 项)";
 var all = SELF_PROPS.concat(pageProps);
 all.forEach(function (p) {
  var el = document.querySelector('#pGrid [data-id="' + p.id + '"]');
  if (!el) return;
  if (p.type === "combo") el.onchange = function () { applyProp(id, p, el.value); };
  else if (p.type === "range") el.oninput = function () { applyProp(id, p, +el.value, true); };
  else if (p.type === "text" || p.type === "multiline") el.onchange = function () { applyProp(id, p, el.value); };
  else if (p.type === "bool") el.onclick = function () { el.classList.toggle("on"); applyProp(id, p, el.classList.contains("on"), true); };
 });
}
function applyProp(pageId, p, v, light) {
 p.value = v;
 var k = propKey(pageId, p);
 var first = !MODIFIED[k];
 MODIFIED[k] = true;
 if (p.apply) guard(function () { p.apply(v); }, "prop:" + p.id);

}

  REG('about',{zh:apiMeta(entries.about),props:[],render:function(el){

    el.querySelectorAll('[data-open="flow-write"]').forEach(function(button){button.onclick=function(){openDoc('md-viewer');};});

  renderDoc=function(id){

    var head=id==='welcome'?'':'<header class="catalog-header"><div><h1>'+esc(pt(id))+'</h1><p>'+esc(entry.package||text('AboutDesc'))+'</p><p class="catalog-description">'+esc(description(entry))+'</p></div>'+(hasSource?'<button class="btn" id="catalog-source-toggle">'+esc(text('Source'))+'</button>':'')+'</header>';
    $('dBody').dataset.page=id;
    $('dBody').innerHTML=head+'<div id="seg-'+id+'"></div>'+(id==='welcome'?'':'<div class="catalog-source" hidden><div class="smt"><button data-source="xaml">XAML</button><button data-source="cs">C#</button></div><pre></pre></div>');
    renderInto(id,$('seg-'+id));
    if(pg.after)guard(function(){pg.after();},'after:'+id);
    var source=$('dBody').querySelector('.catalog-source');
    if(source){
      if (!hasSource) source.remove();
      else {
      function showCode(language){source.querySelector('pre').textContent=pg[language]||entry.code||entry.api;}
      source.querySelector('[data-source="xaml"]').hidden = !pg.xaml;
      source.querySelector('[data-source="cs"]').hidden = !(pg.cs || entry.code);
      showCode(pg.cs || entry.code ? 'cs' : 'xaml');
      $('catalog-source-toggle').onclick=function(){source.hidden=!source.hidden;};
      source.querySelectorAll('button').forEach(function(button){button.onclick=function(){showCode(button.dataset.source);};});

    renderPGrid(id);
    if($('stWhere'))$('stWhere').textContent=docCrumb(id);
    if(!matchMedia('(prefers-reduced-motion: reduce)').matches)$('seg-'+id).animate([{opacity:.4,transform:'translateY(5px)'},{opacity:1,transform:'none'}],{duration:220,easing:'ease-out'});

  PROTO.welcome.zh.t=pt('welcome');
  var widths = {}, workspace = document.querySelector('.document-workspace');
  var splitter = document.querySelector('.document-splitter');

  splitter.onpointerdown = function(event) {
    var origin = event.clientX, initial = document.querySelector('.p-props').getBoundingClientRect().width;
    splitter.setPointerCapture(event.pointerId);
    splitter.onpointermove = function(move) { resizeProperties(initial + origin - move.clientX); };
    splitter.onpointerup = splitter.onpointercancel = function() { splitter.onpointermove = null; };
  };
  splitter.onkeydown = function(event) {
    if(event.key !== 'ArrowLeft' && event.key !== 'ArrowRight') return;
    event.preventDefault();
    resizeProperties(document.querySelector('.p-props').getBoundingClientRect().width + (event.key === 'ArrowLeft' ? 16 : -16));
  };
  var renderWithProperties = renderDoc;
  renderDoc = function(id) {
    workspace.style.setProperty('--document-properties-width', (widths[id] || 260) + 'px');
    return renderWithProperties(id);

  curTab='home';
  // 浏览器中模拟桌面窗体按钮，不影响浏览器自身窗口。
  var frame=document.querySelector('.win');
  function windowLabels(){
    var labels=LANG==='en-US'?{minimize:'Minimize',maximize:'Maximize / restore',close:'Close'}:{minimize:'最小化',maximize:'最大化 / 还原',close:'关闭'};
    document.querySelectorAll('[data-window-action]').forEach(function(button){button.title=labels[button.dataset.windowAction];button.setAttribute('aria-label',button.title);});
  }

    if(action==='maximize'){document.body.classList.toggle('prototype-maximized');return;}
    frame.style.display='none';
    var restore=document.createElement('button');restore.className='prototype-window-restore';
    restore.textContent=LANG==='en-US'?'Reopen demo window':'重新打开演示窗口';
    restore.onclick=function(){frame.style.display='';restore.remove();};
    document.body.appendChild(restore);restore.focus();
  }
  document.querySelectorAll('[data-window-action]').forEach(function(button){button.onclick=function(){windowAction(button.dataset.windowAction);};});
  document.querySelector('.cap').ondblclick=function(event){if(!event.target.closest('button,select'))windowAction('maximize');};
  var localizeWindow=setLang;
  setLang=function(language){localizeWindow(language);windowLabels();};

  renderRTabs();renderTree();renderDocTabs();

<script>
/* Focused examples of the public controls; labels are shared with the native demo. */
"use strict";
(function () {
  function text(key) { return window.CodeWFCatalogText[LANG][key] || key; }
  function register(id, options) {
    var entry = window.CodeWFDemoCatalog.flatMap(function(g){return g.items;}).find(function(e){return e.prototypeId===id;});
    options.zh = {t:entry.titleZh,d:entry.package,f:[]};
    options.en = {t:entry.titleEn,d:entry.package,f:[]};
    options.props = options.props || [];
    REG(id, options);
  }
  ['if','switch'].forEach(function(id){
    PROTO[id].xaml = window.CodeWFCatalogDescriptions[LANG][id === 'if' ? 'If' : 'Switch'].Xaml;
  });
  function samples() { return window.CodeWFMarkdownSamples[LANG]; }
  function applyTypography(id) {
    var page = document.querySelector('#seg-'+id+' .catalog-markdown-basic');
    if(!page)return;
    var props=PROTO[id].props, theme=props.find(function(p){return p.id==='typography-theme';}), size=props.find(function(p){return p.id==='typography-size';});
    var tokens=window.CodeWFMarkdownTypography;
    var metrics=Object.assign({},tokens.Common,tokens[theme.value],size.value==='Small'?tokens.CompactTypographyResources:{});
    page.style.fontSize=metrics.CodeWFMarkdownParagraphFontSize+'px';
    page.style.lineHeight=metrics.CodeWFMarkdownParagraphLineHeight+'px';
    page.style.gap=metrics.CodeWFMarkdownBlockSpacing+'px';
    page.querySelectorAll('h1,h2,h3,h4,h5,h6').forEach(function(heading){heading.style.fontSize=metrics['CodeWFMarkdownHeading'+heading.tagName.slice(1)+'FontSize']+'px';});
    page.querySelectorAll('pre').forEach(function(code){code.style.fontSize=metrics.CodeWFMarkdownCodeBlockFontSize+'px';code.style.lineHeight=metrics.CodeWFMarkdownCodeBlockLineHeight+'px';});
  }
  function typographyProperties(id, themes) {
    return [
      {id:'typography-theme',get label(){return samples().themeLabel;},type:'combo',options:themes,value:'Basic',apply:function(){applyTypography(id);}},
      {id:'typography-size',get label(){return samples().sizeLabel;},type:'combo',options:['Normal','Small'],value:'Normal',apply:function(){applyTypography(id);}}
    ];
  }
  // Browser rendering covers the elements in the shared examples; the native page runs Markdig.
  function renderSample(source) {
    var lines = source.replace(/\r\n/g, '\n').split('\n'), output = [], fence = false, code = [], list = false, table = false;
    function inline(value) { return esc(value).replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>').replace(/\*([^*]+)\*/g, '<em>$1</em>').replace(/\[([^\]]+)\]\((https?:\/\/[^)]+)\)/g, '<a href="$2">$1</a>'); }
    lines.forEach(function(line, index) {
      if (line.startsWith('```')) { if (fence) { output.push('<pre>'+esc(code.join('\n'))+'</pre>'); code=[]; } fence=!fence; return; }
      if (fence) { code.push(line); return; }
      if (!line.startsWith('- ') && list) { output.push('</ul>'); list=false; }
      if (!line.startsWith('|') && table) { output.push('</tbody></table>'); table=false; }
      var heading = line.match(/^(#{1,6}) (.+)/);
      if (heading) { var level=heading[1].length; output.push('<h'+level+'>'+inline(heading[2])+'</h'+level+'>'); }
      else if (line.startsWith('- ')) {
        if (!list) { output.push('<ul>'); list=true; }
        var task=line.match(/^- \[([ xX])\] (.*)/);
        output.push('<li'+(task?' class="markdown-task"':'')+'>'+(task?'<label><input type="checkbox" data-task-line="'+index+'" '+(task[1].trim()?'checked':'')+'> '+inline(task[2])+'</label>':inline(line.slice(2)))+'</li>');
      } else if (line.startsWith('> ')) output.push('<blockquote>'+inline(line.slice(2))+'</blockquote>');
      else if (line.startsWith('|') && !line.includes('---')) {
        var header=!table;
        if(header){output.push('<table><thead>');table=true;}
        output.push('<tr>'+line.split('|').slice(1,-1).map(function(cell){var tag=header?'th':'td';return '<'+tag+'>'+inline(cell.trim())+'</'+tag+'>';}).join('')+'</tr>');
        if(header)output.push('</thead><tbody>');
      }
      else if (line.trim() && !line.startsWith('|')) output.push('<p>'+inline(line)+'</p>');
    });
    if(list)output.push('</ul>');
    if(table)output.push('</tbody></table>');
    return output.join('');
  }
  register('md-viewer', {props:typographyProperties('md-viewer',MD_THEMES),xaml:'<codewf:MarkdownViewer Markdown="{Binding AppliedMarkdown}"\n  TypographyTheme="{Binding Theme}" TypographySize="{Binding Size}" />', render:function(el) {
    var source=samples().viewer;
    el.classList.add('catalog-markdown-page');
    el.innerHTML='<details class="catalog-markdown-input"><summary>'+esc(text('Input'))+'</summary><textarea class="catalog-input"></textarea><div class="row">'+['apply','append','reset'].map(function(action){return '<button class="btn" data-markdown-action="'+action+'">'+esc(samples()[action])+'</button>';}).join('')+'</div></details><div class="catalog-markdown-basic"></div>';
    var input=el.querySelector('textarea'), viewer=el.querySelector('.catalog-markdown-basic'); input.value=source;
    function paint(){
      viewer.innerHTML=renderSample(source);
      applyTypography('md-viewer');
      viewer.querySelectorAll('[data-task-line]').forEach(function(task){task.onchange=function(){var lines=source.replace(/\r\n/g,'\n').split('\n');lines[task.dataset.taskLine]=lines[task.dataset.taskLine].replace(/\[[ xX]\]/,task.checked?'[x]':'[ ]');source=lines.join('\n');input.value=source;markDirty('md-viewer');};});
    }
    el.querySelectorAll('[data-markdown-action]').forEach(function(button){button.onclick=function(){var action=button.dataset.markdownAction;source=action==='reset'?samples().viewer:action==='append'?source+'\n\n'+text('LiveParagraph'):input.value;input.value=source;paint();};});
    paint();
  }});
  register('md-lite', {props:typographyProperties('md-lite',['Basic','Simple','GeekBlack','WeChatFormat']),xaml:'<codewf:MarkdownViewer Markdown="{Binding SampleMarkdown}" />', render:function(el) {el.innerHTML='<div class="catalog-markdown-basic">'+renderSample(samples().lite)+'</div>';applyTypography('md-lite');}});
  var originalEditorRender = PROTO['md-editor'].render;
  PROTO['md-editor'].render = function(el) {
    el.innerHTML = originalEditorRender(el);
    var input = el.querySelector('#edTa');
    if (input) { input.value = samples().editor; input.style.fontSize = '15px'; input.style.height = '300px'; }
  };
  register('status-card',{xaml:'<codewf:StatusCard Width="180" Height="80" Kind="Info" TopText="INFO"\n  BottomText="{codewf:I18n Demo.Catalog.StatusSampleInfo}" />',render:function(el){
    var levels=['Debug','Info','Warn','Error','Fatal'];
    el.innerHTML='<div class="demo"><h4>StatusCard</h4><div class="row catalog-status-row">'+levels.map(function(level){return '<div class="catalog-status card" data-level="'+level+'"><strong>'+level.toUpperCase()+'</strong><span>'+esc(text('StatusSample'+level))+'</span></div>';}).join('')+'</div></div><div class="demo"><h4>Kind / IconWidth</h4><select>'+levels.map(function(l){return '<option'+(l==='Info'?' selected':'')+'>'+l+'</option>';}).join('')+'</select><div class="catalog-status card catalog-driven" data-level="Info"><strong>DRIVEN</strong><span>'+esc(text('StatusDriven'))+'</span></div></div>';
    el.querySelector('select').onchange=function(e){el.querySelector('.catalog-driven').dataset.level=e.target.value;};
  }});
  register('treegrid', {cs:'var source = new FlatTreeDataGridSource<Row>(rows);\ntreeDataGrid.EnableDefaults(source);',render:function(el){
    var rows=[10,2,1,20,3,11], direction=0, selected=new Set();
    el.innerHTML='<div class="demo"><p>'+esc(text('TreeHints'))+'</p><table class="catalog-grid" tabindex="0"><thead><tr><th>Name ↕</th><th>Value</th><th>Description</th></tr></thead><tbody></tbody></table><p class="catalog-selection"></p></div>';
    function paint(){
      el.querySelector('tbody').innerHTML=rows.map(function(n){return '<tr data-row="'+n+'" class="'+(selected.has(n)?'selected':'')+'"><td>item'+n+'</td><td>'+n+'</td><td><span title="'+esc(text('TreeLongText'))+'">'+esc(text('TreeLongText'))+'</span></td></tr>';}).join('');
      el.querySelectorAll('[data-row]').forEach(function(row){row.onclick=function(e){var n=Number(row.dataset.row);if(!e.ctrlKey)selected.clear();if(selected.has(n))selected.delete(n);else selected.add(n);paint();};});
      el.querySelector('.catalog-selection').textContent=text('TreeSelection').replace('{0}',selected.size).replace('{1}',rows.length);
    }
    el.querySelector('th').onclick=function(){direction=(direction+1)%3;rows=direction?[10,2,1,20,3,11].sort(function(a,b){return direction===1?a-b:b-a;}):[10,2,1,20,3,11];paint();};
    el.querySelector('table').onkeydown=function(e){if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='a'){e.preventDefault();rows.forEach(function(n){selected.add(n);});paint();}};
    paint();
  }});
  register('expansion',{xaml:'<codewf:ContentExpansionAnimator IsExpanded="{Binding IsExpanded}"\n  Orientation="Horizontal" Duration="{Binding Duration}" Animate="{Binding Animate}"\n  ExpandedSize="{Binding ExpandedSize}" />',render:function(el){
    el.innerHTML='<div class="demo"><p>'+esc(text('ExpansionHint'))+'</p><div class="row"><button class="btn pri" data-toggle>'+esc(text('ExpansionToggle'))+'</button><label><input type="checkbox" checked data-animate> '+esc(text('ExpansionAnimate'))+'</label></div><p>Duration (ms) <input type="range" min="0" max="1000" value="300" data-duration></p><p>ExpandedSize <input type="range" min="100" max="300" value="200" data-size></p></div><div class="demo"><h4>'+esc(text('ExpansionHorizontal'))+'</h4><div class="catalog-expand horizontal"><div>'+esc(text('ExpansionContent'))+'</div></div></div><div class="demo"><h4>'+esc(text('ExpansionVertical'))+'</h4><div class="catalog-expand vertical"><div>'+esc(text('ExpansionContent'))+'</div></div></div>';
    var expanded=true;
    function update(){el.querySelectorAll('.catalog-expand').forEach(function(panel){panel.style.transitionDuration=(el.querySelector('[data-animate]').checked?el.querySelector('[data-duration]').value:0)+'ms';panel.style[panel.classList.contains('horizontal')?'width':'height']=(expanded?el.querySelector('[data-size]').value:0)+'px';panel.style.opacity=expanded?1:0;});}
    el.querySelector('[data-toggle]').onclick=function(){expanded=!expanded;update();};
    el.querySelectorAll('input').forEach(function(input){input.oninput=update;});update();
  }});
  register('md-live',{xaml:'<codewf:MarkdownLiveEditorView Markdown="{Binding Doc}" />',cs:'liveEditor.FocusBlock(0);\nawait liveEditor.ExecuteAsync(MarkdownEditorAction.Table);',render:function(el){
    var blocks=samples().live.replace(/\r\n/g,'\n').split(/\n\n+/), active=-1;
    el.innerHTML='<div class="demo"><p>'+esc(text('LiveHint'))+'</p><div class="row"><button class="btn" data-insert>'+esc(text('LiveInsert'))+'</button><button class="btn" data-focus>'+esc(text('LiveFocus'))+'</button><button class="btn" data-table>'+esc(text('LiveTable'))+'</button></div><div class="catalog-live mdr"></div></div>';
    function renderBlock(s){
      return renderSample(s);
    }
    function paint(focus){
      el.querySelector('.catalog-live').innerHTML=blocks.map(function(s,i){return '<div class="catalog-block" tabindex="0" data-block="'+i+'">'+(i===active?'<textarea>'+esc(s)+'</textarea>':renderBlock(s))+'</div>';}).join('');
      el.querySelectorAll('[data-block]').forEach(function(block){
        var i=Number(block.dataset.block), input=block.querySelector('textarea');
        if(input){input.oninput=function(){blocks[i]=input.value;markDirty('md-live');};input.onblur=function(){active=-1;paint();};if(focus)input.focus();}
        else {block.onclick=function(){active=i;paint(true);};block.onkeydown=function(e){if(e.key==='Enter'){active=i;paint(true);}};}
      });
    }
    el.querySelector('[data-focus]').onclick=function(){active=0;paint(true);};
    el.querySelector('[data-insert]').onclick=function(){blocks.push(text('LiveParagraph'));active=blocks.length-1;paint(true);};
    el.querySelector('[data-table]').onclick=function(){blocks.push('| Name | Value |\n| --- | --- |\n| CodeWF | 42 |');active=blocks.length-1;paint(true);};
    paint();
  }});
  var originalPropertyGrid = renderPGrid;
  renderPGrid = function(id) {
    originalPropertyGrid(id);
    if(id!=='md-viewer' && id!=='md-lite')return;
    var panel=$('pGrid');
    if($('pgCnt'))$('pgCnt').textContent='('+PROTO[id].props.length+')';
    var note=document.createElement('p');note.className='hint';note.textContent=text('Preview');panel.appendChild(note);
  };
  if(ACTIVE_DOC) renderDoc(ACTIVE_DOC);
})();

.property-row-handle{position:absolute;z-index:5;left:0;right:0;bottom:-3px;height:7px;cursor:row-resize;touch-action:none}
.property-column-handle:hover,.property-column-handle:focus-visible{background:linear-gradient(90deg,transparent 3px,var(--pri) 3px,var(--pri) 4px,transparent 4px);outline:none}
.property-row-handle:hover,.property-row-handle:focus-visible{background:linear-gradient(transparent 3px,var(--pri) 3px,var(--pri) 4px,transparent 4px);outline:none}
select,select option{ text-align:left;text-align-last:left }

</style>
<script>
/* 属性表格交互；图标使用 Semi.Avalonia 的 MIT 图标资源。 */
"use strict";
(function () {
  var states = {}, panel = document.getElementById("pGrid"), original = renderPGrid;
  var toolbar = document.createElement("div");
  toolbar.id = "propertyToolbar";
  toolbar.className = "property-toolbar";
  toolbar.innerHTML = '<div class="property-modes"><button type="button" data-mode="categorized"></button><button type="button" data-mode="alphabetical"></button></div><input type="search" class="property-search">';
  panel.before(toolbar);
  // SemiIconListView / SemiIconSort，来源：irihitech/Semi.Avalonia（MIT）。
  var paths = {
    categorized: "M2 4c0-1.1.9-2 2-2h16a2 2 0 0 1 2 2v1a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V4Z M2 11.5c0-1.1.9-2 2-2h16a2 2 0 0 1 2 2v1a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2v-1Z M2 19c0-1.1.9-2 2-2h16a2 2 0 0 1 2 2v1a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2v-1Z",
    alphabetical: "M6.45 8.34l4.8-6.48a1 1 0 0 1 1.5 0l4.8 6.48A1 1 0 0 1 16.8 10H7.2a1 1 0 0 1-.75-1.66Z M17.55 15.66l-4.8 5.48a1 1 0 0 1-1.5 0l-4.8-5.48A1 1 0 0 1 7.2 14h9.6a1 1 0 0 1 .75 1.66Z"
  };
  toolbar.querySelectorAll("button").forEach(function (button) {
    button.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="' + paths[button.dataset.mode] + '"></path></svg>';
  });
  function drag(handle, axis, apply) {
    handle.onpointerdown = function (event) {
      if (event.button !== 0) return;
      event.preventDefault(); event.stopPropagation();
      var start = axis === "x" ? event.clientX : event.clientY;
      handle.setPointerCapture(event.pointerId);
      var update = apply();
      handle.onpointermove = function (move) { update((axis === "x" ? move.clientX : move.clientY) - start); };
      handle.onpointerup = handle.onpointercancel = function (end) {
        handle.onpointermove = null;
        if (handle.hasPointerCapture(end.pointerId)) handle.releasePointerCapture(end.pointerId);
      };
      handle.onlostpointercapture = function () { handle.onpointermove = null; };
    };
  }
  renderPGrid = function (id) {
    original(id);
    var state = states[id] || (states[id] = { width:118, heights:{}, mode:"categorized", query:"" });
    var english = LANG === "en-US", nodes = Array.from(panel.children), rows = nodes.filter(node => node.matches(".rw"));
    var search = toolbar.querySelector("input");
    search.placeholder = english ? "Search properties" : "搜索属性";
    search.setAttribute("aria-label", search.placeholder); search.value = state.query;
    function setWidth(value) {
      state.width = Math.max(60, Math.min(value, panel.clientWidth - 70));
      panel.style.setProperty("--property-name-width", state.width + "px");
    }
    setWidth(state.width);
    function applyView() {
      nodes.forEach(node => panel.appendChild(node));
      if (state.mode === "alphabetical") rows.slice().sort((a,b) => a.querySelector("label,.nm").textContent.localeCompare(b.querySelector("label,.nm").textContent, LANG)).forEach(row => panel.appendChild(row));
      rows.forEach(function(row) { row.hidden = !row.textContent.toLocaleLowerCase(LANG).includes(state.query.toLocaleLowerCase(LANG)); });
      nodes.filter(node => node.matches(".cat")).forEach(function(category) {
        var index = nodes.indexOf(category), end = nodes.findIndex((node,i) => i > index && node.matches(".cat"));
        category.hidden = state.mode === "alphabetical" || !nodes.slice(index + 1, end < 0 ? undefined : end).some(node => node.matches(".rw") && !node.hidden);
      });
      toolbar.querySelectorAll("button").forEach(button => button.setAttribute("aria-pressed", String(button.dataset.mode === state.mode)));
    }
    toolbar.querySelectorAll("button").forEach(function(button) {
      button.title = button.dataset.mode === "categorized" ? (english ? "Categorized" : "分类视图") : (english ? "Alphabetical" : "按字母排序");
      button.setAttribute("aria-label", button.title);
      button.onclick = function () { state.mode = button.dataset.mode; applyView(); };
    });
    search.oninput = function () { state.query = search.value; applyView(); };
    rows.forEach(function(row, index) {
      var key = row.querySelector("[data-id]")?.dataset.id || String(index);
      row.dataset.propertyKey = key;
      if (state.heights[key]) row.style.height = state.heights[key] + "px";
      var column = document.createElement("div"), line = document.createElement("div");
      column.className = "property-column-handle"; line.className = "property-row-handle";
      [column,line].forEach(function(handle) { handle.tabIndex = 0; handle.setAttribute("role", "separator"); });
      column.setAttribute("aria-orientation", "vertical"); line.setAttribute("aria-orientation", "horizontal");
      column.setAttribute("aria-label", english ? "Resize property columns" : "调整属性列宽");
      line.setAttribute("aria-label", english ? "Resize property row" : "调整属性行高");
      row.append(column,line);
      drag(column, "x", function() { var start = state.width; return delta => setWidth(start + delta); });
      function setHeight(height) { state.heights[key] = Math.max(row.querySelector("textarea") ? 74 : 31, Math.min(240, height)); row.style.height = state.heights[key] + "px"; }
      drag(line, "y", function() { var start = row.getBoundingClientRect().height; return delta => setHeight(start + delta); });
      line.ondblclick = function() { delete state.heights[key]; row.style.height = ""; };
      column.onkeydown = function(event) { if (["ArrowLeft","ArrowRight"].includes(event.key)) { event.preventDefault(); setWidth(state.width + (event.key === "ArrowLeft" ? -8 : 8)); } };
      line.onkeydown = function(event) { if (["ArrowUp","ArrowDown"].includes(event.key)) { event.preventDefault(); setHeight(row.getBoundingClientRect().height + (event.key === "ArrowUp" ? -4 : 4)); } };
    });
    applyView();
  };
  renderPGrid(ACTIVE_DOC);
})();

</script>
</body>
</html>
