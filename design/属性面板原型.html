<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark" data-palette="indigo">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>属性面板原型 · PropertyGrid</title>
<style>
  :root[data-theme="dark"] {
    --bg: #1f1f1f;
    --bg-toolbar: #232323;
    --bg-group: #282829;
    --bg-desc: #1a1a1b;
    --bg-editor: #2a2a2b;
    --bg-editor-hover: #303032;
    --bg-hover: rgba(255,255,255,.045);
    --text: #d4d4d4;
    --text-strong: #f0f0f0;
    --text-sec: #9a9a9a;
    --border: #333336;
    --border-soft: #2b2b2e;
    --accent: #0f6fdf;
    --accent-text: var(--on-primary, #ffffff);
    --accent-soft: rgba(15,111,223,.16);
    --mark: #6b5308;
    --menu-bg: #2b2b2d;
    --shadow: 0 6px 20px rgba(0,0,0,.45);
  }
  :root[data-theme="light"] {
    --bg: #ffffff;
    --bg-toolbar: #f7f8fa;
    --bg-group: #f2f3f5;
    --bg-desc: #fafafb;
    --bg-editor: #ffffff;
    --bg-editor-hover: #f4f5f7;
    --bg-hover: #f4f6f8;
    --text: #1d2129;
    --text-strong: #0f1114;
    --text-sec: #6b7075;
    --border: #e2e4e8;
    --border-soft: #edeef1;
    --accent: #1667d9;
    --accent-text: var(--on-primary, #ffffff);
    --accent-soft: rgba(22,103,217,.10);
    --mark: #ffe9a8;
    --menu-bg: #ffffff;
    --shadow: 0 6px 20px rgba(30,35,45,.14);
  }

  :root { --row-h: 26px; }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: "Segoe UI", "Microsoft YaHei", "PingFang SC", sans-serif;
    font-size: 12px;
    color: var(--text);
    background: var(--bg);
    overflow: hidden;
  }

  #app { display: flex; flex-direction: column; height: 100vh; }

  /* ---------- 工具条 ---------- */
  .toolbar {
    display: flex; align-items: center; gap: 4px;
    height: 36px; padding: 0 8px;
    background: var(--bg-toolbar);
    border-bottom: 1px solid var(--border);
    position: relative; z-index: 30; flex: none;
  }
  .tbtn {
    width: 28px; height: 26px; border: none; border-radius: 4px;
    background: transparent; color: var(--text-sec);
    display: inline-flex; align-items: center; justify-content: center;
    cursor: pointer;
  }
  .tbtn:hover { background: var(--bg-hover); color: var(--text-strong); }
  .tbtn.active { background: var(--accent-soft); color: var(--accent); }
  .tbtn svg { width: 16px; height: 16px; }

  .searchbox {
    display: flex; align-items: center; gap: 6px;
    margin-left: 8px; width: 210px; height: 24px;
    padding: 0 8px; border-radius: 4px;
    border: 1px solid var(--border); background: var(--bg-editor);
    color: var(--text-sec);
  }
  .searchbox:focus-within { border-color: var(--accent); }
  .searchbox svg { width: 13px; height: 13px; flex: none; }
  .searchbox input {
    flex: 1; border: none; outline: none; background: transparent;
    color: var(--text); font-size: 12px; min-width: 0;
  }
  .searchbox input::placeholder { color: var(--text-sec); }
  .search-clear { border:none; background:none; color:var(--text-sec); cursor:pointer; display:none; font-size:13px; line-height:1; padding:2px; }
  .searchbox.has-text .search-clear { display:block; }

  .spacer { flex: 1; }

  /* ---------- 主体 ---------- */
  .grid-wrap { flex: 1; position: relative; display: flex; min-height: 0; }
  .grid { flex: 1; position: relative; overflow: auto; }
  .rows { min-width: 100%; width: max-content; }

  .row { position: relative; display: grid; grid-template-columns: var(--name-w, 148px) 1fr; align-items: stretch; }
  .row:hover .cell { background: var(--bg-hover); }

  .cell { min-height: var(--row-h); height: 100%; display: flex; align-items: center; }
  .cell.name {
    position: relative;
    padding-right: 8px;
    border-right: 1px solid var(--border-soft);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    user-select: none;
  }
  .row.selected .cell { background: var(--accent-soft); }
  .row.selected .cell.name { background: var(--accent); color: var(--accent-text); }
  .name.modified { font-weight: 700; color: var(--text-strong); }
  .row.selected .name.modified { color: var(--accent-text); }

  mark { background: var(--mark); color: inherit; border-radius: 2px; padding: 0 1px; }

  /* 折叠箭头（分组行 / 可展开属性行 / 下拉框共用）：12px 线性 chevron，统一放在行尾右侧 */
  .chev, .tw, .combo .arr {
    width: 18px; flex: none;
    display: inline-flex; align-items: center; justify-content: center;
    color: var(--text-sec); transition: transform .12s;
  }
  .chev svg, .tw svg, .combo .arr svg { width: 12px; height: 12px; }
  .tw { cursor: pointer; height: 100%; }
  .tw:hover { color: var(--text-strong); }
  .collapsed .chev, .row.collapsed .tw { transform: rotate(-90deg); }
  .nm { overflow: hidden; text-overflow: ellipsis; }
  /* 分组行：名称居左，箭头推到行尾 */
  .group-row .cell { gap: 6px; }
  .group-row .chev { margin-left: auto; margin-right: 10px; }
  /* 可展开属性行：箭头绝对定位到行尾，值列内容避让 */
  .row .tw { position: absolute; right: 4px; top: 0; bottom: 0; width: 22px; }
  .row.expandable .cell.value { padding-right: 26px; }

  /* ---------- 编辑器 ---------- */
  .cell.value { padding: 0 4px 0 6px; gap: 4px; position: relative; overflow: hidden; }

  .ed {
    width: 100%; height: calc(var(--row-h) - 4px); border: 1px solid transparent; border-radius: 3px;
    background: transparent; color: var(--text); font: inherit; outline: none;
    padding: 0 5px; min-width: 0;
  }
  .row:hover .ed { border-color: var(--border); background: var(--bg-editor); }
  .ed:focus { border-color: var(--accent); background: var(--bg-editor); }
  .ed::placeholder { color: var(--text-sec); }

  textarea.ed { height: calc(100% - 6px); min-height: 40px; padding: 4px 5px; resize: none; line-height: 1.5; }

  .ed.readonly { border-color: transparent !important; background: transparent !important; color: var(--text-sec); cursor: default; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cv-sum { flex: 1; color: var(--text-sec); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* 数字 */
  .num-wrap { display: flex; align-items: center; gap: 4px; width: 100%; }
  .num-wrap .ed { flex: 1; text-align: left; }
  .unit { color: var(--text-sec); flex: none; }
  .spin { display: flex; flex-direction: column; flex: none; }
  .spin button {
    width: 15px; height: 11px; border: none; background: transparent; color: var(--text-sec);
    cursor: pointer; font-size: 8px; line-height: 1; border-radius: 2px;
  }
  .row:hover .spin button { background: var(--bg-editor); }
  .spin button:hover { background: var(--bg-hover) !important; color: var(--text-strong); }

  /* 布尔 */
  .cb { appearance: none; width: 14px; height: 14px; border: 1px solid var(--border); border-radius: 3px; background: var(--bg-editor); cursor: pointer; position: relative; flex: none; }
  .cb:checked { background: var(--accent); border-color: var(--accent); }
  .cb:checked::after { content: ""; position: absolute; left: 4px; top: 1px; width: 3px; height: 7px; border: solid var(--accent-text, #fff); border-width: 0 1.5px 1.5px 0; transform: rotate(42deg); }

  /* 下拉 */
  .combo { display: flex; align-items: center; width: 100%; height: calc(var(--row-h) - 4px); padding: 0 4px 0 5px; border: 1px solid transparent; border-radius: 3px; cursor: pointer; gap: 4px; }
  .row:hover .combo { border-color: var(--border); background: var(--bg-editor); }
  .combo.open { border-color: var(--accent); background: var(--bg-editor); }
  .combo .cv { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .combo-menu {
    position: absolute; top: calc(var(--row-h) + 2px); left: 4px; right: 4px; z-index: 40;
    background: var(--menu-bg); border: 1px solid var(--border); border-radius: 4px;
    box-shadow: var(--shadow); padding: 3px; max-height: 180px; overflow: auto;
  }
  .combo-item { display: flex; align-items: center; gap: 6px; padding: 4px 8px; border-radius: 3px; cursor: pointer; white-space: nowrap; }
  .combo-item:hover { background: var(--bg-hover); }
  .combo-item.sel { color: var(--accent); }
  .combo-item .tick { width: 12px; flex: none; }

  /* 单选组（分段按钮） */
  .seg { display: flex; border: 1px solid var(--border); border-radius: 4px; overflow: hidden; height: calc(var(--row-h) - 6px); }
  .seg button { border: none; background: transparent; color: var(--text-sec); padding: 0 9px; cursor: pointer; font: inherit; border-right: 1px solid var(--border); }
  .seg button:last-child { border-right: none; }
  .seg button:hover { background: var(--bg-hover); color: var(--text-strong); }
  .seg button.on { background: var(--accent); color: var(--accent-text); }

  /* 滑条 */
  .pct { display: flex; align-items: center; gap: 6px; width: 100%; }
  input[type=range] { flex: 1; accent-color: var(--accent); height: 14px; }
  .pct-val { width: 34px; text-align: right; color: var(--text-sec); flex: none; }

  /* 颜色 */
  .color-ed { display: flex; align-items: center; gap: 6px; width: 100%; height: calc(var(--row-h) - 4px); }
  .swatch { width: 16px; height: 16px; border-radius: 3px; border: 1px solid var(--border); padding: 0; cursor: pointer; background: none; flex: none; }
  .swatch::-webkit-color-swatch-wrapper { padding: 1px; }
  .swatch::-webkit-color-swatch { border: none; border-radius: 2px; }
  .hex { flex: 1; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }

  /* 路径 & 按钮 */
  .path-wrap { display: flex; gap: 4px; width: 100%; }
  .path-wrap .ed { flex: 1; }
  .mini-btn {
    flex: none; height: calc(var(--row-h) - 4px); min-width: 22px; padding: 0 6px;
    border: 1px solid var(--border); border-radius: 3px; background: var(--bg-editor);
    color: var(--text-sec); cursor: pointer; font: inherit;
  }
  .mini-btn:hover { background: var(--bg-editor-hover); color: var(--text-strong); border-color: var(--accent); }
  .full-btn { width: 100%; height: calc(var(--row-h) - 4px); text-align: left; padding: 0 6px; }
  .full-btn .dots { letter-spacing: 2px; }

  /* 集合 */
  .coll { display: flex; align-items: center; width: 100%; height: calc(var(--row-h) - 4px); padding: 0 5px; border: 1px solid transparent; border-radius: 3px; cursor: pointer; gap: 6px; }
  .row:hover .coll { border-color: var(--border); background: var(--bg-editor); }
  .coll .cnt { color: var(--text-sec); flex: 1; }
  .coll .more { color: var(--text-sec); letter-spacing: 2px; }

  /* 空状态 */
  .empty { padding: 32px 0; text-align: center; color: var(--text-sec); }

  /* 列分隔拖拽区 */
  .divider-hit { position: absolute; top: 0; bottom: 0; width: 7px; margin-left: -3px; cursor: col-resize; z-index: 10; }
  body.col-drag { cursor: col-resize; user-select: none; }

  /* 行间分隔线：顶格延伸到面板最左缘，拖拽调整单行高度 */
  .row-line { position: absolute; left: 0; right: 0; bottom: -3px; height: 7px; cursor: row-resize; z-index: 6; }
  .row-line::after { content: ""; position: absolute; left: 0; right: 0; top: 3px; height: 1px; background: var(--border-soft); }
  .row-line:hover::after, .row-line.active::after { background: var(--accent); }
  body.row-drag { cursor: row-resize; user-select: none; }

  /* ---------- 描述面板 ---------- */
  .desc {
    flex: none; min-height: 64px; padding: 8px 12px;
    border-top: 1px solid var(--border); background: var(--bg-desc);
  }
  .desc-name { font-weight: 700; color: var(--text-strong); margin-bottom: 3px; }
  .desc-text { color: var(--text-sec); line-height: 1.55; max-width: 640px; }

  /* ---------- 菜单 ---------- */
  .menu {
    position: absolute; z-index: 60; min-width: 190px;
    background: var(--menu-bg); border: 1px solid var(--border); border-radius: 6px;
    box-shadow: var(--shadow); padding: 4px;
  }
  .mi { display: flex; align-items: center; gap: 8px; padding: 5px 10px; border-radius: 4px; cursor: pointer; white-space: nowrap; }
  .mi:hover { background: var(--bg-hover); }
  .mi.disabled { opacity: .4; pointer-events: none; }
  .mi .tick { width: 14px; flex: none; }
  .mi-sep { height: 1px; background: var(--border); margin: 4px 6px; }

  /* toast */
  .toast {
    position: fixed; right: 16px; bottom: 84px; z-index: 99;
    background: var(--menu-bg); border: 1px solid var(--border); color: var(--text);
    box-shadow: var(--shadow); border-radius: 6px; padding: 8px 12px;
    opacity: 0; transition: opacity .18s; pointer-events: none;
  }
  .toast.show { opacity: 1; }

  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 5px; border: 2px solid transparent; background-clip: content-box; }
  ::-webkit-scrollbar-thumb:hover { background: var(--text-sec); background-clip: content-box; }
</style>
<style>
/* Shared visual language for the two CodeWF capability studios. */
/* 颜色令牌（含 :root[data-theme=light|dark] 回退与 8 套配色，--bg/--bg2/--tx/--pri/--brand/--glow/--secondary 等）
 * 全部由 assets/palette-tokens.css 提供（generate-palette-tokens.cjs 生成，禁止手写）；本文件只留非配色静态量。 */
:root {
  --fs-body:14px; --fs-h1:22px; --fs-dsc:13px; --fs-tag:11px; --fs-code:12.5px;
  color-scheme:light;
}
body {
  /* §15 强调色唯一律：桌面底衬只留极低浓度主色晕染（≤10%），不做大面积主色块。 */
  padding:18px; background:radial-gradient(ellipse at 10% 0%,color-mix(in srgb,var(--brand) 9%,transparent),transparent 55%),radial-gradient(ellipse at 95% 95%,color-mix(in srgb,var(--secondary) 5%,transparent),transparent 55%),#080810;
  font-family:"Segoe UI Variable","Segoe UI","Microsoft YaHei",sans-serif;
}
.win { width:min(1680px,100%); min-height:0; border-radius:var(--r3,14px); border-color:color-mix(in srgb,var(--glow) 10%,var(--bd)); grid-template-columns:minmax(0,1fr); grid-template-rows:52px 42px auto 1fr 30px; box-shadow:var(--e3,0 24px 70px rgba(0,0,0,.42)),0 2px 10px rgba(0,0,0,.28); }
.win > * { min-width:0; }
.cap { height:52px; padding-left:17px; gap:11px; background:var(--bg); border-color:var(--bd2); }
.cap .logo { width:28px; height:28px; border-radius:8px; box-shadow:none; }
.cap .lg { color:var(--tx); text-shadow:none; font-size:14px; letter-spacing:.2px; }
.cap .vbadge { color:var(--tx3); background:var(--bg3); border:1px solid var(--bd2); font:10px Consolas,monospace; padding:4px 8px; }
.cap select { height:29px; font-size:11px; padding:0 7px; border-radius:6px; }
.cap .wb { height:50px; width:34px; }
.cap .notification-entry { position:relative; width:30px; height:30px; overflow:visible; }
.cap :is(#darkBtn,#langBtn,.notification-entry) svg { width:16px; height:16px; }
.notification-count { position:absolute; right:-4px; top:-3px; min-width:16px; height:16px; padding:0 3px; box-sizing:border-box; border-radius:8px; display:flex; align-items:center; justify-content:center; font:10px "Segoe UI",sans-serif; color:var(--card-error); background:var(--card-error-bg); }
.notification-count[hidden] { display:none; }

/* ═══ 外观菜单（与 Vex 原型同构）：明暗模式三选 + 界面配色网格（8 圆点色卡） ═══ */
.appearance-menu { position:relative; }
.appearance-menu summary { list-style:none; display:flex; align-items:center; gap:6px; height:50px; padding:0 10px; cursor:pointer; color:var(--tx2); font-size:11px; }
.appearance-menu summary::-webkit-details-marker { display:none; }
.appearance-menu summary:hover { background:var(--hov); color:var(--tx); }
.appearance-choices { position:absolute; right:0; top:52px; z-index:150; width:min(458px,calc(100vw - 60px)); padding:14px 16px 16px; background:var(--bg2); border:1px solid var(--bd); border-radius:var(--r2,10px); box-shadow:0 16px 44px rgba(0,0,0,.32); overflow:visible; } /* 自适应内容，禁水平/竖直滚动条；宽度保证 16px 圆点阵与"推荐"角标留 ~12px 间距 */
.appearance-choices .studio-modes { display:block; border:0; background:transparent; margin:0 0 14px; padding:0; min-width:0; }
.appearance-choices legend, .appearance-choices > strong { display:block; font-size:12px; font-weight:600; color:var(--tx); }
.appearance-choices legend { margin-bottom:10px; padding:0; }
.theme-mode-options { display:flex; flex-wrap:wrap; gap:6px; }
.theme-mode-options label { display:flex; align-items:center; gap:5px; min-height:30px; padding:3px 8px; border-radius:5px; font-size:12px; color:var(--tx2); cursor:pointer; white-space:nowrap; }
.theme-mode-options label:hover { background:var(--hov); color:var(--tx); }
.theme-mode-options label:has(input:checked) { color:var(--pri); background:var(--pri-lt); }
.theme-mode-options input { accent-color:var(--pri); width:14px; height:14px; margin:0; cursor:pointer; }
.studio-palettes { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:8px; margin-top:9px; }
.studio-palettes button { position:relative; display:flex; flex-direction:column; align-items:stretch; justify-content:flex-start; gap:7px; padding:8px; border:1px solid var(--bd); border-radius:6px; background:var(--bg); color:var(--tx); font-size:11px; text-align:left; cursor:pointer; }
.studio-palettes button:hover { background:var(--hov); border-color:var(--pri); }
.studio-palettes button[aria-pressed="true"] { border-color:var(--pri); box-shadow:0 0 0 1px var(--pri); }
.studio-palettes button::after { content:'✓'; position:absolute; right:6px; bottom:6px; color:var(--pri); visibility:hidden; font-size:12px; }
.studio-palettes button[aria-pressed="true"]::after { visibility:visible; }
.swatch-dots { display:grid; grid-template-columns:repeat(4,auto); gap:4px; padding-right:24px; justify-content:start; } /* 4×2 圆点阵靠左排；padding-right 给右上角"推荐"角标留位（≈12px） */
.swatch-dots i { width:16px; height:16px; border-radius:50%; border:1px solid var(--bd); flex:none; }
.palette-badge { position:absolute; top:6px; right:6px; z-index:1; font:600 10px/1 "Segoe UI",sans-serif; font-style:normal; padding:2px 4px; border-radius:4px; background:var(--pri); color:var(--on-primary); pointer-events:none; }
.palette-label { display:flex; min-width:0; flex-direction:column; gap:1px; padding-right:14px; }
.palette-label b { font-size:11px; font-weight:550; white-space:nowrap; }
.palette-label small { font-size:10px; line-height:1.45; color:var(--tx2); white-space:normal; }
.studio-wordmark { font:10px Consolas,monospace; color:var(--tx3); letter-spacing:2px; padding-left:10px; border-left:1px solid var(--bd); }
.rtabs { height:42px; padding:0 15px; background:var(--bg2); border-color:var(--bd2); }
.rt2 { min-width:0; flex:1; }
.rt2 .t2 { font-size:12px; letter-spacing:0; padding:0 13px; }
.rt2 .t2.on { background:var(--pri-lt); }
.rt2 .t2.on::after { left:12px; right:12px; }
.qk2 button { font-size:11px; }
.rbn { height:46px; padding:0 12px; background:var(--bg); border-color:var(--bd2); }
.cbtn { width:auto; height:32px; padding:0 9px; gap:7px; flex-direction:row; align-items:center; justify-content:flex-start; }
.grp .gname { display:none; }
.main { padding:10px; gap:10px; }
.dockrow { gap:10px; }
.panel { border-color:var(--bd2); border-radius:10px; box-shadow:none; }
.p-nav { width:206px; background:var(--bg2); }
.p-doc { flex:1; min-width:0; }
.p-props { width:236px; background:var(--bg2); }
.p-log { height:112px; }
.phd { height:34px; background:transparent; border-color:var(--bd2); font-size:11px; text-transform:uppercase; letter-spacing:.6px; }
.phd .tb button { font-size:10px; }
.tree { padding:8px; }
.tree .fnd { padding:0 0 10px; }
.tree .fnd input { height:30px; background:var(--bg); }
.tree .nd .hd { height:31px; font-size:11px; font-weight:600; }
.tree .lf { height:30px; font-size:12.5px; border-radius:6px; transition:background .18s,color .18s; }
.tree .lf.on { background:var(--pri-lt); box-shadow:inset 2px 0 var(--pri); }
.tree .nd .kids { margin-left:10px; }
.dts { height:36px; background:var(--bg2); border-color:var(--bd2); overflow-x:auto; overflow-y:hidden; }
.dts .dkb,.dt { flex:none; }
.dts .dkb button { white-space:nowrap; }
.dts .dkb button { font-size:10px; background:transparent; border-color:var(--bd2); padding:3px 6px; }
.dt { font-size:12.5px; }
.dbody { padding:25px 27px; }
.doc h1 { color:var(--tx); font-size:var(--fs-h1,22px); letter-spacing:-.5px; }
.doc .crumb { font:10px Consolas,monospace; color:var(--tx3); margin-bottom:7px; }
.doc .alias { font:11px Consolas,monospace; color:var(--pri); }
.doc .dsc { max-width:850px; margin:12px 0; line-height:1.8; }

 *   - prop 带 children 即为"可展开属性"（VS 的 ExpandableObject 语义），
 *     值列显示 summary（可由 summaryFn 根据子项动态计算）

/* 建立索引与父子引用 */
const ALL = {};
(function walkBuild(nodes, parent) {
  for (const n of nodes) {
    n.parent = parent;
    ALL[n.id] = n;
    if (n.children) walkBuild(n.children, n);
  }
})(TREE, null);

/* 可展开属性的动态摘要：由子项实时计算 */
function childOf(id) { return ALL[id]; }
ALL["p05"].summaryFn = () => {
  const c = ALL["p05"];
  return `${childOf("p05a").value}, ${childOf("p05b").value}px, ${childOf("p05c").value}${childOf("p05d").value ? " 斜体" : ""}`;
};
ALL["p06"].summaryFn = () => `${childOf("p06a").value}, ${childOf("p06b").value}`;
ALL["p07"].summaryFn = () => `${childOf("p07a").value} × ${childOf("p07b").value}`;
ALL["p09"].summaryFn = () => `${childOf("p09a").value}%, ${childOf("p09b").value}%`;
ALL["p13"].summaryFn = () => `${childOf("p13a").value} 次 / ${childOf("p13b").value}ms`;
ALL["p19"].summaryFn = () => `${ALL["p19"].children.length} 项`;
ALL["p19a"].summaryFn = () => `DN${childOf("p19ac").value} · ${childOf("p19ab").value}`;
ALL["p19b"].summaryFn = () => `DN${childOf("p19bc").value} · ${childOf("p19bb").value}`;
ALL["p19c"].summaryFn = () => `DN${childOf("p19cc").value} · ${childOf("p19cb").value}`;
// 初始化静态摘要
for (const n of Object.values(ALL)) if (n.summaryFn && n.type === "summary") n.summary = n.summaryFn();
ALL["p19"].value = "3 项";

const state = {
  mode: "categorized",        // categorized | alphabetical
  theme: "dark",
  query: "",
  selectedId: "p01",
  collapsed: new Set(),       // 可折叠节点 id（分组 + 可展开属性）
  descVisible: true,
  nameW: 148,
  rowHs: new Map(),           // 单行高度覆盖：节点 id → px（拖行间横线设置）
};

/* ---------------- 工具 ---------------- */
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const isModified = (n) => n.kind === "prop" && n.def !== undefined && n.def !== null && String(n.value) !== String(n.def);
function modifiedDeep(n) {
  if (isModified(n)) return true;
  return (n.children || []).some(modifiedDeep);
}
const matchQuery = (n) => !state.query ||
  n.name.toLowerCase().includes(state.query) ||
  (n.desc || "").toLowerCase().includes(state.query);
const hl = (s) => { // 搜索命中高亮
  if (!state.query) return esc(s);
  const i = s.toLowerCase().indexOf(state.query);
  if (i < 0) return esc(s);
  return esc(s.slice(0,i)) + "<mark>" + esc(s.slice(i, i+state.query.length)) + "</mark>" + esc(s.slice(i+state.query.length));
};
/* 首列标签：基础左边距 ≥3mm（取 12px），层级之间缩进 1 个字（12px） */
const indentX = (depth) => 12 + depth * 12;

let toastTimer = null;
function toast(msg) {
  const t = $("toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 1600);
}
function setPropValue(p, v) {
  p.value = v;
  // 真实控件在此触发 Preview/Commit 事件（GraphKit 侧换算为可撤销命令）
  // 沿祖先链刷新：加粗状态 + 动态摘要
  let node = p;
  while (node) {
    if (node.summaryFn) node.summary = node.summaryFn(); // 摘要回写模型，重渲染后不丢失
    const row = document.querySelector('[data-row="' + node.id + '"]');
    if (row) {
      const nm = row.querySelector(".name");
      if (nm && node.kind === "prop") nm.classList.toggle("modified", modifiedDeep(node));
      const sum = row.querySelector("[data-sum]");
      if (sum && node.summaryFn) sum.textContent = node.summary;
    }
    node = node.parent;
  }
}
function resetSubtree(n) {
  if (n.kind !== "prop") return;
  n.value = n.def !== null ? n.def : n.value;
  (n.children || []).forEach(resetSubtree);
}
function toggleNode(id) {
  state.collapsed.has(id) ? state.collapsed.delete(id) : state.collapsed.add(id);
  render();
}
function closeMenus() {
  $("moreMenu").style.display = "none";
  $("ctxMenu").style.display = "none";
  document.querySelectorAll(".combo-menu").forEach(m => m.remove());
  document.querySelectorAll(".combo.open").forEach(c => c.classList.remove("open"));
}

/* ---------------- 编辑器构建 ---------------- */
function edText(p) {
  const el = document.createElement("input");
  el.className = "ed"; el.value = p.value ?? ""; el.spellcheck = false;
  el.title = p.value || "";
  el.addEventListener("keydown", e => { if (e.key === "Enter") el.blur(); if (e.key === "Escape") { el.value = p.value; el.blur(); } });
  el.addEventListener("change", () => setPropValue(p, el.value));
  return el;
}
function edMultiline(p) {
  const el = document.createElement("textarea");
  el.className = "ed"; el.value = p.value ?? ""; el.spellcheck = false;
  el.addEventListener("keydown", e => { if (e.key === "Escape") { el.value = p.value; el.blur(); } });
  el.addEventListener("change", () => setPropValue(p, el.value));
  return el;
}
function edReadonly(p) {
  const el = document.createElement("div");
  el.className = "ed readonly"; el.textContent = p.value ?? ""; el.title = p.value || "";
  return el;
}
function edSummary(p) {
  const el = document.createElement("div");
  el.className = "cv-sum"; el.dataset.sum = "1";
  el.textContent = p.summary || ""; el.title = p.summary || "";
  return el;
}
function edNumber(p) {
  const wrap = document.createElement("div"); wrap.className = "num-wrap";
  const el = document.createElement("input");
  el.className = "ed"; el.type = "text"; el.value = p.value; el.spellcheck = false;
  const clamp = v => Math.min(p.max, Math.max(p.min, Math.round(v * 1000) / 1000));
  const commit = () => {
    const n = parseFloat(el.value);
    if (isNaN(n)) { el.value = p.value; return; }
    const v = clamp(n); el.value = v; setPropValue(p, v);
  };
  el.addEventListener("keydown", e => {
    if (e.key === "Enter") { commit(); el.blur(); }
    if (e.key === "Escape") { el.value = p.value; el.blur(); }
    if (e.key === "ArrowUp") { el.value = clamp((parseFloat(el.value)||0) + p.step); commit(); e.preventDefault(); }
    if (e.key === "ArrowDown") { el.value = clamp((parseFloat(el.value)||0) - p.step); commit(); e.preventDefault(); }
  });
  el.addEventListener("blur", commit);
  wrap.appendChild(el);
  if (p.unit) { const u = document.createElement("span"); u.className = "unit"; u.textContent = p.unit; wrap.appendChild(u); }
  const spin = document.createElement("div"); spin.className = "spin";
  const up = document.createElement("button"); up.textContent = "▲"; up.title = "增加";
  const dn = document.createElement("button"); dn.textContent = "▼"; dn.title = "减少";
  up.addEventListener("click", () => { el.value = clamp((parseFloat(el.value)||0) + p.step); commit(); });
  dn.addEventListener("click", () => { el.value = clamp((parseFloat(el.value)||0) - p.step); commit(); });
  spin.append(up, dn); wrap.appendChild(spin);
  return wrap;
}
function edBoolean(p) {
  const el = document.createElement("input");
  el.className = "cb"; el.type = "checkbox"; el.checked = !!p.value;
  el.addEventListener("change", () => {
    setPropValue(p, el.checked);
    if ((p.children || []).length || Object.values(ALL).some(n => n.visibleWhen)) render(); // 动态可见性依赖
  });
  return el;
}
function edCombo(p, cell) {
  const el = document.createElement("div"); el.className = "combo";
  el.innerHTML = '<span class="cv"></span><span class="arr">' + CHEVRON + '</span>';
  const cv = el.querySelector(".cv");
  const paint = () => { cv.textContent = p.value; };
  paint();
  el.addEventListener("click", (e) => {
    e.stopPropagation();
    const wasOpen = el.classList.contains("open");
    closeMenus();
    if (wasOpen) return;
    el.classList.add("open");
    const menu = document.createElement("div"); menu.className = "combo-menu";
    p.options.forEach(op => {
      const it = document.createElement("div");
      it.className = "combo-item" + (op === p.value ? " sel" : "");
      it.innerHTML = '<span class="tick">' + (op === p.value ? "✓" : "") + '</span>' + esc(op);
      it.addEventListener("click", () => { setPropValue(p, op); paint(); closeMenus(); });
      menu.appendChild(it);
    });
    cell.appendChild(menu);
  });
  return el;
}
function edRadio(p) {
  const seg = document.createElement("div"); seg.className = "seg";
  p.options.forEach(op => {
    const b = document.createElement("button");
    b.type = "button"; b.textContent = op;
    if (op === p.value) b.classList.add("on");
    b.addEventListener("click", () => {
      seg.querySelectorAll("button").forEach(x => x.classList.remove("on"));
      b.classList.add("on");
      setPropValue(p, op);
    });
    seg.appendChild(b);
  });
  return seg;
}
function edPercent(p) {
  const wrap = document.createElement("div"); wrap.className = "pct";
  const r = document.createElement("input");
  r.type = "range"; r.min = 0; r.max = 100; r.step = 1; r.value = p.value;
  const lbl = document.createElement("span"); lbl.className = "pct-val"; lbl.textContent = p.value + "%";
  r.addEventListener("input", () => { lbl.textContent = r.value + "%"; });           // 预览
  r.addEventListener("change", () => setPropValue(p, parseInt(r.value, 10)));        // 提交
  wrap.append(r, lbl);
  return wrap;
}
function edColor(p) {
  const wrap = document.createElement("div"); wrap.className = "color-ed";
  const sw = document.createElement("input"); sw.className = "swatch"; sw.type = "color"; sw.value = (p.value || "#000000").slice(0,7);
  const hex = document.createElement("span"); hex.className = "hex"; hex.textContent = p.value;
  sw.addEventListener("input", () => { hex.textContent = sw.value; });                // 预览
  sw.addEventListener("change", () => setPropValue(p, sw.value));                     // 提交
  wrap.append(sw, hex);
  return wrap;
}
function edPath(p) {
  const wrap = document.createElement("div"); wrap.className = "path-wrap";
  const el = document.createElement("input");
  el.className = "ed"; el.value = p.value ?? ""; el.placeholder = "(未设置)"; el.spellcheck = false;
  el.addEventListener("keydown", e => { if (e.key === "Enter") el.blur(); if (e.key === "Escape") { el.value = p.value; el.blur(); } });
  el.addEventListener("change", () => setPropValue(p, el.value));
  const btn = document.createElement("button"); btn.className = "mini-btn"; btn.textContent = "…"; btn.title = "浏览…";
  btn.addEventListener("click", () => toast("原型：此处打开文件/目录选择对话框"));
  wrap.append(el, btn);
  return wrap;
}
function edPathFull(p) {
  const btn = document.createElement("button");
  btn.className = "mini-btn full-btn";
  btn.innerHTML = '<span class="dots">…</span>';
  btn.title = "浏览…";
  btn.addEventListener("click", () => toast("原型：此处打开文件选择对话框"));
  return btn;
}
function edCollection(p) {
  const el = document.createElement("div"); el.className = "coll";
  el.innerHTML = '<span class="cnt">' + esc(p.summaryFn ? p.summaryFn() : (p.value || "")) + '</span><span class="more">…</span>';
  el.addEventListener("click", () => toast("原型：此处打开集合编辑器"));
  return el;
}

function buildEditor(p, cell) {
  switch (p.type) {
    case "text":      return edText(p);
    case "multiline": return edMultiline(p);
    case "readonly":  return edReadonly(p);
    case "summary":   return edSummary(p);
    case "number":    return edNumber(p);
    case "boolean":   return edBoolean(p);
    case "combo":     return edCombo(p, cell);
    case "radio":     return edRadio(p);
    case "percent":   return edPercent(p);
    case "color":     return edColor(p);
    case "path":      return edPath(p);
    case "pathfull":  return edPathFull(p);
    case "collection":return edCollection(p);
    default:          return edText(p);
  }
}

/* ---------------- 渲染 ---------------- */
let FLAT = false; // 字母模式：整表平铺，无分组无层级

function makeNameCell(n, depth) {
  const c = document.createElement("div");
  c.className = "cell name";
  c.style.paddingLeft = indentX(depth) + "px";
  const nm = document.createElement("span");
  nm.className = "nm";
  nm.innerHTML = hl(n.name);
  c.appendChild(nm);
  if (n.kind === "prop" && modifiedDeep(n)) c.classList.add("modified");
  return c;
}
function makeValueCell(p) {
  const c = document.createElement("div");
  c.className = "cell value";
  c.appendChild(buildEditor(p, c));
  return c;
}
function makePropRow(p, depth) {
  p._depth = depth; // 供重置后重建行使用
  const hasKids = (p.children || []).length > 0;
  const expandable = hasKids && !FLAT;
  const row = document.createElement("div");
  row.className = "row" + (expandable && state.collapsed.has(p.id) && !state.query ? " collapsed" : "") +
                  (p.id === state.selectedId ? " selected" : "");
  row.dataset.row = p.id;
  row.appendChild(makeNameCell(p, depth));
  row.appendChild(makeValueCell(p));
  row.addEventListener("click", () => selectProp(p));
  if (expandable) { // 折叠箭头放在行尾右侧
    const tw = document.createElement("span");
    tw.className = "tw"; tw.innerHTML = CHEVRON; tw.title = "展开/折叠";
    tw.addEventListener("click", (e) => { e.stopPropagation(); toggleNode(p.id); });
    row.appendChild(tw);
    row.querySelector(".name").addEventListener("dblclick", (e) => { e.stopPropagation(); toggleNode(p.id); });
  }
  row.addEventListener("contextmenu", (e) => {
    e.preventDefault();
    selectProp(p);
    showCtxMenu(e, p);
  });
  applyStoredRowHeight(row, p);
  attachRowLine(row, p);
  return row;
}
function makeGroupRow(n, depth) {
  const row = document.createElement("div");
  row.className = "row group-row" + (state.collapsed.has(n.id) && !state.query ? " collapsed" : "");
  row.dataset.group = n.id;
  row.style.gridTemplateColumns = "1fr";
  const c = document.createElement("div");
  c.className = "cell";
  c.style.paddingLeft = (12 + depth * 12) + "px";
  c.insertAdjacentHTML("beforeend", '<span class="nm">' + hl(n.name) + '</span><span class="chev">' + CHEVRON + '</span>');
  row.appendChild(c);
  row.addEventListener("click", () => { if (!state.query) toggleNode(n.id); });
  applyStoredRowHeight(row, n);
  attachRowLine(row, n);
  return row;
}

/* 过滤：搜索时保留命中节点及其祖先链；命中节点子树全展 */
function filterTree(nodes) {
  const out = [];
  for (const n of nodes) {
    if (n.kind === "group") {
      const kids = filterTree(n.children || []);
      if (kids.length) out.push(Object.assign({}, n, { children: kids }));
    } else if (n.children && n.children.length) {
      if (matchQuery(n)) { out.push(n); continue; }
      const kids = filterTree(n.children);
      if (kids.length) out.push(Object.assign({}, n, { children: kids }));
    } else if (matchQuery(n)) {
      out.push(n);
    }
  }
  return out;
}

function renderNodes(nodes, depth, host, flat) {
  for (const n of nodes) {
    if (n.kind === "group") {
      if (flat) continue; // 平铺模式不渲染分组
      const collapsed = !state.query && state.collapsed.has(n.id);
      host.appendChild(makeGroupRow(n, depth));
      if (!collapsed) renderNodes(n.children, depth + 1, host, flat);
    } else {
      if (n.visibleWhen && !n.visibleWhen()) continue;   // 动态可见性
      host.appendChild(makePropRow(n, depth));
      if (!flat && (n.children || []).length) {
        const collapsed = !state.query && state.collapsed.has(n.id);
        if (!collapsed) renderNodes(n.children, depth + 1, host, flat);
      }
    }
  }
}

/* 字母模式：拆掉分组、摊平所有层级，全部属性按名称统一排序（VS 语义） */
function flattenAlpha(nodes, out) {
  for (const n of nodes) {
    if (n.kind === "group") flattenAlpha(n.children || [], out);
    else {
      out.push(n);
      if (n.children && n.children.length) flattenAlpha(n.children, out);
    }
  }
  return out;
}

function render() {
  const host = $("rows");
  host.innerHTML = "";
  FLAT = state.mode === "alphabetical";
  const tree = state.query ? filterTree(TREE) : TREE;

  if (!FLAT) {
    renderNodes(tree, 0, host, false);
  } else {
    const flat = flattenAlpha(tree, []);
    flat.sort((a, b) => a.name.localeCompare(b.name, "zh-Hans-CN"));
    renderNodes(flat, 0, host, true);
  }

  if (!host.querySelector(".row")) {
    host.innerHTML = '<div class="empty">' +
      (state.query ? "无匹配属性" : "所有分组已折叠") + "</div>";
  }
}

function selectProp(p) {
  state.selectedId = p.id;
  document.querySelectorAll(".row.selected").forEach(r => r.classList.remove("selected"));
  const row = document.querySelector('[data-row="' + p.id + '"]');
  if (row) row.classList.add("selected");
  $("descName").textContent = p.name;
  $("descText").textContent = p.desc || "（无说明）";
}

function showCtxMenu(e, p) {
  const menu = $("ctxMenu");
  const item = $("miReset");
  item.classList.toggle("disabled", !modifiedDeep(p));
  const ex = $("miExpandNode");
  ex.style.display = (p.children && p.children.length) ? "" : "none";
  menu.style.display = "block";
  const gw = $("grid").getBoundingClientRect();
  let x = e.clientX - gw.left + 2, y = e.clientY - gw.top + 2;
  x = Math.min(x, gw.width - 180); y = Math.min(y, gw.height - 70);
  menu.style.left = x + "px"; menu.style.top = y + "px";
  menu.style.position = "absolute";
  $("grid").appendChild(menu);
  item.onclick = () => {
    resetSubtree(p);
    render(); closeMenus();
    toast("已重置：" + p.name + (p.children && p.children.length ? "（含子项）" : ""));
  };
  ex.onclick = () => { toggleNode(p.id); closeMenus(); };
}

/* ---------------- 工具条事件 ---------------- */
function setMode(m) {
  state.mode = m;
  $("btnCat").classList.toggle("active", m === "categorized");
  $("btnAlpha").classList.toggle("active", m === "alphabetical");
  render();
}
$("btnCat").addEventListener("click", () => setMode("categorized"));
$("btnAlpha").addEventListener("click", () => setMode("alphabetical"));

const searchEl = $("search");
searchEl.addEventListener("input", () => {
  state.query = searchEl.value.trim().toLowerCase();
  $("searchBox").classList.toggle("has-text", !!searchEl.value);
  render();
});
$("searchClear").addEventListener("click", () => {
  searchEl.value = ""; state.query = "";
  $("searchBox").classList.remove("has-text");
  render(); searchEl.focus();
});

$("btnMore").addEventListener("click", (e) => {
  e.stopPropagation();
  const m = $("moreMenu");
  const visible = m.style.display !== "none";
  closeMenus();
  m.style.display = visible ? "none" : "block";
  $("descTick").textContent = state.descVisible ? "✓" : "";
});
$("miExpand").addEventListener("click", () => { state.collapsed.clear(); render(); closeMenus(); });
$("miCollapse").addEventListener("click", () => {
  Object.values(ALL).forEach(n => {
    if (n.kind === "group" || (n.children && n.children.length)) state.collapsed.add(n.id);
  });
  render(); closeMenus();
});
$("miDesc").addEventListener("click", () => {
  state.descVisible = !state.descVisible;
  $("descPane").style.display = state.descVisible ? "" : "none";
  $("descTick").textContent = state.descVisible ? "✓" : "";
  closeMenus();
});
$("miResetAll").addEventListener("click", () => {
  Object.values(ALL).forEach(resetSubtree);
  render(); closeMenus();
  toast("已重置全部修改");
});

document.addEventListener("mousedown", (e) => {
  if (!e.target.closest(".menu") && !e.target.closest("#btnMore") && !e.target.closest(".combo")) closeMenus();
});
document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeMenus(); });

/* ---------------- 列宽拖拽 / 单行高度调整 ---------------- */
(function () {
  const hit = $("dividerHit"), grid = $("grid");
  const applyLayout = () => {
    grid.style.setProperty("--name-w", state.nameW + "px");
    hit.style.left = state.nameW + "px";
  };
  applyLayout();

  // 列宽：左右拖动名称列分隔线
  let colDragging = false;
  hit.addEventListener("mousedown", (e) => { colDragging = true; document.body.classList.add("col-drag"); e.preventDefault(); });
  window.addEventListener("mousemove", (e) => {
    if (!colDragging) return;
    const x = e.clientX - grid.getBoundingClientRect().left;
    state.nameW = Math.min(340, Math.max(90, x));
    applyLayout();
  });
  window.addEventListener("mouseup", () => { colDragging = false; document.body.classList.remove("col-drag"); });
})();

/* 行间横线：拖拽只调整该行高度；双击恢复默认 */
function applyStoredRowHeight(row, n) {
  const h = state.rowHs.get(n.id);
  if (h) row.style.height = h + "px";
}
function attachRowLine(row, n) {
  const line = document.createElement("div");
  line.className = "row-line";
  line.title = "拖拽调整本行高度，双击恢复默认";
  line.addEventListener("mousedown", (e) => {
    e.preventDefault();
    const startY = e.clientY;
    const startH = row.getBoundingClientRect().height;
    line.classList.add("active");
    document.body.classList.add("row-drag");
    const move = (ev) => {
      const h = Math.min(200, Math.max(20, Math.round(startH + ev.clientY - startY)));
      state.rowHs.set(n.id, h);
      row.style.height = h + "px";
    };
    const up = () => {
      line.classList.remove("active");
      document.body.classList.remove("row-drag");
      window.removeEventListener("mousemove", move);
      window.removeEventListener("mouseup", up);
    };
    window.addEventListener("mousemove", move);
    window.addEventListener("mouseup", up);
  });
  line.addEventListener("dblclick", () => {
    state.rowHs.delete(n.id);
    row.style.height = "";
  });
  row.appendChild(line);
}

/* ---------------- 启动 ---------------- */
render();
selectProp(ALL["p01"]);
</script>
<script>
/* 外观菜单（与主原型 studio.js 同构）：明暗模式三选 + 界面配色网格（9 套，8 圆点色卡）。
 * 数据来自生成产物 assets/palette-meta.js（附录 A 投影）；切换即持久化，刷新后恢复并归一旧 Key。 */
(function () {
  var info = window.CodeWFPalettes;
  var menu = document.getElementById('appearanceMenu');
  var grid = document.getElementById('paletteGrid');
  var system = matchMedia('(prefers-color-scheme: dark)');
  var KEY = 'codewf-avalonia-appearance';
  if (!info || !menu) return;
  function alias(value) { return (window.CodeWFPaletteKey && window.CodeWFPaletteKey(value)) || value; }
  function order() {
    var all = info.list.map(function (key) { return info.entries[key]; });
    return all.filter(function (entry) { return entry.recommended; }).concat(all.filter(function (entry) { return !entry.recommended; }));
  }
  function currentMode() { return document.documentElement.dataset.themeMode || 'system'; }
  function apply() {
    var state = {};
    try { state = JSON.parse(localStorage.getItem(KEY) || '{}'); } catch (e) {}
    var palette = alias(state.palette || document.documentElement.dataset.palette || info.default);
    if (info.list.indexOf(palette) < 0) palette = info.default;
    var mode = ['light', 'dark', 'system'].indexOf(state.themeMode) >= 0 ? state.themeMode : currentMode();
    document.documentElement.dataset.palette = palette;
    document.documentElement.dataset.themeMode = mode;
    document.documentElement.dataset.theme = mode === 'system' ? (system.matches ? 'dark' : 'light') : mode;
    try { localStorage.setItem(KEY, JSON.stringify({ palette: palette, themeMode: mode })); } catch (e) {}
    // 只更新既有卡片的选中态；重建 DOM 会让正在处理点击的按钮脱离文档，菜单随之关闭。
    if (!grid.querySelector('button')) renderGrid();
    grid.querySelectorAll('button').forEach(function (button) {
      button.setAttribute('aria-pressed', String(button.dataset.palette === palette));
    });
    menu.querySelectorAll('input[name=codewf-theme-mode]').forEach(function (radio) { radio.checked = radio.value === mode; });
  }
  function renderGrid() {
    grid.innerHTML = order().map(function (entry) {
      var dots = entry.swatch.map(function (color) { return '<i style="background:' + color + '"></i>'; }).join('');
      return '<button type="button" data-palette="' + entry.key + '" aria-pressed="false" aria-label="' + entry.label + '">' +
        (entry.recommended ? '<em class="palette-badge">推荐</em>' : '') +
        '<span class="swatch-dots">' + dots + '</span>' +
        '<span class="palette-label"><b>' + entry.label + '</b><small>' + entry.note + '</small></span></button>';
    }).join('');
    grid.querySelectorAll('button').forEach(function (button) { button.onclick = function () { save(button.dataset.palette, currentMode()); }; });
  }
  function save(palette, mode) {
    try { localStorage.setItem(KEY, JSON.stringify({ palette: palette, themeMode: mode })); } catch (e) {}
    apply();
  }
  menu.querySelector('.theme-mode-options').addEventListener('change', function (event) { save(document.documentElement.dataset.palette, event.target.value); });
  document.addEventListener('click', function (event) { if (!event.target.closest('#appearanceMenu')) menu.open = false; });
  document.addEventListener('keydown', function (event) { if (event.key === 'Escape' && menu.open) { menu.open = false; menu.querySelector('summary').focus(); } });
  system.addEventListener('change', function () { if (currentMode() === 'system') apply(); });
  apply();
})();
</script>
