name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    name: 构建与测试
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # SourceLink 与 EmbedUntrackedSources 需要完整历史

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: 还原
        run: dotnet restore CodeWF.Avalonia.slnx

      - name: 验证 T4 国际化资源映射
        shell: pwsh
        run: ./scripts/sync_localization_keys.ps1 -Check

      - name: 构建
        run: dotnet build CodeWF.Avalonia.slnx -c Release --no-restore

      - name: 测试
        run: dotnet test CodeWF.Avalonia.slnx -c Release --no-build

  aot-smoke:
    name: AOT 冒烟（Demo 发布与运行）
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: AOT 发布 Demo
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          pwsh scripts/publish_avalonia_demo.ps1 -RuntimeIdentifier win-x64 2>&1 | Tee-Object -FilePath artifacts/aot-publish.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # 灰度门禁：先只卡「本仓代码产生的 IL 告警」（第三方整包摘要 IL2104/IL3053 与
      # 单文件反射提示按告警码白名单放行）。新增包必须保持 AOT 干净，否则这里红。
      - name: IL 裁剪告警门禁（本仓代码零告警）
        shell: pwsh
        run: pwsh scripts/tests/il_trim_warnings_test.ps1 -Log artifacts/aot-publish.log

      # 库侧主题令牌已逐变体字面量化（Themes/{Light,Dark,HighContrast}），逐色板渲染不再抛资源异常，
      # 因此冒烟按退出码阻塞流水线。
      - name: 运行冒烟演示
        run: artifacts\publish\win-x64\CodeWF.Avalonia.Demo\CodeWF.Avalonia.Demo.exe --smoke

      # 覆盖空洞：`--verify-runtime` 过去只在 release 工作流跑。12.2.21 的目录路由数写死成字面量，
      # CI 全绿、发版当场红。读的是同一份 win-x64 产物，日常提交顺手跑一遍，别再等打标签才发现。
      # 取退出码用 Process 而不是 $LASTEXITCODE：Demo 是 GUI 子系统程序，本机实测 pwsh 调它之后
      # $LASTEXITCODE 仍为空——按那个判等，自检再怎么过都会红。与 release.yml 的验证步保持同式。
      - name: 验证产物运行时自检
        shell: pwsh
        run: |
          $directory = Join-Path $env:RUNNER_TEMP ('ci-runtime-' + [guid]::NewGuid().ToString('N'))
          $start = [Diagnostics.ProcessStartInfo]::new((Resolve-Path './artifacts/publish/win-x64/CodeWF.Avalonia.Demo/CodeWF.Avalonia.Demo.exe').Path)
          $start.UseShellExecute = $false
          $start.CreateNoWindow = $true
          $start.ArgumentList.Add('--verify-runtime')
          $start.ArgumentList.Add($directory)
          $process = [Diagnostics.Process]::Start($start)
          if (-not $process.WaitForExit(30000)) { throw 'Native runtime verification timed out.' }
          if ($process.ExitCode -ne 0) { throw "Native runtime verification failed: $($process.ExitCode)" }
          $result = Get-Content -LiteralPath (Join-Path $directory 'runtime-verification.txt') -Raw
          if ($result -notmatch '^NativeAOT runtime verification passed;') { throw 'Native runtime evidence is missing.' }
          Write-Output $result

      - name: AOT 发布共享国际化离屏验证
        run: dotnet publish scripts/localization-verification/LocalizationVerification.csproj -c Release -r win-x64 -p:PublishAot=true -p:IlcGenerateCompleteTypeMetadata=true -p:IlcTrimMetadata=false -p:IlcSingleThreaded=true -o artifacts/aot-localization

      - name: 验证同一控件动态切语与业务资源覆盖
        run: artifacts\aot-localization\LocalizationVerification.exe artifacts/localization-fixture

      - name: 验证原生控件与通知交互配色
        run: artifacts\aot-localization\LocalizationVerification.exe --palette-audit artifacts/native-palette

  prototype-audit:
    name: 原型路由与语言审计
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: design/tests/package-lock.json
      - name: 验证目录生成物
        shell: pwsh
        run: ./scripts/sync_design_catalog.ps1 -Check
      - name: 安装审计依赖
        working-directory: design/tests
        run: npm ci
      - name: 安装 Chromium
        working-directory: design/tests
        run: npx playwright install --with-deps chromium
      - name: 检查路由、语言和导航
        working-directory: design/tests
        run: npm test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: prototype-audit-failure
          path: design/tests/artifacts/

  packaging-contract:
    name: 安装包布局与失败传播
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 验证 macOS 打包契约
        run: bash scripts/tests/macos_packaging_test.sh

      - name: 验证单文件原型跨平台换行一致性
        shell: pwsh
        run: ./scripts/tests/prototype_newlines_test.ps1
      - name: 验证五平台安装包门禁
        shell: pwsh
        run: ./scripts/tests/release_installers_test.ps1

      - name: 验证 Linux 安装结构与失败传播
        shell: pwsh
        run: ./scripts/tests/linux_packaging_test.ps1
