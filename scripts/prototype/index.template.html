<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark" data-palette="dotnet" data-density="cozy">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CodeWF.Avalonia.Demo — 原型</title>
<style>
/* ═══════════ 色板（6 色板 × 浅深，对应 ACSemiTheme ThemeDictionaries） ═══════════ */
:root{
  --pri:#0064fa;--pri-h:#0057d4;--pri-lt:rgba(0,100,250,.09);
  --bg:#fff;--bg2:#f5f6f8;--bg3:#eef0f3;--tx:#1c1f23;--tx2:#5c626b;--tx3:#757c85;
  --bd:#d9dce1;--bd2:#e6e8ec;--hov:#eef0f3;--sel:#e3edff;--workbg:#e4e7ec;
  --ok:#1f8a3b;--warn:#e8a103;--warn-tx:#3a2a00;--err:#c62828;
  /* 外观字号令牌（对应 Markdown 排版主题接管字号前的基础值） */
  --fs-crumb:11px;--fs-h1:19px;--fs-dsc:12.5px;--fs-tag:10.5px;--fs-code:11.5px;--fs-body:13px;
  /* 间距节奏：4 / 8 / 12 / 16 */
  --sp1:4px;--sp2:8px;--sp3:12px;--sp4:16px;
  --density:var(--sp2);
}
[data-palette=aqua]{--pri:#0091a8;--pri-h:#007a8e;--pri-lt:rgba(0,145,168,.10);--sel:#dff5f8}
[data-palette=desert]{--pri:#c26a1d;--pri-h:#a85a15;--pri-lt:rgba(194,106,29,.10);--sel:#faf0e2}
[data-palette=dusk]{--pri:#7a5cc4;--pri-h:#654aa8;--pri-lt:rgba(122,92,196,.10);--sel:#efe9fb}
[data-palette=night]{--pri:#2b6cb0;--pri-h:#245a96;--pri-lt:rgba(43,108,176,.10);--sel:#e2edf9}
[data-palette=contrast]{--pri:#000;--pri-h:#000;--pri-lt:rgba(0,0,0,.08);--sel:#eee}
[data-theme=dark]{
  --bg:#1b1b1f;--bg2:#232327;--bg3:#2a2a30;--tx:#e6e6e8;--tx2:#b3b8c0;--tx3:#8d939c;
  --bd:#3a3a40;--bd2:#2b2b30;--hov:#2a2a30;--sel:#1d2c44;--workbg:#111114;
}
[data-theme=dark][data-palette=default]{--pri:#4d9aff;--pri-h:#6cadff;--pri-lt:rgba(77,154,255,.14);--sel:#1d2c44}
[data-theme=dark][data-palette=aqua]{--pri:#2ec3dd;--pri-h:#4fd0e8;--sel:#123c44}
[data-theme=dark][data-palette=desert]{--pri:#e8a355;--pri-h:#efb56f;--sel:#443318}
[data-theme=dark][data-palette=dusk]{--pri:#a98ae0;--pri-h:#bca0e8;--sel:#322a4a}
[data-theme=dark][data-palette=night]{--pri:#5b93cf;--pri-h:#74a8db;--sel:#1a2a3e}
[data-theme=dark][data-palette=contrast]{--pri:#fff;--pri-h:#fff;--pri-lt:rgba(255,255,255,.12);--sel:#333}
/* 高对比白底：主色白不可用于文字，正文色调成纯黑 */
[data-palette=contrast] .cap .lg,[data-palette=contrast] .cap .ver{color:#fff}
[data-palette=contrast] .bd h1{color:var(--tx)}

/* 密度：舒适 / 紧凑（属性面板密度切换） */
[data-density=compact]{--density:var(--sp1)}
[data-density=compact] .dt{height:auto}
[data-density=compact] .tree .lf{height:22px}

/* ═══════════ 桌面背景 + 窗口卡片（不铺满，看得出是桌面软件） ═══════════ */
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:
    radial-gradient(1200px 600px at 20% 0%,#1d2b53 0%,transparent 60%),
    radial-gradient(1000px 700px at 85% 100%,#0f3460 0%,transparent 55%),
    linear-gradient(135deg,#0b1322 0%,#101b30 100%);
  display:flex;align-items:center;justify-content:center;
  padding:14px;font:13px/1.6 "Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;color:var(--tx);
  overflow:hidden;user-select:none;
}
.win{
  width:min(1480px,100%);height:100%;min-height:640px;
  background:var(--bg);border-radius:10px;overflow:hidden;
  border:1px solid rgba(255,255,255,.14);
  box-shadow:0 24px 70px rgba(0,0,0,.55),0 4px 14px rgba(0,0,0,.35);
  display:grid;grid-template-rows:34px 32px auto 1fr 28px;
}
button,input,select,textarea{font:inherit;color:inherit}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:var(--bd);border-radius:5px;border:2px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-thumb:hover{background:var(--tx3)}

/* ═══ 通用：线性图标（stroke 走 currentColor，对齐 IconPark / TDesign 风格） ═══ */
.svgic{display:block;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none;transition:transform .16s ease}
.svgic.s14{width:14px;height:14px}
.svgic.s16{width:16px;height:16px}
.svgic.s18{width:18px;height:18px}
.svgic.s20{width:20px;height:20px}
.svgic.s22{width:22px;height:22px}

/* ═══ 1. 标题栏 34px（CodeWFWindow） ═══ */
.cap{display:flex;align-items:center;height:34px;padding-left:10px;gap:8px;position:relative;
  background:linear-gradient(90deg,var(--pri) 0%,var(--pri-h) 26%,rgba(0,0,0,0) 58%),var(--bg2);
  border-bottom:1px solid var(--bd)}
.cap .logo{width:20px;height:20px;border-radius:5px;display:block;flex:none;
  box-shadow:0 1px 5px rgba(0,0,0,.3),0 0 0 1px rgba(255,255,255,.22)}
.cap .lg{font-weight:700;color:#fff;letter-spacing:.4px;font-size:13px;text-shadow:0 1px 2px rgba(0,0,0,.35)}
.cap .vbadge{font-size:10px;padding:0 7px;line-height:16px;border-radius:999px;color:#fff;
  background:rgba(255,255,255,.20);border:1px solid rgba(255,255,255,.34)}
.cap .sp{flex:1}
.cap select{height:22px;font-size:11px;border:1px solid var(--bd);border-radius:4px;background:var(--bg);color:var(--tx)}
.cap .wb{width:40px;height:34px;display:flex;align-items:center;justify-content:center;
  border:none;background:transparent;cursor:pointer;color:var(--tx2);transition:background .12s,color .12s}
.cap .wb svg{width:12px;height:12px;stroke:currentColor;stroke-width:1.3;fill:none;stroke-linecap:round;stroke-linejoin:round}
.cap .wb:hover{background:var(--hov);color:var(--tx)}
.cap .wb:focus-visible{outline:2px solid var(--pri);outline-offset:-2px}
.cap .wb.cls:hover{background:var(--err);color:#fff}
.cap .pal{display:inline-flex;gap:5px;align-items:center;margin:0 2px}
.cap .pal i{width:12px;height:12px;border-radius:50%;cursor:pointer;border:1px solid rgba(128,128,128,.55);display:block;transition:transform .12s,box-shadow .12s}
.cap .pal i:hover{transform:scale(1.25)}
.cap .pal i.on{box-shadow:0 0 0 2px var(--bg),0 0 0 3.5px var(--pri)}

/* ═══ 2. Ribbon 页签行 32px ═══ */
.rtabs{display:flex;align-items:center;height:32px;padding:0 10px;gap:2px;background:var(--bg);border-bottom:1px solid var(--bd)}
.qk{display:flex;align-items:center;gap:2px;margin-right:10px;padding-right:12px;border-right:1px solid var(--bd2)}
.qk button{width:28px;height:26px;display:flex;align-items:center;justify-content:center;border:none;background:transparent;
  border-radius:4px;cursor:pointer;color:var(--tx2);transition:background .12s,color .12s}
.qk button:hover{background:var(--hov);color:var(--pri)}
.qk button:focus-visible{outline:2px solid var(--pri);outline-offset:-2px}
.rt2{display:flex;align-items:center;height:100%;gap:2px;overflow-x:auto;overflow-y:hidden;flex-wrap:nowrap}
.rt2 .t2{display:inline-flex;align-items:center;gap:6px;flex:none;padding:0 14px;height:100%;cursor:pointer;
  color:var(--tx2);font-size:12.5px;user-select:none;letter-spacing:.6px;position:relative;white-space:nowrap;
  border-radius:4px 4px 0 0;transition:background .12s,color .12s}
.rt2 .t2 .svgic{display:inline-block;vertical-align:-2px}
.rt2 .t2:hover{color:var(--pri);background:var(--hov)}
.rt2 .t2:focus-visible{outline:2px solid var(--pri);outline-offset:-4px}
.rt2 .t2.on{color:var(--pri);font-weight:600}
.rt2 .t2.on::after{content:"";position:absolute;left:14px;right:14px;bottom:0;height:2px;background:var(--pri);border-radius:2px 2px 0 0}
.qk2{margin-left:auto;display:flex;align-items:center;gap:2px;padding-left:10px}
.qk2 button{height:26px;display:inline-flex;align-items:center;gap:6px;border:1px solid transparent;background:transparent;
  border-radius:4px;cursor:pointer;color:var(--tx2);font-size:11px;padding:0 9px;white-space:nowrap;
  transition:background .12s,color .12s,border-color .12s}
.qk2 button:hover{background:var(--hov);color:var(--pri);border-color:var(--bd)}
.qk2 button .kbd{color:var(--tx3);font-size:10px;letter-spacing:.2px}
.qk2 button:focus-visible{outline:2px solid var(--pri);outline-offset:-2px}

/* ═══ 3. Ribbon 命令区：104px 展开 / 0 收起（高度够放下「图标 + 文字 + 分组名」） ═══ */
.rbn{background:var(--bg);border-bottom:1px solid var(--bd);padding:var(--sp2) var(--sp4) 0;
  height:104px;display:flex;align-items:stretch;overflow-x:auto;overflow-y:hidden;
  transition:height .16s ease,padding .16s ease,opacity .12s ease}
body.rmn .rbn{padding-top:0;padding-bottom:0;height:0;opacity:0;border-bottom:none;overflow:hidden}
.grp{display:flex;flex-direction:column;gap:2px;padding:0 var(--sp3) 6px;border-right:1px solid var(--bd2);flex:none}
.grp:last-child{border-right:none}
.grp .cmds{display:flex;gap:2px;flex:1;align-items:flex-start;flex-wrap:wrap;align-content:flex-start}
.grp .gname{text-align:center;font-size:10.5px;color:var(--tx2);font-weight:700;letter-spacing:1.5px;padding:4px 0 2px}
.cbtn{display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:6px;
  width:74px;height:68px;padding:8px 4px 4px;border:none;background:transparent;cursor:pointer;
  border-radius:7px;color:var(--tx);transition:background .13s ease,transform .13s ease}
.cbtn:hover{background:var(--hov)}
.cbtn:hover .svgic{transform:translateY(-1px) scale(1.06)}
.cbtn:active{background:var(--pri-lt);transform:scale(.97)}
.cbtn:focus-visible{outline:2px solid var(--pri);outline-offset:-2px}
.cbtn[aria-pressed=true]{background:var(--sel);color:var(--pri)}
.cbtn.on{background:var(--sel);color:var(--pri)}
.cbtn .ic{height:22px;display:flex;align-items:center;justify-content:center;color:var(--pri)}
.cbtn .lb{font-size:11px;line-height:1.3;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:68px}
.cbtn:disabled,.cbtn[disabled]{opacity:.45;cursor:not-allowed;background:transparent}

/* ═══ 4. 主内容 = Dock 工作区 ═══ */
.main{flex:1;min-height:0;display:flex;flex-direction:column;gap:var(--sp2);padding:var(--sp2) 10px;background:var(--workbg);overflow:hidden}
.dockrow{flex:1;min-height:0;display:flex;gap:var(--sp2)}
.panel{background:var(--bg);border:1px solid var(--bd);border-radius:8px;display:flex;flex-direction:column;
  overflow:hidden;min-height:0;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.phd{display:flex;align-items:center;height:30px;flex:none;padding:0 10px;background:var(--bg2);
  border-bottom:1px solid var(--bd);font-size:11px;font-weight:700;color:var(--tx2);gap:7px;letter-spacing:.5px}
.phd .hdic{color:var(--pri);display:flex;align-items:center}
.phd .cnt{margin-left:auto;font-weight:600;color:var(--tx3);font-size:10px;background:var(--bg3);
  border-radius:999px;padding:0 7px;line-height:16px}
.phd .tb{display:flex;gap:2px;margin-left:6px}
.phd .tb button{min-width:24px;height:20px;display:inline-flex;align-items:center;justify-content:center;
  border:none;background:transparent;cursor:pointer;border-radius:3px;
  color:var(--tx2);font-size:11px;white-space:nowrap;padding:0 5px;transition:background .12s,color .12s}
.phd .tb button:hover{background:var(--pri-lt);color:var(--pri)}
.phd .tb button:focus-visible{outline:2px solid var(--pri);outline-offset:-2px}
.pbd{flex:1;min-height:0;overflow:auto}
.p-nav{width:224px;flex:none}
body.hideL .p-nav{display:none}
.p-props{width:266px;flex:none}
body.hideR .p-props{display:none}
.p-log{height:150px;flex:none}
body.hideLog .p-log{display:none}

/* 左：导航树（含就地重命名 / 过滤 / 空态） */
.tree{padding:5px}
.tree .fnd{display:flex;gap:4px;padding:2px 4px 6px}
.tree .fnd input{flex:1;height:24px;font-size:11.5px;padding:0 7px;border:1px solid var(--bd);border-radius:5px;background:var(--bg);color:var(--tx)}
.tree .fnd input:focus{outline:none;border-color:var(--pri)}
.tree .nd{user-select:none}
.tree .nd .hd{display:flex;align-items:center;gap:5px;height:27px;padding:0 6px;border-radius:5px;cursor:pointer;color:var(--tx)}
.tree .nd .hd:hover{background:var(--hov)}
.tree .nd .hd .arw{width:12px;font-size:9px;color:var(--tx3);transition:transform .12s}
.tree .nd.open>.hd .arw{transform:rotate(90deg)}
.tree .nd .hd .gi{font-size:12px}
.tree .nd .kids{display:none;margin-left:15px;border-left:1px solid var(--bd2);padding-left:5px}
.tree .nd.open>.kids{display:block}
.tree .lf{display:flex;align-items:center;gap:6px;height:26px;padding:0 6px 0 10px;border-radius:5px;
  cursor:pointer;color:var(--tx2);font-size:12px}
.tree .lf:hover{background:var(--hov);color:var(--tx)}
.tree .lf.on{background:var(--sel);color:var(--pri);font-weight:600}
.tree .lf .ic{font-size:11px}
.tree .lf .sp2{flex:1}
.tree .lf .hbtn{visibility:hidden;border:none;background:transparent;color:var(--tx3);cursor:pointer;font-size:11px}
.tree .lf:hover .hbtn{visibility:visible}
.tree .lf .hbtn:hover{color:var(--pri)}
.tree .lf input.rnm{width:100%;height:20px;font-size:12px;padding:0 4px;border:1px solid var(--pri);border-radius:3px;background:var(--bg);color:var(--tx)}
.tree .empty{padding:14px 10px;color:var(--tx3);font-size:11px;text-align:center}

/* 中：文档面板（梯形页签 + 空态） */
.dts{display:flex;align-items:flex-end;height:32px;flex:none;padding:5px 8px 0;gap:4px;background:var(--bg2);
  border-bottom:1px solid var(--bd);overflow-x:auto}
.dts .dkb{display:flex;gap:3px;margin-right:8px;align-self:center}
.dts .dkb button{border:1px solid var(--bd);background:var(--bg);border-radius:4px;padding:2px 8px;
  cursor:pointer;font-size:10px;color:var(--tx2)}
.dts .dkb button:hover{border-color:var(--pri);color:var(--pri)}
.dts .dkb button:focus-visible{outline:2px solid var(--pri);outline-offset:1px}
.dt{display:flex;align-items:center;gap:8px;padding:5px 8px 5px 16px;cursor:pointer;font-size:12px;color:var(--tx2);
  background:var(--bg3);border:1px solid var(--bd2);border-bottom:none;
  clip-path:polygon(10px 0,100% 0,calc(100% - 10px) 100%,0 100%);user-select:none;white-space:nowrap}
.dt:hover{color:var(--tx)}
.dt.on{background:var(--bg);color:var(--tx);font-weight:600;border-bottom:2px solid var(--pri)}
.dt .x{width:14px;height:14px;display:flex;align-items:center;justify-content:center;border-radius:3px;font-size:10px;color:var(--tx3)}
.dt .x:hover{background:var(--err);color:#fff}
.dbody{flex:1;min-height:0;overflow:auto;padding:var(--sp3) var(--sp4) 26px}
.doc .crumb{font-size:12px;color:var(--tx3);margin-bottom:6px;display:flex;align-items:center;gap:6px}
.doc .crumb svg{color:var(--tx3)}
.doc h1{font-size:19px;margin-bottom:4px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.doc .alias{font-size:11.5px;color:var(--tx3);font-family:Consolas,monospace;margin:-2px 0 6px;letter-spacing:.2px}
.doc .dsc{color:var(--tx2);font-size:var(--fs-dsc);margin-bottom:var(--sp3);line-height:1.7}
.ftg{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.ftg span{font-size:var(--fs-tag);padding:1px 9px;border-radius:10px;background:var(--pri-lt);color:var(--pri);font-weight:600}
.smt{display:inline-flex;border:1px solid var(--bd);border-radius:6px;overflow:hidden;margin-bottom:14px}
.smt button{border:none;background:var(--bg2);padding:4px 18px;cursor:pointer;font-size:11px;color:var(--tx2)}
.smt button.on{background:var(--pri);color:#fff;font-weight:600}
.smcode{background:var(--bg3);border:1px solid var(--bd2);border-radius:6px;padding:12px 14px;
  font-family:Consolas,monospace;font-size:var(--fs-code);line-height:1.65;white-space:pre;overflow:auto;
  max-height:300px;margin-bottom:14px;color:var(--tx)}
.demo{border:1px solid var(--bd2);border-radius:8px;padding:var(--sp4);background:var(--bg);margin-bottom:var(--sp3)}
.demo h4{font-size:12px;color:var(--tx3);font-weight:600;margin-bottom:10px;letter-spacing:.5px}
.row{display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.hint{font-size:11px;color:var(--tx3);margin-top:8px;line-height:1.6}
.btn{border:1px solid var(--bd);background:var(--bg);border-radius:5px;padding:5px 16px;cursor:pointer;font-size:12px}
.btn:hover{border-color:var(--pri);color:var(--pri)}
.btn:focus-visible{outline:2px solid var(--pri);outline-offset:1px}
.btn.pri{border-color:var(--pri);color:var(--pri);background:var(--pri-lt)}
.btn.danger{border-color:var(--err);color:var(--err)}
.btn.danger:hover{background:var(--err);color:#fff;border-color:var(--err)}
.btn:disabled{opacity:.45;cursor:not-allowed}

/* Markdown */
.mdr{max-width:780px;font-size:var(--fs-body);line-height:1.85}
.mdr h1,.mdr h2,.mdr h3{color:var(--pri);margin:12px 0 8px}
.mdr p{margin:8px 0}
.mdr code{background:var(--bg3);padding:1px 6px;border-radius:3px;font-family:Consolas,monospace;font-size:12px}
.mdr pre{background:var(--bg3);border:1px solid var(--bd2);border-radius:6px;padding:10px 14px;overflow:auto;
  font-family:Consolas,monospace;font-size:12px;margin:10px 0;line-height:1.6}
.mdr blockquote{border-left:3px solid var(--pri);padding:4px 14px;margin:10px 0;background:var(--pri-lt);border-radius:0 4px 4px 0}
.mdr table{border-collapse:collapse;margin:10px 0;font-size:12px}
.mdr th,.mdr td{border:1px solid var(--bd);padding:5px 14px}
.mdr th{background:var(--bg2)}
.mdr ul{padding-left:22px}
.mdr input[type=checkbox]{accent-color:var(--pri)}

/* DataGrid */
.dg{border-collapse:collapse;width:100%;font-size:12px}
.dg th,.dg td{padding:7px 16px;text-align:left}
.dg th{background:var(--bg2);font-weight:600;cursor:pointer;user-select:none;white-space:nowrap}
.dg th:hover{background:var(--hov)}
.dg th .arr{color:var(--pri);margin-left:3px}
.dg tbody tr{border-bottom:1px solid var(--bd2)}
.dg tbody tr:hover{background:var(--hov)}
.dg tbody tr.on{background:var(--sel)}

/* 右：属性面板 */
.pgp{padding:2px 6px 12px}
.pgp .cat{font-size:10px;font-weight:700;color:var(--pri);padding:9px 4px 3px;letter-spacing:1px;
  border-bottom:1px solid var(--bd2);margin-bottom:3px;text-transform:uppercase}
.pgp .rw{display:grid;grid-template-columns:100px 1fr;align-items:center;min-height:28px;padding:1px 4px 1px 7px;border-radius:4px;gap:6px;position:relative}
.pgp .rw:hover{background:var(--hov)}
.pgp .rw.mod::before{content:"";position:absolute;left:0;top:4px;bottom:4px;width:2px;border-radius:2px;background:var(--pri)}
.pgp .rw.mod label{color:var(--tx);font-weight:600}
.pgp label{font-size:11px;color:var(--tx2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pgp .ctl{display:flex;justify-content:flex-end}
.pgp .ctl input[type=text],.pgp .ctl select{width:100%;height:24px;font-size:11px;padding:0 6px;text-align:left;
  border:1px solid var(--bd);border-radius:4px;background:var(--bg);color:var(--tx);outline:none}
.pgp .ctl input:focus,.pgp .ctl select:focus{border-color:var(--pri)}
.pgp .ctl input[type=range]{width:100%;accent-color:var(--pri)}
.pgp .switch{width:32px;height:17px;border-radius:9px;background:var(--bd);position:relative;cursor:pointer;transition:background .12s}
.pgp .switch.on{background:var(--pri)}
.pgp .switch::after{content:"";position:absolute;width:13px;height:13px;border-radius:50%;background:#fff;top:2px;left:2px;transition:left .12s}
.pgp .switch.on::after{left:17px}
.pgp-empty{padding:16px 10px;color:var(--tx3);font-size:11px;line-height:1.7}

/* 底部日志面板 */

.guide-mask{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:90;display:none}

/* ═══ 动效（设计感）：淡化 / 弹出 / 滑入 / 进度 / 页签切换 ═══ */
@keyframes fadein{from{opacity:0}to{opacity:1}}

.rkbar{height:4px;border-radius:3px;background:var(--bg3);overflow:hidden;margin-top:6px}
.rkbar i{display:block;height:100%;background:var(--pri);width:0;transition:width .35s ease}
.rk.done .rkbar i{background:var(--ok)}
.tbar .tm{font-variant-numeric:tabular-nums;padding:0 6px;border-radius:999px;background:var(--bg3)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* WindowedStackPanel */
.wsp{height:280px;overflow:auto;border:1px solid var(--bd);border-radius:6px;background:var(--bg)}
.wsp .blk{padding:8px 12px;border-bottom:1px solid var(--bd2);font-size:11px;color:var(--tx2);display:flex;justify-content:space-between}

/* ColumnDisplay 拖拽 */
.cde .it{display:flex;align-items:center;gap:8px;padding:6px 10px;border:1px solid var(--bd);border-radius:5px;

/* Dock 工作区模拟（Dock 演示页内） */
.dockws{display:flex;height:calc(100vh - 420px);min-height:340px;border:1px solid var(--bd);border-radius:8px;overflow:hidden;background:var(--workbg)}
.dockws .tool{width:210px;border-right:1px solid var(--bd);background:var(--bg);display:flex;flex-direction:column}

.dockws .tool .th{display:flex;align-items:center;justify-content:space-between;padding:5px 10px;background:var(--bg2);
  font-size:11px;font-weight:600;color:var(--tx2);border-bottom:1px solid var(--bd)}

.dockws .dtabs{display:flex;align-items:flex-end;background:var(--bg2);padding:5px 8px 0;gap:4px;border-bottom:1px solid var(--bd)}
.dockws .dtabs .t{padding:5px 15px;background:var(--bg3);border:1px solid var(--bd2);border-bottom:none;
  border-radius:6px 6px 0 0;font-size:11px;cursor:pointer;color:var(--tx2)}
.dockws .dtabs .t.on{background:var(--bg);color:var(--pri);font-weight:600}
.dockws .dbody{flex:1;overflow:auto;padding:16px 20px;background:var(--bg)}
.dockws .dtool{display:flex;gap:6px;padding:5px 8px;background:var(--bg2);border-bottom:1px solid var(--bd)}
.dockws .dtool button{border:1px solid var(--bd);background:var(--bg);border-radius:4px;padding:2px 10px;
  cursor:pointer;font-size:10px;color:var(--tx2)}

/* ═══ 场景页：工作流轨道 + 子标签 ═══ */
.flow{position:relative;display:flex;align-items:center;gap:0;flex-wrap:wrap;margin-bottom:14px;
  padding:10px 12px;border:1px solid var(--bd);border-radius:10px;
  background:linear-gradient(180deg,var(--bg2),var(--bg))}
.flow::after{content:"";position:absolute;left:18px;right:18px;top:50%;height:2px;border-radius:2px;
  background:linear-gradient(90deg,var(--bd2),var(--bd),var(--bd2));z-index:0}
.flow .st{position:relative;z-index:1;display:flex;align-items:center;gap:7px;margin-right:14px;
  padding:4px 12px 4px 5px;border-radius:999px;border:1px solid var(--bd);background:var(--bg);
  font-size:11.5px;color:var(--tx2);cursor:pointer;transition:all .16s ease}
.flow .st:hover{border-color:var(--pri);color:var(--pri);transform:translateY(-1px)}
.flow .st .n{width:16px;height:16px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  background:var(--bg3);color:var(--tx3);font-size:10px;font-weight:700;flex:none}
.flow .st .si{display:none}
.flow .st.cur{border-color:var(--pri);background:var(--pri-lt);color:var(--pri);font-weight:700;
  box-shadow:0 0 0 3px var(--pri-lt)}

.subtabs{display:flex;gap:2px;border-bottom:1px solid var(--bd);margin-bottom:12px;flex-wrap:wrap}

  border-bottom:2px solid transparent;margin-bottom:-1px}

.subtabs button.on{color:var(--pri);font-weight:600;border-bottom-color:var(--pri)}

/* ═══ 空态 / 骨架屏 / 忙碌 / 错误卡片 / 通知中心 ═══ */
.empty{padding:26px 16px;text-align:center;color:var(--tx3)}
.empty .ei{font-size:26px;line-height:1.2;opacity:.75}
.empty .et{margin:8px 0 2px;font-size:12.5px;color:var(--tx2);font-weight:600}
.empty .ed{font-size:11px;line-height:1.7;margin-bottom:12px}

.skel i{display:block;height:10px;border-radius:5px;margin-bottom:9px;

.busy{padding:20px 14px;text-align:center}
.busy .bt{font-size:12px;color:var(--tx2);margin-bottom:10px}

.errc .eh{color:var(--err);font-weight:700;font-size:12.5px;margin-bottom:4px}
.errc .eb{font-size:11.5px;color:var(--tx2);line-height:1.7;margin-bottom:10px}
.nc{position:fixed;right:18px;bottom:44px;z-index:80;display:flex;flex-direction:column;gap:8px;max-width:330px}

  box-shadow:0 8px 26px rgba(0,0,0,.28);padding:9px 12px;display:flex;gap:8px;align-items:flex-start;

.nc .ncard.w{border-left-color:var(--warn)}
.nc .ncard.e{border-left-color:var(--err)}

.nc .ncard .nb{font-size:11px;color:var(--tx2);line-height:1.6}
.nc .ncard .nx{margin-left:auto;border:none;background:transparent;cursor:pointer;color:var(--tx3);font-size:12px}
.nc .ncard .nx:hover{color:var(--err)}

.cpm{position:fixed;inset:0;z-index:95;display:none;justify-content:center;align-items:flex-start;
